<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - NovelCraft</title>
  <script src="/common.js"></script>
  <style>
    .admin-layout { display: flex; min-height: calc(100vh - 60px); }

    /* ── 사이드바 ── */
    .admin-sidebar {
      width: 220px; background: var(--bg2);
      border-right: 1px solid var(--border); flex-shrink: 0;
      padding: 24px 0; position: sticky; top: 60px;
      height: calc(100vh - 60px); overflow-y: auto;
    }
    .admin-sidebar__logo {
      padding: 0 20px 20px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .admin-sidebar__logo-text { font-weight: 700; font-size: 0.9rem; color: var(--warning); }
    .admin-sidebar__role {
      font-size: 0.7rem; color: var(--text3); margin-top: 2px;
    }
    .admin-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; color: var(--text2); text-decoration: none;
      font-size: 0.875rem; transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .admin-nav-item:hover { background: var(--surface); color: var(--text); }
    .admin-nav-item.active {
      background: rgba(124,90,240,0.1); color: var(--primary-light);
      border-left-color: var(--primary); font-weight: 600;
    }
    .admin-nav-item__icon { font-size: 1rem; width: 20px; text-align: center; }
    .admin-sidebar__divider {
      height: 1px; background: var(--border); margin: 10px 20px;
    }
    .admin-sidebar__section {
      padding: 8px 20px 4px; font-size: 0.68rem; font-weight: 700;
      color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em;
    }

    /* ── 메인 ── */
    .admin-main { flex: 1; padding: 28px 32px; overflow-x: hidden; }
    .admin-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 24px;
    }
    .admin-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.5rem; font-weight: 700;
    }
    .admin-subtitle { color: var(--text3); font-size: 0.85rem; margin-top: 4px; }
    .admin-header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .live-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: #ef4444; font-weight: 700;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
    }
    .live-dot-red {
      width: 7px; height: 7px; border-radius: 50%; background: #ef4444;
      animation: livePulse 1.5s infinite;
    }
    @keyframes livePulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    .last-updated { font-size: 0.78rem; color: var(--text3); }

    /* ── 모드 토글 ── */
    .mode-toggle { display: flex; gap: 8px; margin-bottom: 24px; }
    .mode-btn {
      padding: 8px 20px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text3); font-size: 0.85rem; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .mode-btn.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }
    .mode-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary-light); }

    /* ── History 날짜바 ── */
    .history-bar {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
      padding: 14px 18px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
    }

    /* ── KPI 카드 ── */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px;
      position: relative; overflow: hidden;
    }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .kpi-card--users::before { background: #3b82f6; }
    .kpi-card--novels::before { background: #10b981; }
    .kpi-card--revenue::before { background: var(--accent); }
    .kpi-card--mentors::before { background: #a855f7; }
    .kpi-card__icon { font-size: 1.5rem; margin-bottom: 10px; }
    .kpi-card__label {
      font-size: 0.75rem; color: var(--text3); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
    }
    .kpi-card__value {
      font-size: 2rem; font-weight: 700;
      font-family: 'Noto Serif KR', serif; line-height: 1;
      min-height: 2rem; display: flex; align-items: center;
    }
    .kpi-card__sub { font-size: 0.75rem; color: var(--text3); margin-top: 8px; }
    .kpi-card--users .kpi-card__value { color: #60a5fa; }
    .kpi-card--novels .kpi-card__value { color: #34d399; }
    .kpi-card--revenue .kpi-card__value { color: var(--accent); }
    .kpi-card--mentors .kpi-card__value { color: #c084fc; }

    /* ── 차트 ── */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px;
    }
    .chart-card__title {
      font-size: 0.9rem; font-weight: 700; margin-bottom: 18px; color: var(--text2);
    }
    .bar-chart { display: flex; flex-direction: column; gap: 12px; }
    .bar-item { display: flex; align-items: center; gap: 10px; }
    .bar-label { font-size: 0.78rem; color: var(--text3); min-width: 56px; }
    .bar-track {
      flex: 1; height: 22px; background: var(--bg2);
      border-radius: 4px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
      min-width: 2px;
    }
    .bar-value {
      font-size: 0.8rem; font-weight: 700; min-width: 52px; text-align: right;
    }

    /* ── 최근 테이블 ── */
    .recent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .recent-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .recent-card__header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .recent-card__title { font-size: 0.9rem; font-weight: 700; }
    .recent-card__more {
      font-size: 0.78rem; color: var(--primary-light); text-decoration: none;
      transition: color 0.2s;
    }
    .recent-card__more:hover { color: var(--primary); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      padding: 9px 14px; font-size: 0.7rem; font-weight: 700; color: var(--text3);
      text-align: left; background: var(--bg2);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .data-table td {
      padding: 11px 14px; font-size: 0.825rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── 상태 뱃지 ── */
    .st-badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600;
    }
    .st-pending  { background: rgba(245,158,11,0.15);  color: #f59e0b;  border: 1px solid rgba(245,158,11,0.3); }
    .st-resolved { background: rgba(16,185,129,0.15);  color: #10b981;  border: 1px solid rgba(16,185,129,0.3); }
    .st-rejected { background: rgba(239,68,68,0.15);   color: #ef4444;  border: 1px solid rgba(239,68,68,0.3); }
    .st-approved { background: rgba(99,102,241,0.15);  color: #818cf8;  border: 1px solid rgba(99,102,241,0.3); }
    .st-closed   { background: rgba(107,114,128,0.15); color: #9ca3af;  border: 1px solid rgba(107,114,128,0.3); }

    /* ── 반응형 ── */
    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 1024px) {
      .charts-grid { grid-template-columns: 1fr; }
      .recent-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .admin-sidebar { display: none; }
      .admin-main { padding: 16px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<nav id="nc-nav"></nav>

<div class="admin-layout">
  <!-- 사이드바 -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <div>
        <div class="admin-sidebar__logo-text">⚙ 관리자</div>
        <div class="admin-sidebar__role" id="sidebar-role-label">ADMIN</div>
      </div>
    </div>
    <div class="admin-sidebar__section">메뉴</div>
    <a href="/admin.html" class="admin-nav-item active">
      <span class="admin-nav-item__icon">📊</span> 대시보드
    </a>
    <a href="/admin-reports.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">🚨</span> 신고 관리
    </a>
    <a href="/admin-mentors.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">🎓</span> 멘토 신청
    </a>
    <div class="admin-sidebar__divider"></div>
    <a href="/admin-users.html" class="admin-nav-item" id="super-nav-users" style="display:none">
      <span class="admin-nav-item__icon">👥</span> 사용자 관리
    </a>
    <div class="admin-sidebar__divider"></div>
    <a href="/index.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">🏠</span> 메인으로
    </a>
  </aside>

  <!-- 메인 콘텐츠 -->
  <main class="admin-main">
    <div class="admin-header">
      <div>
        <div class="admin-title">📊 관리자 대시보드</div>
        <div class="admin-subtitle" id="dashboard-subtitle">NovelCraft 종합 지표</div>
      </div>
      <div class="admin-header-right">
        <div class="live-indicator" id="live-indicator" style="display:none">
          <div class="live-dot-red"></div> LIVE
        </div>
        <span class="last-updated" id="last-updated"></span>
      </div>
    </div>

    <!-- 모드 토글 -->
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="v2" onclick="switchMode('v2')">📈 종합 현황</button>
      <button class="mode-btn" data-mode="live" onclick="switchMode('live')">🔴 실시간</button>
      <button class="mode-btn" data-mode="history" onclick="switchMode('history')">📅 날짜별</button>
    </div>

    <!-- 날짜 선택 (History 모드) -->
    <div class="history-bar" id="history-bar" style="display:none">
      <span style="font-size:0.875rem;font-weight:600;color:var(--text2)">📅 기준 날짜</span>
      <input type="date" class="nc-input" id="history-date" style="max-width:200px">
      <button class="nc-btn nc-btn--primary nc-btn--sm" onclick="loadHistory()">조회</button>
    </div>

    <!-- KPI 카드 -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-card--users">
        <div class="kpi-card__icon">👤</div>
        <div class="kpi-card__label">신규 사용자</div>
        <div class="kpi-card__value" id="kpi-users"><div class="nc-spinner" style="width:22px;height:22px"></div></div>
        <div class="kpi-card__sub" id="kpi-users-sub">로딩 중...</div>
      </div>
      <div class="kpi-card kpi-card--novels">
        <div class="kpi-card__icon">📚</div>
        <div class="kpi-card__label">신규 소설</div>
        <div class="kpi-card__value" id="kpi-novels"><div class="nc-spinner" style="width:22px;height:22px"></div></div>
        <div class="kpi-card__sub" id="kpi-novels-sub">로딩 중...</div>
      </div>
      <div class="kpi-card kpi-card--revenue">
        <div class="kpi-card__icon">💰</div>
        <div class="kpi-card__label">총 매출</div>
        <div class="kpi-card__value" id="kpi-revenue"><div class="nc-spinner" style="width:22px;height:22px"></div></div>
        <div class="kpi-card__sub" id="kpi-revenue-sub">로딩 중...</div>
      </div>
      <div class="kpi-card kpi-card--mentors">
        <div class="kpi-card__icon">🎓</div>
        <div class="kpi-card__label">멘토 신청</div>
        <div class="kpi-card__value" id="kpi-mentors"><div class="nc-spinner" style="width:22px;height:22px"></div></div>
        <div class="kpi-card__sub" id="kpi-mentors-sub">로딩 중...</div>
      </div>
    </div>

    <!-- 분포 차트 -->
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-card__title">👥 사용자 역할 분포</div>
        <div class="bar-chart" id="role-chart">
          <div class="nc-loading" style="padding:20px"><div class="nc-spinner"></div></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-card__title">📚 소설 상태 분포</div>
        <div class="bar-chart" id="novel-status-chart">
          <div class="nc-loading" style="padding:20px"><div class="nc-spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- 최근 신고 & 멘토 신청 -->
    <div class="recent-grid">
      <div class="recent-card">
        <div class="recent-card__header">
          <div class="recent-card__title">🚨 최근 신고 (대기)</div>
          <a href="/admin-reports.html" class="recent-card__more">전체 보기 →</a>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>대상</th>
              <th>신고 내용</th>
              <th>상태</th>
              <th>일시</th>
            </tr>
          </thead>
          <tbody id="recent-reports-body">
            <tr><td colspan="4" style="text-align:center;padding:20px">
              <div class="nc-spinner" style="width:20px;height:20px;margin:auto"></div>
            </td></tr>
          </tbody>
        </table>
      </div>
      <div class="recent-card">
        <div class="recent-card__header">
          <div class="recent-card__title">🎓 최근 멘토 신청 (대기)</div>
          <a href="/admin-mentors.html" class="recent-card__more">전체 보기 →</a>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>신청자</th>
              <th>경력</th>
              <th>상태</th>
              <th>일시</th>
            </tr>
          </thead>
          <tbody id="recent-mentors-body">
            <tr><td colspan="4" style="text-align:center;padding:20px">
              <div class="nc-spinner" style="width:20px;height:20px;margin:auto"></div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  /* ── 권한 체크 ── */
  document.addEventListener('DOMContentLoaded', () => {
    const user = Auth.getUser();
    if (!user || !['ADMIN', 'SUPER_ADMIN'].includes(user.role)) {
      Toast.error('관리자 권한이 필요합니다');
      setTimeout(() => window.location.href = '/index.html', 1000);
      return;
    }
    const roleLabel = document.getElementById('sidebar-role-label');
    if (roleLabel) roleLabel.textContent = user.role;
    if (user.role === 'SUPER_ADMIN') {
      document.getElementById('super-nav-users').style.display = 'flex';
    }
    document.getElementById('history-date').value = new Date().toISOString().split('T')[0];
    loadDashboard('v2');
  });

  let currentMode = 'v2';
  let liveTimer = null;

  function switchMode(mode) {
    currentMode = mode;
    if (liveTimer) { clearTimeout(liveTimer); liveTimer = null; }
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('history-bar').style.display = mode === 'history' ? 'flex' : 'none';
    document.getElementById('live-indicator').style.display = mode === 'live' ? 'flex' : 'none';
    if (mode !== 'history') loadDashboard(mode);
  }

  async function loadDashboard(mode) {
    const endpoint = mode === 'live' ? '/admin/dashboard/live' : '/admin/dashboard/v2';
    const subtitle = document.getElementById('dashboard-subtitle');
    const lastUpdated = document.getElementById('last-updated');
    if (subtitle) subtitle.textContent = mode === 'live' ? '실시간 데이터' : 'NovelCraft 종합 지표';
    try {
      const data = await api.get(endpoint, true);
      renderKpis(data, mode);
      renderCharts(data);
      if (lastUpdated) lastUpdated.textContent = '갱신: ' + new Date().toLocaleTimeString('ko-KR');
      if (mode === 'live' && currentMode === 'live') {
        liveTimer = setTimeout(() => loadDashboard('live'), 30000);
      }
    } catch (e) {
      Toast.error('대시보드 로드 실패: ' + (e.message || '서버 오류'));
    }
    loadRecentReports();
    loadRecentMentors();
  }

  async function loadHistory() {
    const date = document.getElementById('history-date').value;
    if (!date) { Toast.error('날짜를 선택하세요'); return; }
    try {
      const data = await api.get(`/admin/dashboard/history?targetDate=${date}`, true);
      renderKpis(data, 'history');
      renderCharts(data);
      document.getElementById('dashboard-subtitle').textContent = `${date} 기준 데이터`;
      document.getElementById('last-updated').textContent = '갱신: ' + new Date().toLocaleTimeString('ko-KR');
    } catch (e) {
      Toast.error('히스토리 로드 실패: ' + (e.message || '서버 오류'));
    }
  }

  function renderKpis(data, mode) {
    const label = mode === 'live' ? '실시간' : (mode === 'history' ? '해당일' : '누적');
    setKpi('users',
      data?.newUserCount ?? data?.newUsers ?? data?.totalUserCount ?? data?.userCount ?? 0,
      `${label} 신규 가입자`);
    setKpi('novels',
      data?.newNovelCount ?? data?.newNovels ?? data?.totalNovelCount ?? data?.novelCount ?? 0,
      `${label} 등록 소설`);
    const rev = data?.totalRevenue ?? data?.revenue ?? data?.dailyRevenue ?? 0;
    setKpi('revenue', `₩${Number(rev).toLocaleString()}`, `${label} 총 매출`);
    setKpi('mentors',
      data?.pendingMentorCount ?? data?.mentorApplicationCount ?? data?.newMentorApplications ?? 0,
      '대기 중 멘토 신청');
  }

  function setKpi(key, value, sub) {
    const el = document.getElementById(`kpi-${key}`);
    const subEl = document.getElementById(`kpi-${key}-sub`);
    if (el) el.textContent = typeof value === 'number' ? value.toLocaleString() : value;
    if (subEl) subEl.textContent = sub;
  }

  function renderCharts(data) {
    const roles = data?.userRoleDistribution ?? data?.roleDistribution ?? {};
    renderBarChart('role-chart', [
      { label: '독자',   value: roles.READER ?? data?.readerCount ?? 0,  color: '#3b82f6' },
      { label: '작가',   value: roles.AUTHOR ?? data?.authorCount ?? 0,  color: '#10b981' },
      { label: '멘토',   value: roles.MENTOR ?? data?.mentorCount ?? 0,  color: '#a855f7' },
      { label: '어드민', value: roles.ADMIN  ?? data?.adminCount  ?? 0,  color: '#f59e0b' },
    ]);
    const novels = data?.novelStatusDistribution ?? data?.novelStats ?? {};
    renderBarChart('novel-status-chart', [
      { label: '연재중', value: novels.ONGOING   ?? data?.ongoingNovelCount   ?? 0, color: '#10b981' },
      { label: '완결',   value: novels.COMPLETED ?? data?.completedNovelCount ?? 0, color: '#6366f1' },
      { label: '중단',   value: novels.HIATUS    ?? data?.hiatusNovelCount    ?? 0, color: '#f59e0b' },
      { label: '보류',   value: novels.PENDING   ?? data?.pendingNovelCount   ?? 0, color: '#9ca3af' },
    ]);
  }

  function renderBarChart(containerId, items) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const max = Math.max(...items.map(i => i.value), 1);
    el.innerHTML = items.map(item => `
      <div class="bar-item">
        <span class="bar-label">${escHtml(item.label)}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${(item.value / max * 100).toFixed(1)}%;background:${item.color}80"></div>
        </div>
        <span class="bar-value" style="color:${item.color}">${item.value.toLocaleString()}</span>
      </div>
    `).join('');
  }

  async function loadRecentReports() {
    const tbody = document.getElementById('recent-reports-body');
    try {
      const res = await api.get('/admin/reports?status=PENDING&page=0&size=5', true);
      const list = res?.content || [];
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="nc-empty" style="padding:20px;text-align:center;color:var(--text3)">대기 중인 신고 없음</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(r => `
        <tr>
          <td>${targetTypeLabel(r.targetType)}</td>
          <td style="color:var(--text3);font-size:0.78rem;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${escHtml(r.reason?.slice(0, 25) || '-')}
          </td>
          <td>${stBadge(r.status)}</td>
          <td style="color:var(--text3);font-size:0.75rem">${formatDate(r.createdAt)}</td>
        </tr>
      `).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text3)">불러오기 실패</td></tr>';
    }
  }

  async function loadRecentMentors() {
    const tbody = document.getElementById('recent-mentors-body');
    try {
      const res = await api.get('/admin/mentors?status=PENDING&page=0&size=5', true);
      const list = res?.content || res || [];
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="nc-empty" style="padding:20px;text-align:center;color:var(--text3)">대기 중인 신청 없음</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(m => `
        <tr>
          <td style="font-weight:600">${escHtml(m.nickname || m.mentorNickname || m.applicantNickname || '-')}</td>
          <td style="font-size:0.8rem">${careerLabel(m.careerLevel)}</td>
          <td>${stBadge(m.status || 'PENDING')}</td>
          <td style="color:var(--text3);font-size:0.75rem">${formatDate(m.appliedAt || m.createdAt)}</td>
        </tr>
      `).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text3)">불러오기 실패</td></tr>';
    }
  }

  /* ── 유틸 ── */
  const CAREER_MAP = { INTRODUCTION: '입문', ELEMENTARY: '초보', INTERMEDIATE: '중급', PROFICIENT: '숙련' };
  function careerLabel(l) { return `<span style="font-size:0.78rem;color:var(--text2)">${CAREER_MAP[l] || l || '-'}</span>`; }

  function targetTypeLabel(t) {
    if (t === 'EPISODE_COMMENT') return '<span style="font-size:0.78rem">댓글</span>';
    if (t === 'USER_MENTORSHIP') return '<span style="font-size:0.78rem">멘토십</span>';
    return `<span style="font-size:0.78rem">${escHtml(t || '-')}</span>`;
  }

  const ST = {
    PENDING:  { label: '대기',  cls: 'st-pending'  },
    RESOLVED: { label: '해결',  cls: 'st-resolved' },
    REJECTED: { label: '기각',  cls: 'st-rejected' },
    APPROVED: { label: '승인',  cls: 'st-approved' },
    CLOSED:   { label: '종료',  cls: 'st-closed'   },
  };
  function stBadge(status) {
    const s = ST[status] || { label: status || '-', cls: 'st-closed' };
    return `<span class="st-badge ${s.cls}">${s.label}</span>`;
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
