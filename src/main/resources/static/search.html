<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검색 - NovelCraft</title>
  <script src="/common.js"></script>
  <style>
    /* ── 네비 커스텀 ── */
    .nc-nav__inner { height: 62px; }
    .nc-point-btn {
      padding: 5px 14px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(240,200,66,0.18), rgba(240,200,66,0.08));
      border: 1px solid rgba(240,200,66,0.4); color: var(--accent);
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .nc-point-btn:hover { background: rgba(240,200,66,0.25); border-color: var(--accent); }
    .nc-user-menu { position: relative; }
    .nc-user-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); min-width: 160px;
      box-shadow: var(--shadow-lg); z-index: 300;
      display: none; overflow: hidden;
    }
    .nc-user-menu.open .nc-user-dropdown { display: block; }
    .nc-user-dropdown__item {
      display: block; width: 100%; padding: 11px 16px; text-align: left;
      background: none; border: none; color: var(--text2); font-size: 0.875rem;
      cursor: pointer; transition: background 0.15s; font-family: inherit;
      text-decoration: none;
    }
    .nc-user-dropdown__item:hover { background: var(--surface); color: var(--text); }
    .nc-user-dropdown__item--danger { color: #f87171; }
    .nc-user-dropdown__item--danger:hover { background: rgba(239,68,68,0.08); }

    /* ── 페이지 레이아웃 ── */
    .search-layout {
      max-width: 1280px; margin: 0 auto; padding: 28px 24px;
      display: grid; grid-template-columns: 1fr 280px; gap: 28px;
    }

    /* ── 검색어 헤더 ── */
    .search-keyword-display {
      font-family: 'Noto Serif KR', serif;
      font-size: 2.2rem; font-weight: 900;
      color: var(--text); margin-bottom: 6px;
    }
    .search-result-summary {
      font-size: 0.82rem; color: var(--text3); margin-bottom: 20px;
    }
    .search-result-summary strong { color: var(--primary-light); }

    /* ── 필터 탭 (전체/소설/작가/태그) ── */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
    .filter-tab {
      padding: 7px 18px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s; font-family: inherit; white-space: nowrap;
    }
    .filter-tab:hover { border-color: var(--primary); color: var(--primary-light); }
    .filter-tab.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ── 섹션 소제목 ── */
    .result-section-label {
      font-family: 'Noto Serif KR', serif; font-size: 0.95rem; font-weight: 700;
      color: var(--text2); margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── 소설 결과 아이템 ── */
    .novel-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 12px;
      background: var(--bg2); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
    }
    .novel-item:hover { border-color: rgba(124,90,240,0.35); background: var(--surface); }
    .novel-cover {
      width: 46px; height: 65px; border-radius: 7px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--surface), var(--surface2));
      border: 1px solid var(--border); display: flex; align-items: center;
      justify-content: center; font-size: 1.2rem; overflow: hidden;
    }
    .novel-cover img { width: 100%; height: 100%; object-fit: cover; }
    .novel-info { flex: 1; min-width: 0; }
    .novel-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .novel-meta { font-size: 0.75rem; color: var(--text3); margin-bottom: 6px; }
    .novel-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .view-btn {
      padding: 7px 18px; border-radius: 8px; flex-shrink: 0;
      background: rgba(124,90,240,0.12); border: 1px solid rgba(124,90,240,0.28);
      color: var(--primary-light); font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .view-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* ── 작가 결과 아이템 ── */
    .author-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 12px;
      background: var(--bg2); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
    }
    .author-item:hover { border-color: rgba(240,104,66,0.35); background: var(--surface); }
    .author-avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700; color: white;
    }
    .author-info { flex: 1; min-width: 0; }
    .author-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; }
    .author-meta { font-size: 0.75rem; color: var(--text3); }
    .follow-btn {
      padding: 7px 18px; border-radius: 8px; flex-shrink: 0;
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .follow-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .follow-btn.following { background: rgba(240,104,66,0.12); border-color: var(--accent2); color: var(--accent2); }

    /* ── 구분선 ── */
    .results-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── 배지 공통 ── */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 12px;
      font-size: 0.72rem; font-weight: 600;
    }
    .badge--free { background: rgba(16,185,129,0.14); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .badge--paid { background: rgba(124,90,240,0.14); color: var(--primary-light); border: 1px solid rgba(124,90,240,0.3); }

    /* ── 빈 상태 / 로딩 ── */
    .loading-row { padding: 40px; display: flex; align-items: center; justify-content: center; }
    .empty-result { padding: 60px 20px; text-align: center; color: var(--text3); }
    .empty-result__icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-result__title { font-weight: 700; color: var(--text2); margin-bottom: 6px; }
    .empty-result__desc { font-size: 0.875rem; }

    /* ── 사이드바 패널 ── */
    .sidebar-panel {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; margin-bottom: 14px;
    }
    .sidebar-panel-header {
      padding: 13px 18px;
      background: rgba(124,90,240,0.07);
      border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: 0.88rem;
    }

    /* ── 인기 태그 ── */
    .popular-tag-item {
      display: flex; align-items: center;
      padding: 10px 18px; cursor: pointer; transition: background 0.15s;
      font-size: 0.875rem; color: var(--primary-light);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .popular-tag-item:last-child { border-bottom: none; }
    .popular-tag-item:hover { background: rgba(255,255,255,0.03); }

    /* ── 최근 검색어 ── */
    .recent-keyword-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px; cursor: pointer; transition: background 0.15s;
      font-size: 0.875rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .recent-keyword-item:last-child { border-bottom: none; }
    .recent-keyword-item:hover { background: rgba(255,255,255,0.03); }
    .recent-keyword-text { flex: 1; color: var(--text2); }
    .recent-keyword-item:hover .recent-keyword-text { color: var(--text); }
    .recent-login-hint {
      padding: 16px 18px; text-align: center;
      font-size: 0.8rem; color: var(--text3);
    }

    /* ── 포인트 충전 모달 ── */
    .point-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .point-opt {
      padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; cursor: pointer; transition: all 0.2s;
      text-align: center; font-family: inherit; color: var(--text2);
    }
    .point-opt:hover { border-color: var(--primary); }
    .point-opt.selected { border-color: var(--primary); background: rgba(124,90,240,0.1); color: var(--primary-light); }
    .point-opt__amount { font-size: 1rem; font-weight: 700; }
    .point-opt__price { font-size: 0.78rem; color: var(--text3); margin-top: 3px; }
    .point-opt.selected .point-opt__price { color: var(--primary-light); opacity: 0.8; }

    /* ── 반응형 ── */
    @media (max-width: 960px) {
      .search-layout { grid-template-columns: 1fr; }
      .search-sidebar { order: -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .sidebar-panel { margin-bottom: 0; }
    }
    @media (max-width: 600px) {
      .search-layout { padding: 16px; }
      .search-sidebar { grid-template-columns: 1fr; }
      .search-keyword-display { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <nav id="nc-nav"></nav>

  <div class="search-layout">
    <!-- ── 왼쪽: 검색 결과 ── -->
    <div class="search-main">
      <div class="search-keyword-display" id="keyword-display">검색</div>
      <div class="search-result-summary" id="result-summary">&nbsp;</div>

      <!-- 필터 탭 -->
      <div class="filter-tabs">
        <button class="filter-tab active" data-type="all">전체</button>
        <button class="filter-tab" data-type="novel">소설</button>
        <button class="filter-tab" data-type="author">작가</button>
        <button class="filter-tab" data-type="tag">태그</button>
      </div>

      <!-- 결과 컨테이너 -->
      <div id="search-results">
        <div class="loading-row"><div class="nc-spinner"></div></div>
      </div>
    </div>

    <!-- ── 오른쪽: 사이드바 ── -->
    <div class="search-sidebar">

      <!-- 인기 태그 -->
      <div class="sidebar-panel">
        <div class="sidebar-panel-header">인기 태그</div>
        <div id="popular-tags-list">
          <div class="loading-row" style="padding:20px"><div class="nc-spinner"></div></div>
        </div>
      </div>

      <!-- 최근 검색어 (로그인 전용) -->
      <div class="sidebar-panel">
        <div class="sidebar-panel-header">최근 검색어</div>
        <div id="recent-keywords-list">
          <div class="loading-row" style="padding:20px"><div class="nc-spinner"></div></div>
        </div>
      </div>

    </div>
  </div>

  <!-- 포인트 충전 모달 -->
  <div class="nc-modal" id="modal-point">
    <div class="nc-modal__backdrop" onclick="Modal.close('modal-point')"></div>
    <div class="nc-modal__box">
      <button class="nc-modal__close" onclick="Modal.close('modal-point')">✕</button>
      <div class="nc-modal__title">💎 포인트 충전</div>
      <div style="margin-bottom:16px">
        <div style="font-size:0.82rem;color:var(--text3);margin-bottom:12px">충전할 포인트를 선택하세요</div>
        <div class="point-options">
          <button class="point-opt selected" data-amount="1000">
            <div class="point-opt__amount">1,000P</div>
            <div class="point-opt__price">₩1,000</div>
          </button>
          <button class="point-opt" data-amount="5000">
            <div class="point-opt__amount">5,000P</div>
            <div class="point-opt__price">₩5,000</div>
          </button>
          <button class="point-opt" data-amount="10000">
            <div class="point-opt__amount">10,000P</div>
            <div class="point-opt__price">₩10,000</div>
          </button>
          <button class="point-opt" data-amount="30000">
            <div class="point-opt__amount">30,000P</div>
            <div class="point-opt__price">₩30,000</div>
          </button>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:12px 14px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)">
        <span style="font-size:0.85rem;color:var(--text3)">현재 잔여 포인트</span>
        <span style="font-weight:700;color:var(--accent)" id="modal-current-point">-</span>
      </div>
      <button class="nc-btn nc-btn--primary nc-btn--full" onclick="chargePoint()">충전하기</button>
    </div>
  </div>

  <script>
    /* ── 매핑 상수 ── */
    const GENRE_MAP = {
      FANTASY:         { label: '판타지',     color: '#7c3aed' },
      ROMANCE_FANTASY: { label: '로판',       color: '#db2777' },
      MODERN:          { label: '현대',       color: '#0891b2' },
      CHIVALROUS:      { label: '무협',       color: '#92400e' },
      BL:              { label: 'BL',         color: '#6d28d9' },
      SF:              { label: 'SF',         color: '#1d4ed8' },
      HORROR:          { label: '공포',       color: '#374151' },
      CLASSIC:         { label: '고전',       color: '#065f46' },
      DAILY_LIFE:      { label: '일상물',     color: '#059669' },
    };
    const TAG_MAP = {
      ISEKAI: '이세계', REGRESSION: '회귀', HEALING: '힐링', ACTION: '액션',
      ROMANCE: '로맨스', COMEDY: '개그', MYSTERY: '미스터리', MARTIAL_ARTS: '무공',
      VILLAIN: '빌런', MUNCHKIN: '먼치킨', ACADEMY: '아카데미', CONTRACT: '계약',
      POSSESSION: '빙의', REINCARNATION: '환생', HAREM: '하렘', REVENGE: '복수',
      GROWTH: '성장', DUNGEON: '던전',
    };

    function genreTag(genre) {
      const g = GENRE_MAP[genre];
      if (!g) return '';
      return `<span class="badge" style="background:${g.color}18;color:${g.color};border:1px solid ${g.color}35">${g.label}</span>`;
    }
    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function formatNum(n) {
      if (!n && n !== 0) return '0';
      return n >= 10000 ? `${(n / 10000).toFixed(1)}만` : n.toLocaleString();
    }

    /* ── 상태 ── */
    let currentKeyword = '';
    let currentType = 'all';
    let currentPage = 0;

    /* ── 네비게이션 커스텀 ── */
    function initNav() {
      const nav = document.getElementById('nc-nav');
      if (!nav) return;
      const user = Auth.getUser();
      const isLoggedIn = Auth.isLoggedIn();
      const isAuthorOrMentor = user?.role === 'AUTHOR' || user?.role === 'MENTOR';

      nav.innerHTML = `
        <div class="nc-nav__inner">
          <a href="/index.html" class="nc-nav__logo">
            <span class="logo-icon">✦</span>NovelCraft
          </a>
          <div class="nc-nav__search-wrap" id="nav-search-wrap">
            <input type="text" class="nc-nav__search" id="nav-search"
              placeholder="소설, 작가, 태그 검색..."
              value="${escHtml(currentKeyword)}">
            <div class="nc-search-dropdown" id="search-dropdown"></div>
          </div>
          <div class="nc-nav__right">
            ${isLoggedIn ? `
              <button class="nc-point-btn" id="nav-point" onclick="openPointModal()">···P</button>
              <button class="nc-nav__btn" onclick="window.location.href='/mypage.html?tab=library'">내 서재</button>
              <div class="nc-user-menu" id="user-menu">
                <div class="nc-nav__avatar" onclick="toggleUserMenu()" style="cursor:pointer;user-select:none">
                  ${user?.nickname?.charAt(0)?.toUpperCase() || 'U'}
                </div>
                <div class="nc-user-dropdown" id="user-dropdown">
                  <a href="/mypage.html" class="nc-user-dropdown__item">마이페이지</a>
                  ${isAuthorOrMentor ? `<a href="/editor.html" class="nc-user-dropdown__item">에디터</a>` : ''}
                  <button class="nc-user-dropdown__item nc-user-dropdown__item--danger" onclick="Auth.logout()">로그아웃</button>
                </div>
              </div>
            ` : `
              <button class="nc-nav__btn" onclick="window.location.href='/login.html'">로그인</button>
              <button class="nc-nav__btn nc-nav__btn--primary" onclick="window.location.href='/signup.html'">회원가입</button>
            `}
          </div>
        </div>
      `;

      if (isLoggedIn) {
        api.get('/points/balance', true).then(d => {
          const el = document.getElementById('nav-point');
          if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
          const mcp = document.getElementById('modal-current-point');
          if (mcp) mcp.textContent = `${(d?.balance || 0).toLocaleString()}P`;
        }).catch(() => {});
      }

      initSearch();

      document.addEventListener('click', (e) => {
        const menu = document.getElementById('user-menu');
        if (menu && !menu.contains(e.target)) menu.classList.remove('open');
      });
    }

    function toggleUserMenu() {
      document.getElementById('user-menu')?.classList.toggle('open');
    }

    function initSearch() {
      const input = document.getElementById('nav-search');
      const dropdown = document.getElementById('search-dropdown');
      if (!input || !dropdown) return;

      let timer;

      input.addEventListener('focus', async () => {
        dropdown.innerHTML = '<div class="nc-search-loading">로딩 중...</div>';
        dropdown.classList.add('active');
        try {
          const [popular, recent] = await Promise.allSettled([
            api.get('/search/keywords/popular'),
            Auth.isLoggedIn() ? api.get('/search/keywords/recent', true) : Promise.resolve([])
          ]);
          let html = '';
          if (recent.status === 'fulfilled' && recent.value?.length) {
            html += `<div class="nc-search-section">최근 검색어</div>`;
            recent.value.slice(0, 5).forEach(k => {
              html += `<div class="nc-search-item" onclick="doSearch('${escHtml(k)}')">${escHtml(k)}</div>`;
            });
          }
          if (popular.status === 'fulfilled' && popular.value?.length) {
            html += `<div class="nc-search-section">인기 검색어</div>`;
            popular.value.slice(0, 5).forEach(k => {
              html += `<div class="nc-search-item" onclick="doSearch('${escHtml(k)}')">${escHtml(k)}</div>`;
            });
          }
          dropdown.innerHTML = html || '<div class="nc-search-empty">검색어를 입력하세요</div>';
        } catch {
          dropdown.innerHTML = '<div class="nc-search-empty">검색어를 입력하세요</div>';
        }
      });

      input.addEventListener('input', (e) => {
        clearTimeout(timer);
        const kw = e.target.value.trim();
        if (!kw) return;
        timer = setTimeout(async () => {
          try {
            const res = await api.get(`/search/v2/novels?keyword=${encodeURIComponent(kw)}&page=0&size=5`);
            let html = `<div class="nc-search-section">소설 검색 결과</div>`;
            if (res?.content?.length) {
              res.content.forEach(n => {
                html += `<div class="nc-search-item" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
                  <span>${escHtml(n.title)}</span>
                  <span class="nc-search-sub">${escHtml(n.authorName || '')}</span>
                </div>`;
              });
            } else {
              html += '<div class="nc-search-empty">검색 결과가 없습니다</div>';
            }
            dropdown.innerHTML = html;
          } catch {}
        }, 300);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doSearch(input.value.trim());
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#nav-search-wrap')) {
          dropdown.classList.remove('active');
        }
      });
    }

    function doSearch(keyword) {
      if (!keyword) return;
      window.location.href = `/search.html?keyword=${encodeURIComponent(keyword)}&type=${currentType}`;
    }

    /* ── 메인 검색 실행 ── */
    async function runSearch(keyword, type, page) {
      currentKeyword = keyword;
      currentType = type;
      currentPage = page;

      const kwDisplay = document.getElementById('keyword-display');
      if (kwDisplay) kwDisplay.textContent = keyword || '검색어를 입력하세요';
      document.title = keyword ? `"${keyword}" 검색 결과 - NovelCraft` : '검색 - NovelCraft';

      const container = document.getElementById('search-results');

      /* 키워드 없으면 API 호출 없이 안내 메시지 표시 */
      if (!keyword) {
        document.getElementById('result-summary').innerHTML = '';
        container.innerHTML = renderEmpty('검색어를 입력하세요', '소설 제목, 작가명, 태그를 검색해보세요');
        return;
      }

      container.innerHTML = '<div class="loading-row"><div class="nc-spinner"></div></div>';

      try {
        if (type === 'author') {
          await loadAuthorResults(keyword, container);
        } else if (type === 'tag') {
          await loadTagResults(keyword, container);
        } else {
          /* 전체 또는 소설 탭 */
          await loadNovelResults(keyword, page, container, type === 'all');
        }
      } catch {
        container.innerHTML = renderEmpty('검색 결과를 불러오지 못했습니다', '잠시 후 다시 시도해주세요');
      }
    }

    /* ── 소설 검색 ── */
    async function loadNovelResults(keyword, page, container, showAuthors) {
      const qs = new URLSearchParams({ page: String(page), size: '20' });
      if (keyword) qs.append('keyword', keyword);

      let novels = [], total = 0, totalPages = 1;
      try {
        const res = await api.get(`/search/v2/novels?${qs}`);
        novels = res?.content || [];
        total = res?.totalElements ?? novels.length;
        totalPages = res?.totalPages ?? 1;
      } catch {}

      let authors = [];
      if (showAuthors && keyword) {
        try {
          const aRes = await api.get(`/search/v2/authors?keyword=${encodeURIComponent(keyword)}`);
          authors = Array.isArray(aRes) ? aRes : (aRes?.content || []);
        } catch {}
      }

      if (!novels.length && !authors.length) {
        updateSummary(0, keyword);
        container.innerHTML = renderEmpty('검색 결과가 없습니다', `"${escHtml(keyword)}"에 대한 결과를 찾을 수 없습니다`);
        return;
      }

      updateSummary(total, keyword);

      let html = '';

      if (novels.length) {
        if (showAuthors) html += `<div class="result-section-label">소설 검색 결과</div>`;
        html += novels.map(renderNovelItem).join('');
        if (totalPages > 1) html += renderPagination(page, totalPages);
      }

      if (showAuthors && authors.length) {
        if (novels.length) html += `<hr class="results-divider">`;
        html += `<div class="result-section-label">작가 검색 결과</div>`;
        html += authors.slice(0, 5).map(renderAuthorItem).join('');
      }

      container.innerHTML = html;
      bindPaginationEvents();
    }

    /* ── 작가 검색 ── */
    async function loadAuthorResults(keyword, container) {
      try {
        const res = await api.get(`/search/v2/authors?keyword=${encodeURIComponent(keyword)}`);
        const list = Array.isArray(res) ? res : (res?.content || []);
        if (!list.length) {
          updateSummary(0, keyword);
          container.innerHTML = renderEmpty('작가 검색 결과가 없습니다', `"${escHtml(keyword)}" 작가를 찾을 수 없습니다`);
          return;

          if (!keyword) {
            document.getElementById('result-summary').innerHTML = '';
            container.innerHTML = renderEmpty('검색어를 입력하세요', `'소설 제목, 작가명, 태그를 검색해보세요`);
            return;
          }
      }

    /* ── 태그 검색 ── */
    async function loadTagResults(keyword, container) {
      if (!keyword) {
        container.innerHTML = renderEmpty('검색어를 입력하세요', '태그명을 검색해보세요');
        return;
      }
      /* 한국어 입력 → enum key 매핑 */
      const tagKey = Object.entries(TAG_MAP).find(([k, v]) =>
        v === keyword || k.toLowerCase() === keyword.toLowerCase()
      )?.[0];

      if (!tagKey) {
        container.innerHTML = renderEmpty('일치하는 태그가 없습니다', '인기 태그를 클릭해서 검색해보세요');
        return;
      }

      const res = await api.get(`/search/v2/tags?tags=${tagKey}`);
      const list = res?.content || (Array.isArray(res) ? res : []);
      if (!list.length) {
        updateSummary(0, keyword);
        container.innerHTML = renderEmpty('태그 검색 결과가 없습니다', `#${escHtml(TAG_MAP[tagKey] || tagKey)} 태그에 해당하는 소설이 없습니다`);
        return;
      }
      updateSummary(list.length, `#${TAG_MAP[tagKey]}`);
      container.innerHTML = `<div class="result-section-label">#${escHtml(TAG_MAP[tagKey] || tagKey)} 소설 목록</div>`
        + list.map(renderNovelItem).join('');
    }

    /* ── 렌더링 헬퍼 ── */
    function renderNovelItem(n) {
      return `
        <div class="novel-item" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
          <div class="novel-cover">
            ${n.coverImageUrl
              ? `<img src="${n.coverImageUrl}" alt="${escHtml(n.title)}" onerror="this.parentElement.innerHTML='📖'">`
              : '📖'}
          </div>
          <div class="novel-info">
            <div class="novel-title">${escHtml(n.title)}</div>
            <div class="novel-meta">
              ${escHtml(n.authorName || '알 수 없음')} · ${n.episodeCount || 0}화 · 조회 ${formatNum(n.viewCount || 0)}
            </div>
            <div class="novel-badges">
              ${genreTag(n.genre)}
              ${n.isFree !== false
                ? '<span class="badge badge--free">무료</span>'
                : '<span class="badge badge--paid">유료</span>'}
            </div>
          </div>
          <button class="view-btn"
            onclick="event.stopPropagation();window.location.href='/novel-detail.html?id=${n.novelId}'">
            보기
          </button>
        </div>`;
    }

    function renderAuthorItem(a) {
      const initial = (a.penName || a.nickname || '작')?.charAt(0)?.toUpperCase();
      const metaParts = [];
      if (a.mainGenre && GENRE_MAP[a.mainGenre]) metaParts.push(GENRE_MAP[a.mainGenre].label + ' 전문');
      if (a.novelCount != null) metaParts.push(`소설 ${a.novelCount}편`);
      if (a.followerCount != null) metaParts.push(`팔로워 ${formatNum(a.followerCount)}`);
      const authorId = a.authorId || a.userId || 0;
      return `
        <div class="author-item">
          <div class="author-avatar">${escHtml(initial)}</div>
          <div class="author-info">
            <div class="author-name">${escHtml(a.penName || a.nickname || '작가')}</div>
            <div class="author-meta">${metaParts.join(' · ') || '작가'}</div>
          </div>
          <button class="follow-btn ${a.following ? 'following' : ''}"
            onclick="toggleFollow(${authorId}, this)">
            ${a.following ? '팔로잉' : '팔로우'}
          </button>
        </div>`;
    }

    function renderEmpty(title, desc) {
      return `
        <div class="empty-result">
          <div class="empty-result__icon">🔍</div>
          <div class="empty-result__title">${escHtml(title)}</div>
          <div class="empty-result__desc">${escHtml(desc)}</div>
        </div>`;
    }

    function renderPagination(page, totalPages) {
      const maxVisible = Math.min(totalPages, 10);
      let html = '<div class="nc-pagination" style="margin-top:20px">';
      if (page > 0) html += `<button class="nc-page-btn" data-page="${page - 1}">◀</button>`;
      for (let i = 0; i < maxVisible; i++) {
        html += `<button class="nc-page-btn ${i === page ? 'active' : ''}" data-page="${i}">${i + 1}</button>`;
      }
      if (page < totalPages - 1) html += `<button class="nc-page-btn" data-page="${page + 1}">▶</button>`;
      html += '</div>';
      return html;
    }

    function bindPaginationEvents() {
      document.querySelectorAll('.nc-page-btn[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          runSearch(currentKeyword, currentType, parseInt(btn.dataset.page));
        });
      });
    }

    function updateSummary(count, keyword) {
      const el = document.getElementById('result-summary');
      if (!el) return;
      if (keyword) {
        el.innerHTML = `"<strong>${escHtml(keyword)}</strong>" 검색 결과 <strong>${count.toLocaleString()}건</strong>`;
      } else {
        el.innerHTML = `전체 <strong>${count.toLocaleString()}건</strong>`;
      }
    }

    /* ── 팔로우 토글 ── */
    async function toggleFollow(authorId, btn) {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      try {
        const res = await api.post(`/auth/authors/${authorId}/follow`, {}, true);
        const isFollowing = res?.following ?? false;
        btn.textContent = isFollowing ? '팔로잉' : '팔로우';
        btn.classList.toggle('following', isFollowing);
        Toast.success(isFollowing ? '팔로우했습니다!' : '팔로우를 취소했습니다');
      } catch (e) {
        Toast.error(e.message || '실패');
      }
    }

    /* ── 사이드바: 인기 태그 ── */
    async function loadPopularTags() {
      const el = document.getElementById('popular-tags-list');
      if (!el) return;
      try {
        const tags = await api.get('/search/tags/popular');
        if (tags?.length) {
          el.innerHTML = tags.slice(0, 8).map(t => {
            const label = TAG_MAP[t] || t;
            return `<div class="popular-tag-item"
              onclick="window.location.href='/search.html?keyword=${encodeURIComponent(label)}&type=tag'">
              #${escHtml(label)}
            </div>`;
          }).join('');
          return;
        }
      } catch {}
      /* API 실패 시 기본 태그 */
      const defaults = [
        { label: '판타지' }, { label: '로판' }, { label: '회귀' },
        { label: '무협' }, { label: '빙의' }, { label: '현대판타지' },
        { label: '환생' }, { label: '액션' },
      ];
      el.innerHTML = defaults.map(t =>
        `<div class="popular-tag-item"
          onclick="window.location.href='/search.html?keyword=${encodeURIComponent(t.label)}&type=tag'">
          #${t.label}
        </div>`
      ).join('');
    }

    /* ── 사이드바: 최근 검색어 ── */
    async function loadRecentKeywords() {
      const el = document.getElementById('recent-keywords-list');
      if (!el) return;

      if (!Auth.isLoggedIn()) {
        el.innerHTML = `
          <div class="recent-login-hint">
            <div style="margin-bottom:8px">로그인 후 이용 가능합니다</div>
            <button onclick="window.location.href='/login.html'"
              class="nc-btn nc-btn--outline nc-btn--sm"
              style="font-size:0.78rem;padding:5px 14px">
              로그인
            </button>
          </div>`;
        return;
      }

      try {
        const keywords = await api.get('/search/keywords/recent', true);
        if (!keywords?.length) {
          el.innerHTML = '<div class="recent-login-hint" style="color:var(--text3)">최근 검색어가 없습니다</div>';
          return;
        }
        el.innerHTML = keywords.slice(0, 5).map(k => `
          <div class="recent-keyword-item"
            onclick="window.location.href='/search.html?keyword=${encodeURIComponent(k)}&type=${currentType}'">
            <span class="recent-keyword-text">${escHtml(k)}</span>
          </div>`
        ).join('');
      } catch {
        el.innerHTML = '<div class="recent-login-hint" style="color:var(--text3)">불러올 수 없습니다</div>';
      }
    }

    /* ── 포인트 충전 ── */
    let selectedPointAmt = 1000;

    function openPointModal() {
      api.get('/points/balance', true).then(d => {
        const el = document.getElementById('modal-current-point');
        if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
      }).catch(() => {});
      Modal.open('modal-point');
    }

    function initPointOptions() {
      document.querySelectorAll('.point-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.point-opt').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedPointAmt = parseInt(btn.dataset.amount);
        });
      });
    }

    async function chargePoint() {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      try {
        const res = await api.post('/payments/prepare', {
          amount: selectedPointAmt,
          productName: `포인트 ${selectedPointAmt.toLocaleString()}P`,
          productType: 'POINT',
        }, true);
        Modal.close('modal-point');
        Toast.info('결제창을 준비 중입니다...');
        await api.post('/payments/confirm', {
          paymentId: res?.paymentId,
          impUid: res?.merchantUid,
        }, true);
        Toast.success(`${selectedPointAmt.toLocaleString()}P가 충전되었습니다!`);
        api.get('/points/balance', true).then(d => {
          const el = document.getElementById('nav-point');
          if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
        }).catch(() => {});
      } catch (e) {
        Toast.error(e.message || '충전 실패');
      }
    }

    /* ── 초기화 ── */
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(location.search);
      currentKeyword = urlParams.get('keyword') || '';
      currentType = urlParams.get('type') || 'all';

      /* 키워드 표시 */
      const kwDisplay = document.getElementById('keyword-display');
      if (kwDisplay) kwDisplay.textContent = currentKeyword || '전체 검색';
      document.title = currentKeyword
        ? `"${currentKeyword}" 검색 결과 - NovelCraft`
        : '검색 - NovelCraft';

      /* 탭 초기 상태 */
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === currentType);

        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const newType = btn.dataset.type;
          /* URL 업데이트 (뒤로가기 지원) */
          const newUrl = new URL(location.href);
          newUrl.searchParams.set('type', newType);
          history.pushState({}, '', newUrl.toString());
          runSearch(currentKeyword, newType, 0);
        });
      });

      initPointOptions();

      /* 데이터 로드 */
      runSearch(currentKeyword, currentType, 0);
      loadPopularTags();
      loadRecentKeywords();
    });
  </script>
</body>
</html>
