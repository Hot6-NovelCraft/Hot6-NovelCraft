<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 회원가입</title>
  <script src="/common.js"></script>
  <style>
    body { display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; background: var(--bg); padding: 40px 20px; }
    #nc-nav { display: none; }

    .signup-wrap { width: 100%; max-width: 520px; animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

    .signup-logo { text-align: center; margin-bottom: 32px; }
    .signup-logo a {
      font-family: 'Noto Serif KR', serif; font-size: 1.8rem; font-weight: 900;
      color: var(--primary-light); text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* ── 스텝 인디케이터 ── */
    .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 32px; }
    .step  { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; color: var(--text3); transition: all 0.3s; z-index: 1;
    }
    .step.active .step-circle { border-color: var(--primary); background: var(--primary); color: white; }
    .step.done   .step-circle { border-color: var(--success); background: var(--success); color: white; }
    .step-label { font-size: 0.7rem; color: var(--text3); white-space: nowrap; }
    .step.active .step-label { color: var(--primary-light); }
    .step.done   .step-label { color: var(--success); }
    .step-line { width: 60px; height: 2px; background: var(--border); margin-bottom: 22px; transition: background 0.3s; }
    .step-line.done { background: var(--success); }

    .signup-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 36px; box-shadow: 0 8px 48px rgba(0,0,0,0.4);
    }
    .signup-title { font-family: 'Noto Serif KR', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    .signup-subtitle { color: var(--text3); font-size: 0.85rem; margin-bottom: 28px; }

    /* 소셜 공급자 배지 */
    .provider-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface2);
      margin-bottom: 24px; font-size: 0.88rem; color: var(--text2);
    }
    .provider-icon {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 900; flex-shrink: 0;
    }

    /* 역할 선택 */
    .role-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .role-card {
      padding: 20px; border-radius: var(--radius); border: 2px solid var(--border);
      background: transparent; cursor: pointer; transition: all .2s; text-align: center;
    }
    .role-card:hover { border-color: var(--primary); }
    .role-card.selected { border-color: var(--primary); background: rgba(124,90,240,.1); }
    .role-card__icon  { font-size: 2rem; margin-bottom: 8px; }
    .role-card__title { font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
    .role-card__desc  { font-size: .75rem; color: var(--text3); }

    /* 장르 체크박스 */
    .genre-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; }
    .genre-check {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text2); font-size: .8rem;
      cursor: pointer; transition: all .2s; font-family: inherit;
    }
    .genre-check.selected { background: var(--primary); border-color: var(--primary); color: white; }

    /* 인증 그룹 */
    .verify-group { display: flex; gap: 8px; }
    .verify-group input { flex: 1; }
    .verify-btn {
      padding: 10px 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--primary); background: transparent; color: var(--primary-light);
      font-size: .85rem; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all .2s;
    }
    .verify-btn:hover { background: var(--primary); color: white; }
    .verify-btn:disabled { opacity: .5; cursor: not-allowed; }

    .check-result { margin-top: 4px; font-size: .75rem; display: flex; align-items: center; gap: 4px; }
    .check-ok  { color: var(--success); }
    .check-err { color: var(--error); }

    .signup-nav { display: flex; gap: 10px; margin-top: 24px; }

    .check-label {
      display: flex; align-items: center; gap: 8px;
      font-size: .85rem; cursor: pointer; margin-bottom: 8px;
    }
    .check-label input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }

    .step-panel { display: none; }
    .step-panel.active { display: block; }

    /* 경력 선택 */
    .career-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .career-card {
      padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: transparent; cursor: pointer; transition: all .2s; text-align: center; font-family: inherit;
    }
    .career-card:hover { border-color: var(--primary); }
    .career-card.selected { border-color: var(--primary); background: rgba(124,90,240,.1); color: var(--primary-light); }
    .career-card__title { font-weight: 700; font-size: .9rem; }
    .career-card__desc  { font-size: .72rem; color: var(--text3); margin-top: 2px; }
    .career-card.selected .career-card__desc { color: var(--primary-light); opacity: .8; }

    /* 독서 목표 */
    .goal-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .goal-card {
      padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: transparent; cursor: pointer; transition: all .2s; text-align: center; font-family: inherit;
    }
    .goal-card:hover { border-color: var(--primary); }
    .goal-card.selected { border-color: var(--primary); background: rgba(124,90,240,.1); color: var(--primary-light); }
    .goal-card__title { font-weight: 700; font-size: .85rem; }
    .goal-card__desc  { font-size: .72rem; color: var(--text3); margin-top: 2px; }
    .goal-card.selected .goal-card__desc { color: var(--primary-light); opacity: .8; }

    /* SNS */
    .sns-group { display: flex; flex-direction: column; gap: 8px; }
    .sns-input-wrap { display: flex; align-items: center; gap: 8px; }
    .sns-label { font-size: .8rem; color: var(--text3); min-width: 70px; }

    input[type="date"].nc-input::-webkit-calendar-picker-indicator { filter: invert(.6); cursor: pointer; }

    .signup-footer { text-align: center; margin-top: 20px; color: var(--text3); font-size: .85rem; }
    .signup-footer a { color: var(--primary-light); text-decoration: none; }
  </style>
</head>
<body>
<nav id="nc-nav"></nav>
<div class="signup-wrap">
  <div class="signup-logo">
    <a href="/index.html"><span class="logo-icon" style="color:var(--accent)">✦</span> NovelCraft</a>
  </div>

  <!-- 스텝 인디케이터 -->
  <div class="steps">
    <div class="step active" id="step-ind-1">
      <div class="step-circle" id="step-c1">1</div>
      <div class="step-label" id="step-l1">기본 정보</div>
    </div>
    <div class="step-line" id="step-line-1"></div>
    <div class="step" id="step-ind-2">
      <div class="step-circle" id="step-c2">2</div>
      <div class="step-label">역할 선택</div>
    </div>
    <div class="step-line" id="step-line-2"></div>
    <div class="step" id="step-ind-3">
      <div class="step-circle" id="step-c3">3</div>
      <div class="step-label">추가 정보</div>
    </div>
  </div>

  <div class="signup-card">

    <!-- ──────── STEP 1 ──────── -->
    <div class="step-panel active" id="panel-1">

      <!-- 소셜 모드: 공급자 배지 (일반 가입 시 숨김) -->
      <div id="social-provider-box" style="display:none"></div>

      <div class="signup-title" id="step1-title">기본 정보 입력</div>
      <div class="signup-subtitle" id="step1-subtitle">계정 정보와 연락처를 입력하세요</div>

      <!-- 일반 가입 전용: 이메일 / 비밀번호 -->
      <div id="email-pw-section">
        <div class="nc-form-group">
          <label class="nc-label">이메일 <span style="color:var(--error)">*</span></label>
          <div style="display:flex;gap:8px">
            <input type="email" id="s-email" class="nc-input" placeholder="이메일 입력" autocomplete="email">
            <button class="verify-btn" onclick="checkEmail()" id="email-check-btn">중복확인</button>
          </div>
          <div class="check-result" id="email-result"></div>
        </div>
        <div class="nc-form-group">
          <label class="nc-label">비밀번호 <span style="color:var(--error)">*</span></label>
          <input type="password" id="s-pw" class="nc-input" placeholder="영문+숫자 8자 이상" autocomplete="new-password">
          <div class="nc-input-hint">영문, 숫자 조합 8자 이상</div>
        </div>
        <div class="nc-form-group">
          <label class="nc-label">비밀번호 확인 <span style="color:var(--error)">*</span></label>
          <input type="password" id="s-pw2" class="nc-input" placeholder="비밀번호 재입력" autocomplete="new-password">
          <div class="check-result" id="pw-result"></div>
        </div>
      </div>

      <!-- 공통: 닉네임 / 생년월일 / 휴대폰 -->
      <div class="nc-form-group">
        <label class="nc-label">닉네임 <span style="color:var(--error)">*</span></label>
        <div style="display:flex;gap:8px">
          <input type="text" id="s-nickname" class="nc-input" placeholder="닉네임 입력 (최대 10자)" maxlength="10">
          <button class="verify-btn" onclick="checkNickname()">중복확인</button>
        </div>
        <div class="check-result" id="nickname-result"></div>
      </div>

      <div class="nc-form-group">
        <label class="nc-label">생년월일 <span style="color:var(--error)">*</span></label>
        <input type="date" id="s-birthday" class="nc-input" max="">
        <div class="nc-input-hint">본인 확인 및 성인 인증에 사용됩니다</div>
      </div>

      <div class="nc-form-group">
        <label class="nc-label">휴대폰 번호 <span style="color:var(--error)">*</span></label>
        <div class="verify-group">
          <input type="tel" id="s-phone" class="nc-input" placeholder="010-0000-0000">
          <button class="verify-btn" id="sms-btn" onclick="sendSms()">인증번호 발송</button>
        </div>
      </div>
      <div class="nc-form-group" id="verify-code-group" style="display:none">
        <label class="nc-label">인증번호</label>
        <div class="verify-group">
          <input type="text" id="s-code" class="nc-input" placeholder="인증번호 6자리" maxlength="6">
          <button class="verify-btn" onclick="verifyPhone()">확인</button>
        </div>
        <div class="check-result" id="phone-result"></div>
      </div>

      <div class="nc-form-group">
        <label class="check-label">
          <input type="checkbox" id="s-terms" required>
          <span>이용약관 및 개인정보처리방침에 동의합니다 <span style="color:var(--error)">*</span></span>
        </label>
      </div>

      <div class="signup-nav">
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="nextStep1()" id="step1-btn">다음</button>
      </div>
    </div>

    <!-- ──────── STEP 2: 역할 선택 ──────── -->
    <div class="step-panel" id="panel-2">
      <div class="signup-title">역할을 선택하세요</div>
      <div class="signup-subtitle">독자 또는 작가로 가입할 수 있습니다</div>

      <div class="role-options">
        <div class="role-card" id="role-reader" onclick="selectRole('reader')">
          <div class="role-card__icon">📖</div>
          <div class="role-card__title">독자</div>
          <div class="role-card__desc">소설을 읽고 리뷰를 남겨요</div>
        </div>
        <div class="role-card" id="role-author" onclick="selectRole('author')">
          <div class="role-card__icon">✍️</div>
          <div class="role-card__title">작가</div>
          <div class="role-card__desc">소설을 쓰고 연재해요</div>
        </div>
      </div>

      <div class="signup-nav">
        <button class="nc-btn nc-btn--outline" onclick="prevStep(2)">이전</button>
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="nextStep2()">다음</button>
      </div>
    </div>

    <!-- ──────── STEP 3: 추가 정보 (독자) ──────── -->
    <div class="step-panel" id="panel-3-reader">
      <div class="signup-title">독자 프로필 설정</div>
      <div class="signup-subtitle">선호하는 장르와 독서 목표를 설정하세요</div>

      <div class="nc-form-group">
        <label class="nc-label">선호 장르 <span style="color:var(--error)">*</span> (1개 이상 선택)</label>
        <div class="genre-checkboxes" id="reader-genres">
          <button class="genre-check" data-genre="FANTASY">판타지</button>
          <button class="genre-check" data-genre="ROMANCE_FANTASY">로판</button>
          <button class="genre-check" data-genre="MODERN">현대</button>
          <button class="genre-check" data-genre="CHIVALROUS">무협</button>
          <button class="genre-check" data-genre="BL">BL</button>
          <button class="genre-check" data-genre="SF">SF</button>
          <button class="genre-check" data-genre="HORROR">공포</button>
          <button class="genre-check" data-genre="CLASSIC">고전</button>
          <button class="genre-check" data-genre="DAILY_LIFE">일상물</button>
        </div>
      </div>

      <div class="nc-form-group">
        <label class="nc-label">독서 목표</label>
        <div class="goal-options">
          <button class="goal-card" data-goal="LIGHT">
            <div class="goal-card__title">가볍게 즐기기</div>
            <div class="goal-card__desc">주 1~2편</div>
          </button>
          <button class="goal-card" data-goal="STEADY">
            <div class="goal-card__title">꾸준히 시작하기</div>
            <div class="goal-card__desc">주 3~4편</div>
          </button>
          <button class="goal-card" data-goal="PASSIONATE">
            <div class="goal-card__title">열독가</div>
            <div class="goal-card__desc">매일 읽기</div>
          </button>
          <button class="goal-card" data-goal="CUSTOM">
            <div class="goal-card__title">직접 설정</div>
            <div class="goal-card__desc">나중에 설정</div>
          </button>
        </div>
      </div>

      <div class="nc-form-group">
        <label class="check-label">
          <input type="checkbox" id="reader-notify-novel"><span>새 소설 알림 수신</span>
        </label>
        <label class="check-label">
          <input type="checkbox" id="reader-notify-event"><span>이벤트 알림 수신</span>
        </label>
      </div>

      <div class="signup-nav">
        <button class="nc-btn nc-btn--outline" onclick="prevStep(3)">이전</button>
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="submitReader()" id="reader-submit-btn">가입 완료</button>
      </div>
    </div>

    <!-- ──────── STEP 3: 추가 정보 (작가) ──────── -->
    <div class="step-panel" id="panel-3-author">
      <div class="signup-title">작가 프로필 설정</div>
      <div class="signup-subtitle">작가 활동에 필요한 정보를 입력하세요</div>

      <div class="nc-form-group">
        <label class="nc-label">주력 장르 <span style="color:var(--error)">*</span> (1개 이상 선택)</label>
        <div class="genre-checkboxes" id="author-genres">
          <button class="genre-check" data-genre="FANTASY">판타지</button>
          <button class="genre-check" data-genre="ROMANCE_FANTASY">로판</button>
          <button class="genre-check" data-genre="MODERN">현대</button>
          <button class="genre-check" data-genre="CHIVALROUS">무협</button>
          <button class="genre-check" data-genre="BL">BL</button>
          <button class="genre-check" data-genre="SF">SF</button>
          <button class="genre-check" data-genre="HORROR">공포</button>
          <button class="genre-check" data-genre="CLASSIC">고전</button>
          <button class="genre-check" data-genre="DAILY_LIFE">일상물</button>
        </div>
      </div>

      <div class="nc-form-group">
        <label class="nc-label">작가 소개 <span style="color:var(--error)">*</span></label>
        <textarea id="author-bio" class="nc-textarea" placeholder="작가 소개를 입력하세요 (10자 이상 500자 이하)" rows="3" maxlength="500"></textarea>
        <div class="nc-input-hint" id="author-bio-count">0/500자 (최소 10자)</div>
      </div>

      <div class="nc-form-group">
        <label class="nc-label">경력 수준 <span style="color:var(--error)">*</span></label>
        <div class="career-options">
          <button class="career-card" data-career="INTRODUCTION">
            <div class="career-card__title">입문</div>
            <div class="career-card__desc">막 글을 시작했어요</div>
          </button>
          <button class="career-card" data-career="ELEMENTARY">
            <div class="career-card__title">초보</div>
            <div class="career-card__desc">어느 정도 경험이 있어요</div>
          </button>
          <button class="career-card" data-career="INTERMEDIATE">
            <div class="career-card__title">중급</div>
            <div class="career-card__desc">꽤 많이 써봤어요</div>
          </button>
          <button class="career-card" data-career="PROFICIENT">
            <div class="career-card__title">숙련</div>
            <div class="career-card__desc">프로 수준이에요</div>
          </button>
        </div>
      </div>

      <div class="nc-form-group">
        <label class="check-label">
          <input type="checkbox" id="author-allow-mentee">
          <span>멘티 신청 허용 (멘토링 요청 수락 가능)</span>
        </label>
      </div>

      <div class="nc-form-group">
        <label class="nc-label">SNS 링크 (선택)</label>
        <div class="sns-group">
          <div class="sns-input-wrap">
            <span class="sns-label">📸 Instagram</span>
            <input type="url" id="author-instagram" class="nc-input" placeholder="https://instagram.com/...">
          </div>
          <div class="sns-input-wrap">
            <span class="sns-label">✕ X(Twitter)</span>
            <input type="url" id="author-x" class="nc-input" placeholder="https://x.com/...">
          </div>
          <div class="sns-input-wrap">
            <span class="sns-label">📝 블로그</span>
            <input type="url" id="author-blog" class="nc-input" placeholder="https://blog.naver.com/...">
          </div>
        </div>
      </div>

      <div class="signup-nav">
        <button class="nc-btn nc-btn--outline" onclick="prevStep(3)">이전</button>
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="submitAuthor()" id="author-submit-btn">가입 완료</button>
      </div>
    </div>

  </div><!-- /.signup-card -->

  <div class="signup-footer">
    이미 계정이 있으신가요? <a href="/login.html">로그인</a>
  </div>
</div>

<script>
  /* ── 상태 ── */
  let currentStep   = 1;
  let selectedRole  = '';
  let tempToken     = null;   // SMS 인증 UUID
  let signupToken   = null;   // JWT tempToken
  let phoneVerified = false;
  let emailOk       = false;
  let nicknameOk    = false;
  let selectedGoal  = null;
  let selectedCareer = null;

  document.getElementById('s-birthday').max = new Date().toISOString().split('T')[0];

  /* ── URL 파라미터 ── */
  const urlP        = new URLSearchParams(location.search);
  const socialToken = urlP.get('socialToken');
  const isSocial    = !!socialToken;
  const provider    = urlP.get('provider') || sessionStorage.getItem('oauthProvider') || 'google';

  // 토큰이 주소창에 노출되지 않도록 즉시 제거
  if (isSocial) history.replaceState({}, '', location.pathname);

  /* ── 로그인 체크 (소셜 플로우 제외) ── */
  if (!isSocial && Auth.isLoggedIn()) window.location.href = '/index.html';

  /* ── 소셜 모드 초기화 ── */
  if (isSocial) {
    sessionStorage.removeItem('oauthProvider');
    // 페이지 로드 시에는 토큰 미설정 → common.js의 nav API 호출 방지
    signupToken = socialToken.replace('Bearer ', '');

    // 이메일/비밀번호 섹션 숨기기
    document.getElementById('email-pw-section').style.display = 'none';

    // step 1 타이틀/서브타이틀 변경
    document.getElementById('step1-title').textContent    = '소셜 계정 추가 정보';
    document.getElementById('step1-subtitle').textContent = '닉네임, 생년월일, 휴대폰 인증을 완료하세요';
    document.getElementById('step-l1').textContent        = '추가 정보';
    document.getElementById('step1-btn').textContent      = '다음';

    // 공급자 배지 표시
    const PROVIDER = {
      google: { label: '구글',   icon: 'G',  bg: '#fff',    color: '#3c4043', border: '#dadce0' },
      kakao:  { label: '카카오', icon: '💬', bg: '#FEE500', color: '#191919', border: '#FEE500' },
      naver:  { label: '네이버', icon: 'N',  bg: '#03C75A', color: '#fff',    border: '#03C75A' },
    };
    const p = PROVIDER[provider] || { label: provider, icon: '●', bg: 'var(--primary)', color: '#fff', border: 'var(--primary)' };
    const box = document.getElementById('social-provider-box');
    box.style.display = 'flex';
    box.className = 'provider-badge';
    box.innerHTML = `
      <div class="provider-icon" style="background:${p.bg};color:${p.color};border:1px solid ${p.border}">${p.icon}</div>
      <span>${p.label} 계정으로 가입 중입니다</span>`;
  }

  /* ── 이벤트 ── */
  document.querySelectorAll('.genre-check').forEach(btn =>
    btn.addEventListener('click', () => btn.classList.toggle('selected'))
  );
  document.querySelectorAll('.goal-card').forEach(card =>
    card.addEventListener('click', () => {
      document.querySelectorAll('.goal-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedGoal = card.dataset.goal;
    })
  );
  document.querySelectorAll('.career-card').forEach(card =>
    card.addEventListener('click', () => {
      document.querySelectorAll('.career-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedCareer = card.dataset.career;
    })
  );
  document.getElementById('author-bio').addEventListener('input', function() {
    const len = this.value.length;
    const hint = document.getElementById('author-bio-count');
    hint.textContent = `${len}/500자 (최소 10자)`;
    hint.style.color = len < 10 ? 'var(--error)' : 'var(--text3)';
  });

  /* ── 스텝 제어 ── */
  function setStep(n) {
    for (let i = 1; i <= 3; i++) {
      document.getElementById(`step-ind-${i}`)?.classList.remove('active', 'done');
      document.getElementById(`step-c${i}`).textContent = i;
    }
    document.getElementById('step-line-1')?.classList.remove('done');
    document.getElementById('step-line-2')?.classList.remove('done');

    for (let i = 1; i < n; i++) {
      const ind = document.getElementById(`step-ind-${i}`);
      if (ind) { ind.classList.add('done'); document.getElementById(`step-c${i}`).textContent = '✓'; }
      if (i === 1) document.getElementById('step-line-1')?.classList.add('done');
      if (i === 2) document.getElementById('step-line-2')?.classList.add('done');
    }
    document.getElementById(`step-ind-${n}`)?.classList.add('active');
    document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
    if (n === 3 && selectedRole) {
      document.getElementById(`panel-3-${selectedRole}`)?.classList.add('active');
    } else {
      document.getElementById(`panel-${n}`)?.classList.add('active');
    }
    currentStep = n;
  }

  function prevStep(current) { setStep(current - 1); }

  /* ── 이메일 중복 확인 ── */
  async function checkEmail() {
    const email = document.getElementById('s-email').value.trim();
    const res   = document.getElementById('email-result');
    if (!email) { res.innerHTML = '<span class="check-err">이메일을 입력하세요</span>'; return; }
    try {
      await api.get(`/auth/email/check?email=${encodeURIComponent(email)}`);
      res.innerHTML = '<span class="check-ok">✓ 사용 가능한 이메일입니다</span>';
      emailOk = true;
    } catch (e) {
      res.innerHTML = `<span class="check-err">✕ ${e.message || '이미 사용 중인 이메일입니다'}</span>`;
      emailOk = false;
    }
  }

  /* ── 닉네임 중복 확인 ── */
  async function checkNickname() {
    const nick = document.getElementById('s-nickname').value.trim();
    const res  = document.getElementById('nickname-result');
    if (!nick) { res.innerHTML = '<span class="check-err">닉네임을 입력하세요</span>'; return; }
    try {
      await api.get(`/auth/nickname/check?nickname=${encodeURIComponent(nick)}`);
      res.innerHTML = '<span class="check-ok">✓ 사용 가능한 닉네임입니다</span>';
      nicknameOk = true;
    } catch (e) {
      res.innerHTML = `<span class="check-err">✕ ${e.message || '이미 사용 중인 닉네임입니다'}</span>`;
      nicknameOk = false;
    }
  }

  /* ── SMS 인증 ── */
  async function sendSms() {
    const phone = document.getElementById('s-phone').value.replace(/-/g, '');
    if (!phone) { Toast.error('휴대폰 번호를 입력하세요'); return; }
    const btn = document.getElementById('sms-btn');
    btn.disabled = true; btn.textContent = '발송 중...';
    try {
      await api.post('/auth/phone/send', { phoneNo: phone });
      document.getElementById('verify-code-group').style.display = 'block';
      Toast.success('인증번호가 발송되었습니다');
      btn.textContent = '재발송';
    } catch (e) {
      Toast.error(e.message || '발송 실패');
      btn.textContent = '인증번호 발송';
    } finally { btn.disabled = false; }
  }

  async function verifyPhone() {
    const phone = document.getElementById('s-phone').value.replace(/-/g, '');
    const code  = document.getElementById('s-code').value.trim();
    const res   = document.getElementById('phone-result');
    if (!code || code.length !== 6) { res.innerHTML = '<span class="check-err">6자리 인증번호를 입력하세요</span>'; return; }
    try {
      const r = await api.post('/auth/phone/verify', { phoneNo: phone, verificationCode: code });
      tempToken = r;
      res.innerHTML = '<span class="check-ok">✓ 인증 완료</span>';
      phoneVerified = true;
    } catch (e) {
      res.innerHTML = `<span class="check-err">✕ ${e.message || '인증 실패'}</span>`;
      phoneVerified = false;
    }
  }

  /* ── Step 1 제출: 소셜 / 일반 분기 ── */
  async function nextStep1() {
    if (isSocial) {
      await nextStep1Social();
    } else {
      await nextStep1Normal();
    }
  }

  /* 소셜 추가 정보 → POST /api/auth/social/signup/{provider} */
  async function nextStep1Social() {
    const nick     = document.getElementById('s-nickname').value.trim();
    const birthday = document.getElementById('s-birthday').value;

    if (!nick || !birthday)  { Toast.error('필수 항목을 모두 입력하세요'); return; }
    if (!nicknameOk)         { Toast.error('닉네임 중복 확인을 해주세요'); return; }
    if (!phoneVerified)      { Toast.error('휴대폰 인증을 완료해주세요'); return; }
    if (!document.getElementById('s-terms').checked) { Toast.error('이용약관에 동의해주세요'); return; }

    const btn = document.getElementById('step1-btn');
    btn.disabled = true; btn.textContent = '처리 중...';
    try {
      const phone = document.getElementById('s-phone').value.replace(/-/g, '');
      // API 호출 직전에 소셜 토큰 설정 (페이지 로드 시 nav API 호출 방지)
      Auth.setToken(signupToken);
      /* POST /api/auth/social/signup/{provider}
         SocialSignupRequest  : { nickname, birthDay, phoneNo, tempToken(SMS UUID) }
         SocialSignupResponse : { tempToken(JWT), email, nickname }               */
      const res = await api.post(`/auth/social/signup/${provider}`, {
        nickname:  nick,
        birthDay:  birthday,
        phoneNo:   phone,
        tempToken: tempToken,
      }, true);

      signupToken = res.tempToken;
      Auth.setToken(signupToken.replace('Bearer ', ''));
      setStep(2);
    } catch (e) {
      Toast.error(e.message || '소셜 가입 정보 확인 실패');
      btn.disabled = false; btn.textContent = '다음';
    }
  }

  /* 일반 기본 정보 → POST /api/auth/signup */
  async function nextStep1Normal() {
    const email    = document.getElementById('s-email').value.trim();
    const nick     = document.getElementById('s-nickname').value.trim();
    const birthday = document.getElementById('s-birthday').value;
    const pw       = document.getElementById('s-pw').value;
    const pw2      = document.getElementById('s-pw2').value;

    if (!email || !nick || !birthday || !pw) { Toast.error('필수 항목을 모두 입력하세요'); return; }
    if (!emailOk)    { Toast.error('이메일 중복 확인을 해주세요'); return; }
    if (!nicknameOk) { Toast.error('닉네임 중복 확인을 해주세요'); return; }
    if (pw !== pw2)  { document.getElementById('pw-result').innerHTML = '<span class="check-err">✕ 비밀번호가 일치하지 않습니다</span>'; return; }
    if (pw.length < 8) { Toast.error('비밀번호는 8자 이상이어야 합니다'); return; }
    if (!/(?=.*[A-Za-z])(?=.*\d)/.test(pw)) { Toast.error('비밀번호는 영문자와 숫자를 포함해야 합니다'); return; }
    if (!phoneVerified) { Toast.error('휴대폰 인증을 완료해주세요'); return; }
    if (!document.getElementById('s-terms').checked) { Toast.error('이용약관에 동의해주세요'); return; }

    try {
      const phone = document.getElementById('s-phone').value.replace(/-/g, '');
      const res = await api.post('/auth/signup', {
        email, nickname: nick, password: pw,
        birthDay: birthday, phoneNo: phone, tempToken,
      });
      signupToken = res.tempToken;
      Auth.setToken(signupToken.replace('Bearer ', ''));
      setStep(2);
    } catch (e) {
      Toast.error(e.message || '가입 정보 확인 실패');
    }
  }

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    document.getElementById(`role-${role}`)?.classList.add('selected');
  }

  function nextStep2() {
    if (!selectedRole) { Toast.error('역할을 선택해주세요'); return; }
    setStep(3);
  }

  async function submitReader() {
    const genres = Array.from(document.querySelectorAll('#reader-genres .genre-check.selected'))
                        .map(b => b.dataset.genre);
    if (!genres.length) { Toast.error('선호 장르를 1개 이상 선택해주세요'); return; }

    const btn = document.getElementById('reader-submit-btn');
    btn.disabled = true; btn.textContent = '처리 중...';
    try {
      await api.post('/auth/signup/reader', {
        preferredGenres: genres,
        readingGoal:     selectedGoal || null,
        notifyNewNovel:  document.getElementById('reader-notify-novel').checked,
        notifyEvent:     document.getElementById('reader-notify-event').checked,
      }, true);
      Toast.success('회원가입 완료! 로그인해주세요 🎉');
      Auth.removeToken(); Auth.removeUser();
      setTimeout(() => window.location.href = '/login.html', 1200);
    } catch (e) {
      Toast.error(e.message || '가입 실패');
      btn.disabled = false; btn.textContent = '가입 완료';
    }
  }

  async function submitAuthor() {
    const genres = Array.from(document.querySelectorAll('#author-genres .genre-check.selected'))
                        .map(b => b.dataset.genre);
    const bio = document.getElementById('author-bio').value.trim();

    if (!genres.length)          { Toast.error('주력 장르를 1개 이상 선택해주세요'); return; }
    if (!bio || bio.length < 10) { Toast.error('작가 소개를 10자 이상 입력해주세요'); return; }
    if (!selectedCareer)         { Toast.error('경력 수준을 선택해주세요'); return; }

    const btn = document.getElementById('author-submit-btn');
    btn.disabled = true; btn.textContent = '처리 중...';
    try {
      await api.post('/auth/signup/author', {
        genres,
        bio,
        careerLevel:        selectedCareer,
        allowMenteeRequest: document.getElementById('author-allow-mentee').checked,
        instagramLinks:     document.getElementById('author-instagram').value.trim() || null,
        xLinks:             document.getElementById('author-x').value.trim() || null,
        blogLinks:          document.getElementById('author-blog').value.trim() || null,
      }, true);
      Toast.success('작가 회원가입 완료! 로그인해주세요 ✍️');
      Auth.removeToken(); Auth.removeUser();
      setTimeout(() => window.location.href = '/login.html', 1200);
    } catch (e) {
      Toast.error(e.message || '가입 실패');
      btn.disabled = false; btn.textContent = '가입 완료';
    }
  }
</script>
</body>
</html>
