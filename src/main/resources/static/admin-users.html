<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 관리 - NovelCraft Admin</title>
  <script src="/common.js"></script>
  <style>
    .admin-layout { display: flex; min-height: calc(100vh - 60px); }

    /* ── 사이드바 ── */
    .admin-sidebar {
      width: 220px; background: var(--bg2);
      border-right: 1px solid var(--border); flex-shrink: 0;
      padding: 24px 0; position: sticky; top: 60px;
      height: calc(100vh - 60px); overflow-y: auto;
    }
    .admin-sidebar__logo { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .admin-sidebar__logo-text { font-weight: 700; font-size: 0.9rem; color: var(--warning); }
    .admin-sidebar__role { font-size: 0.7rem; color: var(--text3); margin-top: 2px; }
    .admin-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; color: var(--text2); text-decoration: none;
      font-size: 0.875rem; transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .admin-nav-item:hover { background: var(--surface); color: var(--text); }
    .admin-nav-item.active {
      background: rgba(124,90,240,0.1); color: var(--primary-light);
      border-left-color: var(--primary); font-weight: 600;
    }
    .admin-nav-item__icon { font-size: 1rem; width: 20px; text-align: center; }
    .admin-sidebar__divider { height: 1px; background: var(--border); margin: 10px 20px; }
    .admin-sidebar__section {
      padding: 8px 20px 4px; font-size: 0.68rem; font-weight: 700;
      color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em;
    }

    /* ── 메인 ── */
    .admin-main { flex: 1; padding: 28px 32px; overflow-x: hidden; }
    .admin-header { margin-bottom: 24px; }
    .admin-title { font-family: 'Noto Serif KR', serif; font-size: 1.5rem; font-weight: 700; }
    .admin-subtitle { color: var(--text3); font-size: 0.85rem; margin-top: 4px; }

    /* ── 권한 안내 배너 ── */
    .super-only-banner {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; margin-bottom: 24px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius);
    }
    .super-only-banner__icon { font-size: 1.2rem; }
    .super-only-banner__text { font-size: 0.85rem; color: #fbbf24; }

    /* ── 테이블 ── */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 20px;
    }
    .table-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-header-title { font-size: 0.9rem; font-weight: 700; }
    .table-count {
      font-size: 0.78rem; color: var(--text3); padding: 3px 10px;
      background: var(--bg2); border-radius: 20px; border: 1px solid var(--border);
    }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      padding: 10px 16px; font-size: 0.72rem; font-weight: 700; color: var(--text3);
      text-align: left; background: var(--bg2);
      text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
    }
    .data-table td {
      padding: 14px 16px; font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.025); }

    /* ── 유저 아바타 ── */
    .user-cell { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem; color: white;
    }
    .user-name { font-weight: 600; font-size: 0.9rem; }
    .user-email { font-size: 0.75rem; color: var(--text3); margin-top: 1px; }

    /* ── 상태 뱃지 ── */
    .st-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600;
    }
    .st-pending  { background: rgba(245,158,11,0.15);  color: #f59e0b;  border: 1px solid rgba(245,158,11,0.3); }
    .st-approved { background: rgba(99,102,241,0.15);  color: #818cf8;  border: 1px solid rgba(99,102,241,0.3); }
    .st-rejected { background: rgba(239,68,68,0.15);   color: #ef4444;  border: 1px solid rgba(239,68,68,0.3); }

    /* ── 역할 뱃지 ── */
    .role-badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    }
    .role-ADMIN       { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.35); }
    .role-SUPER_ADMIN { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
    .role-AUTHOR      { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .role-MENTOR      { background: rgba(124,90,240,0.12); color: var(--primary-light); border: 1px solid rgba(124,90,240,0.3); }
    .role-READER      { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }

    /* ── 액션 버튼 ── */
    .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn {
      padding: 6px 14px; border-radius: 6px; font-size: 0.8rem;
      font-family: inherit; cursor: pointer; font-weight: 600;
      transition: all 0.2s; border: 1px solid;
    }
    .act-btn--approve { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.4); color: #10b981; }
    .act-btn--approve:hover { background: #10b981; color: white; }
    .act-btn--reject  { background: rgba(239,68,68,0.1);  border-color: rgba(239,68,68,0.35);  color: #ef4444; }
    .act-btn--reject:hover  { background: #ef4444;  color: white; }

    /* ── 통계 카드 ── */
    .stat-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 22px;
    }
    .stat-card__label { font-size: 0.75rem; color: var(--text3); font-weight: 600; margin-bottom: 8px; }
    .stat-card__value { font-size: 1.8rem; font-weight: 700; font-family: 'Noto Serif KR', serif; }

    /* ── 빈 상태 ── */
    .empty-box {
      padding: 80px 24px; text-align: center; color: var(--text3);
    }
    .empty-box__icon { font-size: 3rem; margin-bottom: 14px; }
    .empty-box__title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--text2); }
    .empty-box__desc { font-size: 0.85rem; line-height: 1.6; }

    /* ── 확인 모달 ── */
    #modal-confirm .nc-modal__box { max-width: 420px; }
    .confirm-icon { font-size: 2.5rem; text-align: center; margin-bottom: 12px; }
    .confirm-msg { text-align: center; font-size: 0.95rem; line-height: 1.6; color: var(--text2); margin-bottom: 20px; }

    @media (max-width: 768px) {
      .admin-sidebar { display: none; }
      .admin-main { padding: 16px; }
      .stat-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<nav id="nc-nav"></nav>

<div class="admin-layout">
  <!-- 사이드바 -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <div class="admin-sidebar__logo-text">⚙ 관리자</div>
      <div class="admin-sidebar__role" id="sidebar-role-label">SUPER_ADMIN</div>
    </div>
    <div class="admin-sidebar__section">메뉴</div>
    <a href="/admin.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">📊</span> 대시보드
    </a>
    <a href="/admin-reports.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">🚨</span> 신고 관리
    </a>
    <a href="/admin-mentors.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">🎓</span> 멘토 신청
    </a>
    <div class="admin-sidebar__divider"></div>
    <a href="/admin-users.html" class="admin-nav-item active">
      <span class="admin-nav-item__icon">👥</span> 사용자 관리
    </a>
    <div class="admin-sidebar__divider"></div>
    <a href="/index.html" class="admin-nav-item">
      <span class="admin-nav-item__icon">🏠</span> 메인으로
    </a>
  </aside>

  <!-- 메인 -->
  <main class="admin-main">
    <div class="admin-header">
      <div class="admin-title">👥 사용자 관리</div>
      <div class="admin-subtitle">어드민 계정 신청을 심사합니다 (SUPER_ADMIN 전용)</div>
    </div>

    <!-- SUPER_ADMIN 전용 배너 -->
    <div class="super-only-banner">
      <div class="super-only-banner__icon">🔐</div>
      <div class="super-only-banner__text">
        이 페이지는 <strong>SUPER_ADMIN</strong> 전용입니다. 어드민 계정 승인 권한을 신중하게 사용하세요.
      </div>
    </div>

    <!-- 통계 카드 -->
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-card__label">⏳ 대기 중 계정</div>
        <div class="stat-card__value" id="stat-pending" style="color:#f59e0b">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">✅ 승인된 어드민</div>
        <div class="stat-card__value" id="stat-approved" style="color:#818cf8">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">🗓 오늘 처리</div>
        <div class="stat-card__value" id="stat-today" style="color:#34d399">-</div>
      </div>
    </div>

    <!-- 대기 중 어드민 계정 -->
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-header-title">⏳ 대기 중인 어드민 계정</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="table-count" id="pending-count">0건</span>
          <button class="nc-btn nc-btn--outline nc-btn--sm" onclick="loadPendingUsers()">🔄 새로고침</button>
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>사용자</th>
            <th>역할</th>
            <th>신청일</th>
            <th>추가 정보</th>
            <th>처리</th>
          </tr>
        </thead>
        <tbody id="pending-tbody">
          <tr><td colspan="5" style="text-align:center;padding:40px">
            <div class="nc-spinner" style="width:28px;height:28px;margin:auto"></div>
          </td></tr>
        </tbody>
      </table>
    </div>

    <!-- 처리 히스토리 (최근 승인/거절) -->
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-header-title">📋 최근 처리 내역</div>
        <span class="table-count" id="history-count">-</span>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>사용자</th>
            <th>역할</th>
            <th>처리 결과</th>
            <th>처리일</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="4" style="text-align:center;padding:30px">
            <div class="nc-spinner" style="width:22px;height:22px;margin:auto"></div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- 확인 모달 -->
<div class="nc-modal" id="modal-confirm">
  <div class="nc-modal__backdrop" onclick="Modal.close('modal-confirm')"></div>
  <div class="nc-modal__box">
    <button class="nc-modal__close" onclick="Modal.close('modal-confirm')">✕</button>
    <div class="confirm-icon" id="confirm-icon"></div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <input type="hidden" id="confirm-user-id">
    <input type="hidden" id="confirm-action">
    <div style="display:flex;gap:10px">
      <button class="nc-btn nc-btn--outline nc-btn--full" onclick="Modal.close('modal-confirm')">취소</button>
      <button class="nc-btn nc-btn--full" id="confirm-action-btn" onclick="executeConfirmAction()">확인</button>
    </div>
  </div>
</div>

<script>
  let todayProcessed = 0;

  document.addEventListener('DOMContentLoaded', () => {
    const user = Auth.getUser();
    if (!user || user.role !== 'SUPER_ADMIN') {
      Toast.error('SUPER_ADMIN 권한이 필요합니다');
      setTimeout(() => window.location.href = '/admin.html', 1500);
      return;
    }
    const roleLabel = document.getElementById('sidebar-role-label');
    if (roleLabel) roleLabel.textContent = user.role;
    loadPendingUsers();
    loadHistoryUsers();
  });

  async function loadPendingUsers() {
    const tbody = document.getElementById('pending-tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px"><div class="nc-spinner" style="width:28px;height:28px;margin:auto"></div></td></tr>';
    try {
      const res = await api.get('/admin/users/pending', true);
      const list = Array.isArray(res) ? res : (res?.content || []);
      document.getElementById('pending-count').textContent = `${list.length}건`;
      document.getElementById('stat-pending').textContent = list.length;

      if (!list.length) {
        tbody.innerHTML = `
          <tr><td colspan="5">
            <div class="empty-box">
              <div class="empty-box__icon">✅</div>
              <div class="empty-box__title">대기 중인 계정이 없습니다</div>
              <div class="empty-box__desc">모든 어드민 신청이 처리되었습니다.</div>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(u => `
        <tr>
          <td>
            <div class="user-cell">
              <div class="user-avatar">${(u.nickname || u.email || '?').charAt(0).toUpperCase()}</div>
              <div>
                <div class="user-name">${escHtml(u.nickname || '-')}</div>
                <div class="user-email">${escHtml(u.email || '-')}</div>
              </div>
            </div>
          </td>
          <td><span class="role-badge role-${u.role || 'ADMIN'}">${escHtml(u.role || 'ADMIN')}</span></td>
          <td style="color:var(--text3);font-size:0.8rem;white-space:nowrap">${formatDate(u.createdAt || u.appliedAt)}</td>
          <td style="font-size:0.8rem;color:var(--text3)">
            ${u.phoneNo ? `📱 ${escHtml(u.phoneNo)}` : '-'}
          </td>
          <td>
            <div class="action-btns">
              <button class="act-btn act-btn--approve" onclick="openConfirm(${u.userId || u.id}, 'approve', '${escHtml(u.nickname || u.email)}')">✅ 승인</button>
              <button class="act-btn act-btn--reject"  onclick="openConfirm(${u.userId || u.id}, 'reject',  '${escHtml(u.nickname || u.email)}')">❌ 거절</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--error)">
        로드 실패: ${escHtml(e.message)}</td></tr>`;
    }
  }

  async function loadHistoryUsers() {
    const tbody = document.getElementById('history-tbody');
    try {
      /* 히스토리 전용 API가 없으므로 최근 승인된 어드민 목록으로 대체 */
      const res = await api.get('/admin/users/pending', true);
      /* API가 처리 완료된 목록도 반환할 수 있다고 가정 — 없으면 빈 목록 */
      const all = Array.isArray(res) ? [] : (res?.processedContent || res?.approved || []);

      const approved = document.getElementById('stat-approved');
      if (approved) approved.textContent = all.filter(u => u.approved).length || '-';
      const today = document.getElementById('stat-today');
      if (today) today.textContent = todayProcessed;

      if (!all.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--text3)">처리 내역이 없습니다</td></tr>';
        return;
      }
      document.getElementById('history-count').textContent = `${all.length}건`;
      tbody.innerHTML = all.map(u => `
        <tr>
          <td>
            <div class="user-cell">
              <div class="user-avatar">${(u.nickname || '?').charAt(0).toUpperCase()}</div>
              <div>
                <div class="user-name">${escHtml(u.nickname || '-')}</div>
                <div class="user-email">${escHtml(u.email || '-')}</div>
              </div>
            </div>
          </td>
          <td><span class="role-badge role-${u.role || 'ADMIN'}">${escHtml(u.role || 'ADMIN')}</span></td>
          <td>${u.approved ? '<span class="st-badge st-approved">승인</span>' : '<span class="st-badge st-rejected">거절</span>'}</td>
          <td style="color:var(--text3);font-size:0.8rem">${formatDate(u.processedAt || u.updatedAt)}</td>
        </tr>
      `).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--text3)">처리 내역을 불러올 수 없습니다</td></tr>';
    }
  }

  function openConfirm(userId, action, name) {
    document.getElementById('confirm-user-id').value = userId;
    document.getElementById('confirm-action').value = action;
    const icon = document.getElementById('confirm-icon');
    const msg  = document.getElementById('confirm-msg');
    const btn  = document.getElementById('confirm-action-btn');
    if (action === 'approve') {
      icon.textContent = '✅';
      msg.innerHTML = `<strong>${escHtml(name)}</strong>의 어드민 계정을 <strong style="color:#10b981">승인</strong>하시겠습니까?<br><span style="font-size:0.8rem;color:var(--text3)">승인 후 해당 계정은 관리자 권한을 갖게 됩니다.</span>`;
      btn.textContent = '승인 확정';
      btn.style.cssText = 'background:#10b981;border:1px solid #10b981;color:white';
    } else {
      icon.textContent = '❌';
      msg.innerHTML = `<strong>${escHtml(name)}</strong>의 어드민 계정 신청을 <strong style="color:#ef4444">거절</strong>하시겠습니까?`;
      btn.textContent = '거절 확정';
      btn.style.cssText = 'background:#ef4444;border:1px solid #ef4444;color:white';
    }
    Modal.open('modal-confirm');
  }

  async function executeConfirmAction() {
    const userId = document.getElementById('confirm-user-id').value;
    const action = document.getElementById('confirm-action').value;
    const btn = document.getElementById('confirm-action-btn');
    btn.disabled = true; btn.textContent = '처리 중...';
    try {
      if (action === 'approve') {
        await api.patch(`/admin/users/${userId}/approve`, {}, true);
        Toast.success('어드민 계정이 승인되었습니다');
      } else {
        await api.patch(`/admin/users/${userId}/reject`, {}, true);
        Toast.success('어드민 신청이 거절되었습니다');
      }
      todayProcessed++;
      const today = document.getElementById('stat-today');
      if (today) today.textContent = todayProcessed;
      Modal.close('modal-confirm');
      loadPendingUsers();
      loadHistoryUsers();
    } catch (e) {
      Toast.error(e.message || '처리 실패');
    } finally {
      btn.disabled = false;
    }
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
