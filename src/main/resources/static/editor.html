<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 작가 에디터</title>
  <script src="/common.js"></script>
  <style>
    .editor-layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 60px); }

    /* 사이드 패널 */
    .editor-side {
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .editor-side__header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .editor-side__title { font-weight: 700; font-size: 1rem; }
    .novel-list-side { flex: 1; overflow-y: auto; }
    .novel-side-item {
      padding: 14px 20px; cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background 0.15s; position: relative;
    }
    .novel-side-item:hover { background: var(--surface2); }
    .novel-side-item.active { background: rgba(124,90,240,0.1); border-left: 3px solid var(--primary); }
    .novel-side-item__title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .novel-side-item__meta { font-size: 0.75rem; color: var(--text3); }

    /* 메인 에디터 */
    .editor-main { display: flex; flex-direction: column; overflow: hidden; }
    .editor-toolbar {
      padding: 14px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .editor-toolbar__title { font-weight: 700; font-size: 0.95rem; flex: 1; }

    /* 에디터 뷰들 */
    .editor-view { flex: 1; overflow-y: auto; padding: 24px; display: none; }
    .editor-view.active { display: block; }

    /* 소설 등록 폼 */
    .novel-form { max-width: 600px; }

    /* 회차 에디터 */
    .ep-editor { max-width: 800px; }
    .ep-title-input {
      width: 100%; padding: 12px 16px; background: transparent;
      border: none; border-bottom: 2px solid var(--border); outline: none;
      font-size: 1.3rem; font-weight: 700; color: var(--text);
      font-family: 'Noto Serif KR', serif; margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .ep-title-input:focus { border-bottom-color: var(--primary); }
    .ep-content-area {
      width: 100%; min-height: 400px;
      padding: 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 1rem; font-family: 'Noto Serif KR', serif;
      line-height: 2; resize: vertical; outline: none;
      transition: border-color 0.2s;
    }
    .ep-content-area:focus { border-color: var(--primary); }
    .ep-char-count { text-align: right; font-size: 0.75rem; color: var(--text3); margin-top: 6px; }
    .ep-toolbar {
      display: flex; gap: 10px; padding: 12px 0; flex-wrap: wrap; align-items: center;
    }
    .ep-toolbar-badge {
      padding: 4px 10px; border-radius: 6px;
      background: var(--surface2); font-size: 0.75rem; color: var(--text3); border: 1px solid var(--border);
    }
    .ep-toolbar-badge.draft { color: var(--warning); border-color: var(--warning)40; background: var(--warning)10; }
    .ep-toolbar-badge.published { color: var(--success); border-color: var(--success)40; background: var(--success)10; }

    /* 회차 목록 */
    .ep-list-table { width: 100%; border-collapse: collapse; }
    .ep-list-table th {
      padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
      font-size: 0.8rem; font-weight: 600; color: var(--text3); text-align: left;
    }
    .ep-list-table td { padding: 12px 16px; border: 1px solid var(--border); font-size: 0.875rem; }
    .ep-list-table tr:hover td { background: var(--surface); }

    /* 설정집 사이드바 */
    .wiki-form { display: flex; flex-direction: column; gap: 16px; }
    .wiki-type-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .wiki-type-btn {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); font-size: 0.8rem; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .wiki-type-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* 통계 */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; text-align: center;
    }
    .stat-box__val { font-size: 1.8rem; font-weight: 900; font-family: 'Noto Serif KR', serif; }
    .stat-box__lbl { font-size: 0.75rem; color: var(--text3); margin-top: 4px; }

    /* AI 리뷰 */
    .ai-review-box {
      background: rgba(124,90,240,0.08); border: 1px solid rgba(124,90,240,0.25);
      border-radius: var(--radius); padding: 20px;
    }
    .ai-review-score { font-size: 2.5rem; font-weight: 900; color: var(--accent); text-align: center; }
    .ai-review-text { font-size: 0.875rem; color: var(--text2); line-height: 1.7; margin-top: 12px; }

    @media (max-width: 768px) {
      .editor-layout { grid-template-columns: 1fr; }
      .editor-side { display: none; }
    }
  </style>
</head>
<body>
  <nav id="nc-nav"></nav>

  <div class="editor-layout">
    <!-- 좌측 소설 목록 -->
    <div class="editor-side">
      <div class="editor-side__header">
        <span class="editor-side__title">✍️ 내 소설</span>
        <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="showView('novel-create')">+ 등록</button>
      </div>
      <div class="novel-list-side" id="novel-list-side">
        <div class="nc-loading"><div class="nc-spinner"></div></div>
      </div>
    </div>

    <!-- 우측 메인 -->
    <div class="editor-main">
      <!-- 툴바 -->
      <div class="editor-toolbar">
        <span class="editor-toolbar__title" id="toolbar-title">소설을 선택하세요</span>
        <button class="nc-btn nc-btn--sm nc-btn--outline" id="btn-wiki" onclick="openWikiSidebar()" style="display:none">📚 설정집</button>
        <button class="nc-btn nc-btn--sm nc-btn--outline" id="btn-stats" onclick="showStats()" style="display:none">📊 통계</button>
        <button class="nc-btn nc-btn--sm nc-btn--primary" id="btn-new-ep" onclick="showView('ep-create')" style="display:none">+ 새 회차</button>
      </div>

      <!-- 뷰: 기본 안내 -->
      <div class="editor-view active" id="view-home">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:16px">
          <div style="font-size:4rem">✍️</div>
          <div style="font-size:1.1rem;font-weight:700">소설을 선택하거나 새로 등록하세요</div>
          <button class="nc-btn nc-btn--primary" onclick="showView('novel-create')">+ 첫 소설 등록하기</button>
        </div>
      </div>

      <!-- 뷰: 소설 등록 -->
      <div class="editor-view" id="view-novel-create">
        <div class="novel-form">
          <h2 style="font-family:'Noto Serif KR',serif;margin-bottom:24px">새 소설 등록</h2>
          <div class="nc-form-group">
            <label class="nc-label">소설 제목 <span style="color:var(--error)">*</span> <span style="color:var(--text3);font-size:0.75rem">(최대 20자)</span></label>
            <input type="text" id="novel-title" class="nc-input" maxlength="20" placeholder="소설 제목 입력">
          </div>
          <div class="nc-form-group">
            <label class="nc-label">줄거리 / 소개</label>
            <textarea id="novel-desc" class="nc-textarea" rows="4" placeholder="간단한 줄거리를 입력하세요"></textarea>
          </div>
          <div class="nc-form-group">
            <label class="nc-label">장르</label>
            <select id="novel-genre" class="nc-select">
              <option value="">선택...</option>
              <option>판타지</option><option>로맨스</option><option>현대</option>
              <option>무협</option><option>공포</option><option>역사</option>
              <option>SF</option><option>일상</option><option>추리</option>
            </select>
          </div>
          <div class="nc-form-group">
            <label class="nc-label">태그 (쉼표로 구분)</label>
            <input type="text" id="novel-tags" class="nc-input" placeholder="예: 먼치킨, 회귀, 이세계">
          </div>
          <div style="display:flex;gap:10px">
            <button class="nc-btn nc-btn--outline" onclick="showView('home')">취소</button>
            <button class="nc-btn nc-btn--primary" onclick="createNovel()">소설 등록</button>
          </div>
        </div>
      </div>

      <!-- 뷰: 회차 목록 -->
      <div class="editor-view" id="view-ep-list">
        <div id="ep-list-content">
          <div class="nc-loading"><div class="nc-spinner"></div></div>
        </div>
      </div>

      <!-- 뷰: 회차 에디터 -->
      <div class="editor-view" id="view-ep-create">
        <div class="ep-editor">
          <div class="ep-toolbar">
            <span class="ep-toolbar-badge draft" id="ep-status-badge">DRAFT</span>
            <span class="ep-toolbar-badge" id="ep-num-badge">회차 번호: ?</span>
            <span style="flex:1"></span>
            <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="saveDraft()">💾 임시저장</button>
            <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="publishEpisode()">🚀 발행</button>
          </div>
          <input type="text" id="ep-title-input" class="ep-title-input"
            placeholder="회차 제목 (최대 20자)" maxlength="20">
          <div style="margin-bottom:12px;display:flex;gap:12px;align-items:center">
            <div class="nc-form-group" style="margin:0;flex:1">
              <label class="nc-label">회차 번호</label>
              <input type="number" id="ep-number" class="nc-input" placeholder="예: 1" min="1">
            </div>
            <div class="nc-form-group" style="margin:0;flex:1">
              <label class="nc-label">포인트 가격</label>
              <input type="number" id="ep-price" class="nc-input" placeholder="0=무료" min="0" value="100">
            </div>
          </div>
          <textarea id="ep-content-area" class="ep-content-area"
            placeholder="본문을 입력하세요... (최대 5,000자)" maxlength="5000"
            oninput="updateCharCount()"></textarea>
          <div class="ep-char-count"><span id="ep-char-cnt">0</span>/5,000자</div>

          <!-- AI 리뷰 영역 -->
          <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
              <span style="font-weight:700">🤖 AI 리뷰</span>
              <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="requestAiReview()">AI 리뷰 요청</button>
            </div>
            <div id="ai-review-area" style="color:var(--text3);font-size:0.875rem">
              발행된 회차에서 AI 리뷰를 요청할 수 있습니다.
            </div>
          </div>

          <!-- AI 표지 생성 -->
          <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:700">🎨 AI 표지 생성</span>
              <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="generateCover()">표지 생성</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 뷰: 통계 -->
      <div class="editor-view" id="view-stats">
        <h2 style="font-family:'Noto Serif KR',serif;margin-bottom:24px">📊 소설 통계</h2>
        <div class="stats-grid" id="stats-grid">
          <div class="nc-loading" style="grid-column:1/-1"><div class="nc-spinner"></div></div>
        </div>
        <div id="stats-ep-table"></div>
      </div>
    </div>
  </div>

  <!-- 설정집 사이드바 -->
  <div class="nc-sidebar" id="sidebar-wiki">
    <div class="nc-sidebar__header">
      <span class="nc-sidebar__title">📚 설정집</span>
      <button class="nc-sidebar__close" onclick="document.getElementById('sidebar-wiki').classList.remove('active')">✕</button>
    </div>
    <div class="nc-sidebar__body">
      <div class="wiki-form">
        <div>
          <label class="nc-label">유형</label>
          <div class="wiki-type-tabs" id="wiki-type-tabs">
            <button class="wiki-type-btn active" data-type="CHARACTER">캐릭터</button>
            <button class="wiki-type-btn" data-type="WORLDBUILDING">세계관</button>
            <button class="wiki-type-btn" data-type="PLOT">플롯메모</button>
            <button class="wiki-type-btn" data-type="GLOSSARY">용어집</button>
          </div>
        </div>
        <div class="nc-form-group" style="margin:0">
          <label class="nc-label">제목</label>
          <input type="text" id="wiki-title" class="nc-input" placeholder="설정집 제목">
        </div>
        <div class="nc-form-group" style="margin:0">
          <label class="nc-label">내용</label>
          <textarea id="wiki-content" class="nc-textarea" rows="6" placeholder="설정집 내용을 입력하세요"></textarea>
        </div>
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="saveWiki()">저장</button>
      </div>

      <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px">
        <div style="font-weight:700;margin-bottom:12px">저장된 설정집</div>
        <div id="wiki-list">
          <div class="nc-loading"><div class="nc-spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 뒤 오버레이 -->
  <div id="sidebar-overlay" onclick="closeSidebars()"
    style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:499;display:none"></div>

  <script>
    // 작가 권한 체크
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      const user = Auth.getUser();
      if (!user?.role || !['AUTHOR', 'MENTOR'].includes(user.role)) {
        Toast.error('작가 권한이 필요합니다'); setTimeout(() => history.back(), 1000); return;
      }
      loadMyNovels();
    });

    let currentNovelId = null;
    let currentEpisodeId = null;
    let selectedWikiType = 'CHARACTER';

    // 설정집 유형 탭
    document.querySelectorAll('.wiki-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.wiki-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedWikiType = btn.dataset.type;
      });
    });

    function showView(id) {
      document.querySelectorAll('.editor-view').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${id}`)?.classList.add('active');
    }

    async function loadMyNovels() {
      const el = document.getElementById('novel-list-side');
      try {
        const res = await api.get('/author/novels?page=0&size=20', true);
        const novels = res.content || [];
        el.innerHTML = novels.map(n => `
          <div class="novel-side-item" onclick="selectNovel(${n.novelId},'${n.title}')" id="novel-item-${n.novelId}">
            <div class="novel-side-item__title">${n.title}</div>
            <div class="novel-side-item__meta">${n.episodeCount || 0}화 · ${statusBadge(n.status)}</div>
          </div>
        `).join('') || '<div style="padding:20px;color:var(--text3);font-size:0.875rem">등록된 소설이 없습니다</div>';
      } catch {
        el.innerHTML = '<div style="padding:20px;color:var(--error);font-size:0.875rem">불러오기 실패</div>';
      }
    }

    async function selectNovel(novelId, title) {
      currentNovelId = novelId;
      document.querySelectorAll('.novel-side-item').forEach(i => i.classList.remove('active'));
      document.getElementById(`novel-item-${novelId}`)?.classList.add('active');
      document.getElementById('toolbar-title').textContent = title;
      document.getElementById('btn-wiki').style.display = 'inline-flex';
      document.getElementById('btn-stats').style.display = 'inline-flex';
      document.getElementById('btn-new-ep').style.display = 'inline-flex';
      showView('ep-list');
      loadEpisodeList(novelId);
    }

    async function loadEpisodeList(novelId) {
      const el = document.getElementById('ep-list-content');
      el.innerHTML = '<div class="nc-loading"><div class="nc-spinner"></div></div>';
      try {
        const res = await api.get(`/author/novels/${novelId}/episodes?page=0&size=50`, true);
        const episodes = res.content || [];
        el.innerHTML = `
          <div style="display:flex;justify-content:space-between;margin-bottom:16px">
            <div style="font-weight:700">회차 목록 <span style="color:var(--text3);font-size:0.875rem">(${episodes.length}화)</span></div>
          </div>
          <table class="ep-list-table">
            <thead>
              <tr><th>회차</th><th>제목</th><th>상태</th><th>가격</th><th>등록일</th><th>관리</th></tr>
            </thead>
            <tbody>
              ${episodes.map(ep => `
                <tr>
                  <td style="font-weight:700">${ep.episodeNumber}화</td>
                  <td>${ep.title}</td>
                  <td>
                    <span class="${ep.status === 'PUBLISHED' ? 'ep-toolbar-badge published' : 'ep-toolbar-badge draft'}" style="padding:3px 8px;border-radius:6px">
                      ${ep.status === 'PUBLISHED' ? '발행됨' : '초안'}
                    </span>
                  </td>
                  <td>${ep.price ? ep.price + 'P' : '무료'}</td>
                  <td style="color:var(--text3)">${formatDate(ep.createdAt)}</td>
                  <td>
                    <div style="display:flex;gap:6px">
                      <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="editEpisode(${ep.episodeId})">수정</button>
                      ${ep.status !== 'PUBLISHED' ? `<button class="nc-btn nc-btn--sm nc-btn--primary" onclick="publishEpisodeById(${ep.episodeId})">발행</button>` : ''}
                      <button class="nc-btn nc-btn--sm nc-btn--danger" onclick="deleteEpisodeById(${ep.episodeId})">삭제</button>
                    </div>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:24px">등록된 회차가 없습니다</td></tr>'}
            </tbody>
          </table>
        `;
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">불러오기 실패</div></div>';
      }
    }

    async function createNovel() {
      const title = document.getElementById('novel-title').value.trim();
      const description = document.getElementById('novel-desc').value.trim();
      const genre = document.getElementById('novel-genre').value;
      const tagsRaw = document.getElementById('novel-tags').value;
      const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);

      if (!title) { Toast.error('소설 제목을 입력하세요'); return; }
      if (title.length > 20) { Toast.error('제목은 최대 20자입니다'); return; }

      try {
        const res = await api.post('/novels', { title, description, genre, tags }, true);
        Toast.success('소설이 등록되었습니다!');
        loadMyNovels();
        selectNovel(res.novelId, res.title);
      } catch (e) { Toast.error(e.message || '등록 실패'); }
    }

    function showNewEpView() {
      currentEpisodeId = null;
      document.getElementById('ep-title-input').value = '';
      document.getElementById('ep-content-area').value = '';
      document.getElementById('ep-number').value = '';
      document.getElementById('ep-price').value = '100';
      document.getElementById('ep-status-badge').textContent = 'DRAFT';
      document.getElementById('ep-status-badge').className = 'ep-toolbar-badge draft';
      document.getElementById('ep-char-cnt').textContent = '0';
      showView('ep-create');
    }

    function editEpisode(episodeId) {
      currentEpisodeId = episodeId;
      // 에디터 뷰로 이동 (데이터 로드는 실제 구현)
      showView('ep-create');
      Toast.info('회차를 불러오는 중...');
    }

    async function saveDraft() {
      const title = document.getElementById('ep-title-input').value.trim();
      const content = document.getElementById('ep-content-area').value.trim();
      if (!title && !content) { Toast.error('제목 또는 본문을 입력하세요'); return; }
      if (!currentNovelId) { Toast.error('소설을 먼저 선택하세요'); return; }

      const epNum = parseInt(document.getElementById('ep-number').value);
      const price = parseInt(document.getElementById('ep-price').value) || 0;

      try {
        if (currentEpisodeId) {
          await api.patch(`/episodes/${currentEpisodeId}`, { title, content, price }, true);
        } else {
          const res = await api.post(`/novels/${currentNovelId}/episodes`, {
            title, content, episodeNumber: epNum, price
          }, true);
          currentEpisodeId = res.episodeId;
        }
        Toast.success('임시저장 완료!');
      } catch (e) { Toast.error(e.message || '저장 실패'); }
    }

    async function publishEpisode() {
      if (!currentEpisodeId) {
        await saveDraft();
        if (!currentEpisodeId) return;
      }
      const content = document.getElementById('ep-content-area').value.trim();
      if (!content) { Toast.error('본문 내용이 없으면 발행할 수 없습니다'); return; }
      if (!confirm('발행하시겠습니까? 발행 후에는 다시 발행할 수 없습니다.')) return;
      try {
        await api.post(`/episodes/${currentEpisodeId}/publish`, {}, true);
        document.getElementById('ep-status-badge').textContent = 'PUBLISHED';
        document.getElementById('ep-status-badge').className = 'ep-toolbar-badge published';
        Toast.success('🚀 발행 완료!');
        loadEpisodeList(currentNovelId);
      } catch (e) { Toast.error(e.message || '발행 실패'); }
    }

    async function publishEpisodeById(id) {
      if (!confirm('발행하시겠습니까?')) return;
      try {
        await api.post(`/episodes/${id}/publish`, {}, true);
        Toast.success('발행 완료!');
        loadEpisodeList(currentNovelId);
      } catch (e) { Toast.error(e.message || '발행 실패'); }
    }

    async function deleteEpisodeById(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      try {
        await api.delete(`/episodes/${id}`, true);
        Toast.success('삭제되었습니다');
        loadEpisodeList(currentNovelId);
      } catch (e) { Toast.error(e.message || '삭제 실패'); }
    }

    function updateCharCount() {
      const len = document.getElementById('ep-content-area').value.length;
      document.getElementById('ep-char-cnt').textContent = len;
      if (len > 5000) Toast.error('본문은 최대 5,000자입니다');
    }

    async function showStats() {
      showView('stats');
      if (!currentNovelId) return;
      try {
        const stats = await api.get(`/novels/${currentNovelId}/episodes/stats`, true);
        const total = stats.reduce((a, s) => ({ views: a.views + (s.viewCount||0), likes: a.likes + (s.likeCount||0), purchases: a.purchases + (s.purchaseCount||0) }), {views:0,likes:0,purchases:0});
        document.getElementById('stats-grid').innerHTML = `
          <div class="stat-box"><div class="stat-box__val">${formatNum(total.views)}</div><div class="stat-box__lbl">총 조회수</div></div>
          <div class="stat-box"><div class="stat-box__val">${formatNum(total.likes)}</div><div class="stat-box__lbl">총 좋아요</div></div>
          <div class="stat-box"><div class="stat-box__val">${formatNum(total.purchases)}</div><div class="stat-box__lbl">총 구매수</div></div>
        `;
        document.getElementById('stats-ep-table').innerHTML = `
          <table class="ep-list-table">
            <thead><tr><th>회차</th><th>제목</th><th>조회수</th><th>좋아요</th><th>구매</th></tr></thead>
            <tbody>${stats.map(s => `
              <tr>
                <td>${s.episodeNumber}화</td>
                <td>${s.title}</td>
                <td>${formatNum(s.viewCount)}</td>
                <td>${formatNum(s.likeCount)}</td>
                <td>${formatNum(s.purchaseCount)}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        `;
      } catch {
        document.getElementById('stats-grid').innerHTML = '<div class="nc-empty" style="grid-column:1/-1"><div class="nc-empty__text">통계를 불러올 수 없습니다</div></div>';
      }
    }

    async function requestAiReview() {
      if (!currentEpisodeId) { Toast.error('회차를 먼저 저장하세요'); return; }
      const el = document.getElementById('ai-review-area');
      el.innerHTML = '<div class="nc-loading"><div class="nc-spinner"></div></div>';
      try {
        // V2: 비동기 Kafka 처리
        const job = await api.post(`/ai/author/v2/episodes/${currentEpisodeId}/ai-review`, {}, true);
        el.innerHTML = `<div style="color:var(--text3);font-size:0.875rem">AI 리뷰 요청이 접수되었습니다. (Job ID: ${job.jobId})<br>처리 완료 후 결과를 확인하세요.</div>
          <button class="nc-btn nc-btn--sm nc-btn--outline" style="margin-top:8px" onclick="checkAiReview('${job.jobId}')">결과 확인</button>`;
      } catch (e) {
        el.innerHTML = `<div style="color:var(--error);font-size:0.875rem">${e.message || 'AI 리뷰 요청 실패'}</div>`;
      }
    }

    async function checkAiReview(jobId) {
      const el = document.getElementById('ai-review-area');
      try {
        const job = await api.get(`/ai/author/v2/jobs/${jobId}`, true);
        if (job.status === 'COMPLETED') {
          const r = job.result;
          el.innerHTML = `
            <div class="ai-review-box">
              <div class="ai-review-score">⭐ ${r.rating}/5</div>
              <div class="ai-review-text">${r.review}</div>
            </div>
          `;
        } else if (job.status === 'FAILED') {
          el.innerHTML = '<div style="color:var(--error)">AI 리뷰 처리 실패</div>';
        } else {
          el.innerHTML = `<div style="color:var(--text3)">처리 중... (${job.status})</div>
            <button class="nc-btn nc-btn--sm nc-btn--outline" style="margin-top:8px" onclick="checkAiReview('${jobId}')">다시 확인</button>`;
        }
      } catch (e) { el.innerHTML = `<div style="color:var(--error)">${e.message}</div>`; }
    }

    async function generateCover() {
      if (!currentNovelId) { Toast.error('소설을 선택하세요'); return; }
      try {
        const res = await api.post(`/ai/novels/${currentNovelId}/cover`, {}, true);
        Toast.success(`표지 생성 요청 완료! (Job: ${res.jobId})`);
      } catch (e) { Toast.error(e.message || '표지 생성 실패'); }
    }

    function openWikiSidebar() {
      document.getElementById('sidebar-wiki').classList.add('active');
      document.getElementById('sidebar-overlay').style.display = 'block';
      if (currentNovelId) loadWikiList();
    }

    function closeSidebars() {
      document.getElementById('sidebar-wiki').classList.remove('active');
      document.getElementById('sidebar-overlay').style.display = 'none';
    }

    async function loadWikiList() {
      const el = document.getElementById('wiki-list');
      try {
        const list = await api.get(`/novels/${currentNovelId}/wiki`, true);
        const WIKI_LABELS = { CHARACTER: '캐릭터', WORLDBUILDING: '세계관', PLOT: '플롯메모', GLOSSARY: '용어집' };
        el.innerHTML = list.map(w => `
          <div style="padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <span class="nc-badge" style="background:var(--primary)20;color:var(--primary-light);border:1px solid var(--primary)40;margin-bottom:4px">${WIKI_LABELS[w.wikiType]||w.wikiType}</span>
                <div style="font-weight:600;font-size:0.875rem;margin-top:4px">${w.title}</div>
                <div style="font-size:0.8rem;color:var(--text3);margin-top:4px;line-height:1.5">${w.content?.substring(0,80)}${w.content?.length > 80 ? '...' : ''}</div>
              </div>
              <button class="nc-btn nc-btn--sm nc-btn--danger" style="flex-shrink:0;margin-left:8px" onclick="deleteWiki(${w.wikiId})">삭제</button>
            </div>
          </div>
        `).join('') || '<div style="color:var(--text3);font-size:0.875rem">저장된 설정집이 없습니다</div>';
      } catch {
        el.innerHTML = '<div style="color:var(--error);font-size:0.8rem">불러오기 실패</div>';
      }
    }

    async function saveWiki() {
      if (!currentNovelId) { Toast.error('소설을 먼저 선택하세요'); return; }
      const title = document.getElementById('wiki-title').value.trim();
      const content = document.getElementById('wiki-content').value.trim();
      if (!title || !content) { Toast.error('제목과 내용을 입력하세요'); return; }
      try {
        await api.post(`/novels/${currentNovelId}/wiki`, { title, content, wikiType: selectedWikiType }, true);
        Toast.success('설정집이 저장되었습니다!');
        document.getElementById('wiki-title').value = '';
        document.getElementById('wiki-content').value = '';
        loadWikiList();
      } catch (e) { Toast.error(e.message || '저장 실패'); }
    }

    async function deleteWiki(wikiId) {
      if (!confirm('삭제하시겠습니까?')) return;
      try {
        await api.delete(`/novels/${currentNovelId}/wiki/${wikiId}`, true);
        Toast.success('삭제되었습니다');
        loadWikiList();
      } catch (e) { Toast.error(e.message || '삭제 실패'); }
    }

    // 새 회차 버튼 클릭 시
    document.getElementById('btn-new-ep').addEventListener('click', showNewEpView);
  </script>
</body>
</html>
