<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="47%" r="45%">
      <stop offset="0%" stop-color="#7c5af0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c5af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c842" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f0c842" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="url(#bgGrad)"/>

  <!-- Purple ambient glow -->
  <rect width="300" height="400" fill="url(#purpleGlow)"/>

  <!-- Gold glow center -->
  <ellipse cx="150" cy="185" rx="90" ry="90" fill="url(#goldGlow)"/>

  <!-- Outer border frame -->
  <rect x="10" y="10" width="280" height="380" rx="3" ry="3"
        fill="none" stroke="#7c5af0" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Inner border frame -->
  <rect x="18" y="18" width="264" height="364" rx="2" ry="2"
        fill="none" stroke="#7c5af0" stroke-width="0.4" stroke-opacity="0.25"/>

  <!-- Corner ornaments - top left -->
  <path d="M 26 26 L 50 26" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <path d="M 26 26 L 26 50" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <circle cx="26" cy="26" r="2" fill="#9b7ef8" fill-opacity="0.7"/>

  <!-- Corner ornaments - top right -->
  <path d="M 274 26 L 250 26" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <path d="M 274 26 L 274 50" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <circle cx="274" cy="26" r="2" fill="#9b7ef8" fill-opacity="0.7"/>

  <!-- Corner ornaments - bottom left -->
  <path d="M 26 374 L 50 374" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <path d="M 26 374 L 26 350" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <circle cx="26" cy="374" r="2" fill="#9b7ef8" fill-opacity="0.7"/>

  <!-- Corner ornaments - bottom right -->
  <path d="M 274 374 L 250 374" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <path d="M 274 374 L 274 350" stroke="#9b7ef8" stroke-width="1.2" stroke-opacity="0.6" fill="none"/>
  <circle cx="274" cy="374" r="2" fill="#9b7ef8" fill-opacity="0.7"/>

  <!-- Top decorative divider -->
  <line x1="36" y1="62" x2="128" y2="62" stroke="#f0c842" stroke-width="0.6" stroke-opacity="0.45"/>
  <polygon points="150,55 155,62 150,69 145,62" fill="#f0c842" fill-opacity="0.75"/>
  <line x1="172" y1="62" x2="264" y2="62" stroke="#f0c842" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Bottom decorative divider -->
  <line x1="36" y1="338" x2="128" y2="338" stroke="#f0c842" stroke-width="0.6" stroke-opacity="0.45"/>
  <polygon points="150,331 155,338 150,345 145,338" fill="#f0c842" fill-opacity="0.75"/>
  <line x1="172" y1="338" x2="264" y2="338" stroke="#f0c842" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Subtle dot grid pattern (background texture) -->
  <g fill="#7c5af0" fill-opacity="0.08">
    <circle cx="60"  cy="100" r="1"/><circle cx="90"  cy="100" r="1"/><circle cx="120" cy="100" r="1"/>
    <circle cx="180" cy="100" r="1"/><circle cx="210" cy="100" r="1"/><circle cx="240" cy="100" r="1"/>
    <circle cx="60"  cy="130" r="1"/><circle cx="240" cy="130" r="1"/>
    <circle cx="60"  cy="250" r="1"/><circle cx="240" cy="250" r="1"/>
    <circle cx="60"  cy="290" r="1"/><circle cx="90"  cy="290" r="1"/><circle cx="120" cy="290" r="1"/>
    <circle cx="180" cy="290" r="1"/><circle cx="210" cy="290" r="1"/><circle cx="240" cy="290" r="1"/>
  </g>

  <!-- Small accent dots around center -->
  <circle cx="95"  cy="160" r="1.8" fill="#7c5af0" fill-opacity="0.5"/>
  <circle cx="205" cy="160" r="1.8" fill="#7c5af0" fill-opacity="0.5"/>
  <circle cx="95"  cy="210" r="1.8" fill="#7c5af0" fill-opacity="0.5"/>
  <circle cx="205" cy="210" r="1.8" fill="#7c5af0" fill-opacity="0.5"/>
  <circle cx="150" cy="118" r="1.8" fill="#f0c842" fill-opacity="0.4"/>
  <circle cx="150" cy="252" r="1.8" fill="#f0c842" fill-opacity="0.4"/>

  <!-- Main star symbol ✦ (four-pointed star via path) -->
  <g transform="translate(150, 185)" filter="url(#softGlow)">
    <!-- Four-pointed star path -->
    <path d="M 0,-52
             C 0,-20 -20,0 -52,0
             C -20,0 0,20 0,52
             C 0,20 20,0 52,0
             C 20,0 0,-20 0,-52 Z"
          fill="#f0c842" fill-opacity="0.92"/>
    <!-- Inner small star for depth -->
    <path d="M 0,-24
             C 0,-9 -9,0 -24,0
             C -9,0 0,9 0,24
             C 0,9 9,0 24,0
             C 9,0 0,-9 0,-24 Z"
          fill="#ffd966" fill-opacity="0.6"/>
    <!-- Center dot -->
    <circle r="4" fill="#ffe599" fill-opacity="0.9"/>
    <!-- Diagonal accent lines through star -->
    <line x1="-36" y1="-36" x2="-16" y2="-16" stroke="#f0c842" stroke-width="0.8" stroke-opacity="0.35"/>
    <line x1="16"  y1="16"  x2="36"  y2="36"  stroke="#f0c842" stroke-width="0.8" stroke-opacity="0.35"/>
    <line x1="36"  y1="-36" x2="16"  y2="-16" stroke="#f0c842" stroke-width="0.8" stroke-opacity="0.35"/>
    <line x1="-16" y1="16"  x2="-36" y2="36"  stroke="#f0c842" stroke-width="0.8" stroke-opacity="0.35"/>
  </g>

  <!-- Horizontal separator above text -->
  <line x1="75" y1="265" x2="225" y2="265" stroke="#7c5af0" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- NovelCraft logotype -->
  <text x="150" y="295"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="21"
        font-weight="700"
        fill="#e8e8f0"
        fill-opacity="0.95"
        text-anchor="middle"
        letter-spacing="4"
        filter="url(#subtleGlow)">NovelCraft</text>

  <!-- Tagline -->
  <text x="150" y="318"
        font-family="Georgia, serif"
        font-size="9.5"
        fill="#6a6a80"
        fill-opacity="1"
        text-anchor="middle"
        letter-spacing="2.5">웹소설 플랫폼</text>
</svg>
