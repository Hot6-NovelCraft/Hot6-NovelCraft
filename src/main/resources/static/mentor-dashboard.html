<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 멘토 대시보드</title>
  <script src="/common.js"></script>
  <style>
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* 상단 통계 카드 */
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
    }
    .stat-card__icon { font-size: 1.6rem; margin-bottom: 10px; }
    .stat-card__val {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.8rem; font-weight: 900; margin-bottom: 4px;
    }
    .stat-card__lbl { font-size: 0.75rem; color: var(--text3); }
    .stat-card--accent .stat-card__val { color: var(--accent); }
    .stat-card--primary .stat-card__val { color: var(--primary-light); }
    .stat-card--success .stat-card__val { color: var(--success); }
    .stat-card--warning .stat-card__val { color: var(--warning); }

    /* 대시보드 그리드 */
    .dashboard-grid {
      display: grid; grid-template-columns: 1fr 360px; gap: 24px;
    }
    .section-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px;
    }
    .section-card__title {
      font-weight: 800; font-size: 1rem; margin-bottom: 18px;
      display: flex; align-items: center; justify-content: space-between;
    }

    /* 멘티 카드 */
    .mentee-card {
      display: flex; align-items: center; gap: 14px;
      padding: 14px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 10px; transition: border-color 0.2s;
    }
    .mentee-card:hover { border-color: rgba(124,90,240,0.3); }
    .mentee-avatar {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700;
    }
    .mentee-info { flex: 1; min-width: 0; }
    .mentee-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; }
    .mentee-novel { font-size: 0.78rem; color: var(--text3); margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mentee-status {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
    }
    .mentee-status.pending { background: rgba(245,158,11,0.1); color: var(--warning); border: 1px solid rgba(245,158,11,0.25); }
    .mentee-status.active { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid rgba(16,185,129,0.25); }
    .mentee-status.completed { background: rgba(124,90,240,0.1); color: var(--primary-light); border: 1px solid rgba(124,90,240,0.25); }
    .mentee-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

    /* 신청 접수 목록 */
    .received-item {
      padding: 16px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 10px;
    }
    .received-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .received-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--primary));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 700; flex-shrink: 0;
    }
    .received-name { font-weight: 700; font-size: 0.9rem; }
    .received-novel { font-size: 0.78rem; color: var(--text3); }
    .received-msg {
      font-size: 0.82rem; color: var(--text2); line-height: 1.6;
      background: var(--surface); border-radius: 8px; padding: 10px 12px;
      margin-bottom: 10px; border: 1px solid var(--border);
    }
    .received-actions { display: flex; gap: 8px; }

    /* 피드백 폼 */
    .feedback-form {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 10px;
    }
    .feedback-form__header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .feedback-form__mentee { font-weight: 700; font-size: 0.9rem; }

    /* 내 멘토 프로필 미리보기 */
    .mentor-profile-preview {
      background: linear-gradient(135deg, rgba(240,104,66,0.08), rgba(124,90,240,0.08));
      border: 1px solid rgba(240,104,66,0.2); border-radius: 14px; padding: 20px;
    }
    .mentor-profile-preview__rating {
      font-size: 2rem; font-weight: 900; color: var(--accent);
      text-align: center; margin-bottom: 4px;
    }
    .mentor-profile-preview__sub { text-align: center; font-size: 0.75rem; color: var(--text3); margin-bottom: 16px; }

    /* 상태 토글 */
    .status-toggle {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .status-opt {
      flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); cursor: pointer; font-size: 0.8rem;
      transition: all 0.2s; font-family: inherit; text-align: center;
    }
    .status-opt.active { background: var(--success); border-color: var(--success); color: white; }
    .status-opt.inactive { background: transparent; }
    .status-opt.inactive.active { background: var(--error); border-color: var(--error); color: white; }

    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <nav id="nc-nav"></nav>
  <div class="page-wrap">

    <!-- 페이지 헤더 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px">
      <div>
        <h1 style="font-family:'Noto Serif KR',serif;font-size:1.6rem;font-weight:900;margin-bottom:4px">🎓 멘토 대시보드</h1>
        <p style="color:var(--text3);font-size:0.875rem">멘티를 관리하고 멘토링을 진행하세요</p>
      </div>
      <div style="display:flex;gap:10px">
        <button class="nc-btn nc-btn--outline" onclick="window.location.href='/mentor-list.html'">멘토 목록 보기</button>
        <button class="nc-btn nc-btn--primary" onclick="Modal.open('modal-edit-profile')">프로필 수정</button>
      </div>
    </div>

    <!-- 통계 카드 -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card stat-card--primary">
        <div class="stat-card__icon">👥</div>
        <div class="stat-card__val" id="stat-mentees">···</div>
        <div class="stat-card__lbl">현재 멘티 수</div>
      </div>
      <div class="stat-card stat-card--success">
        <div class="stat-card__icon">✅</div>
        <div class="stat-card__val" id="stat-completed">···</div>
        <div class="stat-card__lbl">완료 멘토링</div>
      </div>
      <div class="stat-card stat-card--accent">
        <div class="stat-card__icon">⭐</div>
        <div class="stat-card__val" id="stat-rating">···</div>
        <div class="stat-card__lbl">평균 평점</div>
      </div>
      <div class="stat-card stat-card--warning">
        <div class="stat-card__icon">⏳</div>
        <div class="stat-card__val" id="stat-pending">···</div>
        <div class="stat-card__lbl">대기 중 신청</div>
      </div>
    </div>

    <!-- 대시보드 본문 -->
    <div class="dashboard-grid">
      <!-- 좌측: 멘티 목록 + 신청 접수 -->
      <div>
        <!-- 탭 -->
        <div class="nc-tabs" style="margin-bottom:20px">
          <button class="nc-tab active" onclick="switchDashTab('mentees')">👥 내 멘티 목록</button>
          <button class="nc-tab" onclick="switchDashTab('received')">📨 신청 접수</button>
          <button class="nc-tab" onclick="switchDashTab('feedback')">📝 피드백 작성</button>
        </div>

        <!-- 멘티 목록 -->
        <div id="dash-mentees">
          <div id="mentee-list">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>

        <!-- 신청 접수 -->
        <div id="dash-received" style="display:none">
          <div id="received-list">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>

        <!-- 피드백 -->
        <div id="dash-feedback" style="display:none">
          <div style="margin-bottom:16px;color:var(--text3);font-size:0.875rem">
            진행 중인 멘티에게 회차별 피드백을 작성하세요
          </div>
          <div id="feedback-list">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>
      </div>

      <!-- 우측: 내 멘토 프로필 -->
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="section-card mentor-profile-preview" id="mentor-profile-card">
          <div class="nc-loading"><div class="nc-spinner"></div></div>
        </div>

        <!-- 멘토링 완료 처리 -->
        <div class="section-card">
          <div class="section-card__title">🏁 멘토링 완료 처리</div>
          <p style="font-size:0.8rem;color:var(--text3);margin-bottom:14px">
            멘토링이 끝났다면 완료 처리하세요. 멘티의 평가가 활성화됩니다.
          </p>
          <div id="active-mentoring-list">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>

        <!-- 빠른 통계 상세 -->
        <div class="section-card">
          <div class="section-card__title">📊 상세 통계</div>
          <div id="detail-stats">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 프로필 수정 모달 -->
  <div class="nc-modal" id="modal-edit-profile">
    <div class="nc-modal__backdrop" onclick="Modal.close('modal-edit-profile')"></div>
    <div class="nc-modal__box">
      <button class="nc-modal__close" onclick="Modal.close('modal-edit-profile')">✕</button>
      <div class="nc-modal__title">✏️ 멘토 프로필 수정</div>
      <div class="nc-form-group">
        <label class="nc-label">자기소개</label>
        <textarea id="edit-intro" class="nc-textarea" rows="4"></textarea>
      </div>
      <div class="nc-form-group">
        <label class="nc-label">최대 멘티 수</label>
        <input type="number" id="edit-max-mentees" class="nc-input" min="1" max="10" style="max-width:100px">
      </div>
      <div class="nc-form-group">
        <label class="nc-label">세션 가격 (포인트)</label>
        <input type="number" id="edit-price" class="nc-input" min="0" style="max-width:140px">
      </div>
      <div style="margin-bottom:16px">
        <label class="nc-label">활동 상태</label>
        <div class="status-toggle">
          <button class="status-opt active" id="status-active" onclick="selectStatus('ACTIVE',this)">활동 중</button>
          <button class="status-opt inactive" id="status-inactive" onclick="selectStatus('INACTIVE',this)">휴식 중</button>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="nc-btn nc-btn--outline nc-btn--full" onclick="Modal.close('modal-edit-profile')">취소</button>
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="updateMentorProfile()">저장</button>
      </div>
    </div>
  </div>

  <!-- 피드백 작성 모달 -->
  <div class="nc-modal" id="modal-feedback">
    <div class="nc-modal__backdrop" onclick="Modal.close('modal-feedback')"></div>
    <div class="nc-modal__box">
      <button class="nc-modal__close" onclick="Modal.close('modal-feedback')">✕</button>
      <div class="nc-modal__title" id="feedback-modal-title">📝 피드백 작성</div>
      <div class="nc-form-group">
        <label class="nc-label">세션 번호</label>
        <input type="number" id="fb-session" class="nc-input" min="1" value="1" style="max-width:100px">
      </div>
      <div class="nc-form-group">
        <label class="nc-label">피드백 내용</label>
        <textarea id="fb-content" class="nc-textarea" rows="5" placeholder="원고에 대한 상세한 피드백을 작성해 주세요"></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="nc-btn nc-btn--outline nc-btn--full" onclick="Modal.close('modal-feedback')">취소</button>
        <button class="nc-btn nc-btn--primary nc-btn--full" onclick="submitFeedback()">피드백 제출</button>
      </div>
    </div>
  </div>

  <script>
    // 멘토 권한 체크
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      const user = Auth.getUser();
      if (!['AUTHOR', 'MENTOR'].includes(user?.role)) {
        Toast.error('멘토 권한이 필요합니다');
        setTimeout(() => history.back(), 1000);
        return;
      }
      loadDashboard();
    });

    let selectedStatus = 'ACTIVE';
    let currentFeedbackMentoringId = null;

    async function loadDashboard() {
      await Promise.all([
        loadStats(),
        loadMyProfile(),
        loadMenteeList(),
        loadDetailStats(),
      ]);
    }

    // ── 통계 로드 ──
    async function loadStats() {
      try {
        const stats = await api.get('/mentors/me/statistics', true);
        document.getElementById('stat-mentees').textContent = stats.currentMenteeCount ?? 0;
        document.getElementById('stat-completed').textContent = stats.completedCount ?? 0;
        document.getElementById('stat-rating').textContent = (stats.averageRating ?? 0).toFixed(1);
        document.getElementById('stat-pending').textContent = stats.pendingCount ?? 0;
      } catch {
        ['stat-mentees','stat-completed','stat-rating','stat-pending'].forEach(id => {
          document.getElementById(id).textContent = '-';
        });
      }
    }

    // ── 내 멘토 프로필 ──
    async function loadMyProfile() {
      const el = document.getElementById('mentor-profile-card');
      try {
        const profile = await api.get('/mentors/me', true);
        const CAREER_LABEL = { BEGINNER:'신진 작가', INTERMEDIATE:'중견 작가', EXPERT:'전문 작가', MASTER:'마스터' };

        // 수정 폼 초기값
        document.getElementById('edit-intro').value = profile.introduction || '';
        document.getElementById('edit-max-mentees').value = profile.maxMenteeCount || 3;
        document.getElementById('edit-price').value = profile.pricePerSession || 5000;

        el.innerHTML = `
          <div class="mentor-profile-preview__rating">⭐ ${(profile.averageRating||0).toFixed(1)}</div>
          <div class="mentor-profile-preview__sub">${profile.totalReviewCount||0}개의 평가</div>
          <div style="text-align:center;margin-bottom:14px">
            <div style="font-weight:800;font-size:1rem">${profile.nickname}</div>
            <div style="font-size:0.75rem;color:var(--text3);margin-top:4px">${CAREER_LABEL[profile.careerLevel]||profile.careerLevel}</div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px">
            <span style="color:var(--text3)">수용 멘티</span>
            <strong>${profile.currentMenteeCount||0}/${profile.maxMenteeCount||0}명</strong>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px">
            <span style="color:var(--text3)">세션 가격</span>
            <strong style="color:var(--accent)">${(profile.pricePerSession||0).toLocaleString()}P</strong>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:14px">
            <span style="color:var(--text3)">활동 상태</span>
            <strong style="color:${profile.isActive?'var(--success)':'var(--error)'}">${profile.isActive?'활동 중':'휴식 중'}</strong>
          </div>
          <div style="font-size:0.8rem;color:var(--text2);line-height:1.6;background:rgba(255,255,255,0.04);border-radius:8px;padding:10px">
            ${profile.introduction||'소개가 없습니다'}
          </div>
        `;
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">프로필을 불러올 수 없습니다</div></div>';
      }
    }

    // ── 멘티 목록 ──
    async function loadMenteeList() {
      const el = document.getElementById('mentee-list');
      try {
        // V2: N+1 개선
        const mentees = await api.get('/mentors/v2/me/mentees', true);
        el.innerHTML = mentees.map(m => `
          <div class="mentee-card">
            <div class="mentee-avatar">${(m.nickname||'M').charAt(0)}</div>
            <div class="mentee-info">
              <div class="mentee-name">${m.nickname}</div>
              <div class="mentee-novel">📖 ${m.novelTitle||'소설 없음'}</div>
              <span class="mentee-status ${m.mentorshipStatus?.toLowerCase()||'active'}">
                ${{ PENDING:'신청 중', ACTIVE:'진행 중', COMPLETED:'완료', REJECTED:'거절' }[m.mentorshipStatus]||m.mentorshipStatus}
              </span>
            </div>
            <div class="mentee-actions">
              <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="window.location.href='/chat.html?mentorshipId=${m.mentorshipId}'">💬</button>
              ${m.mentorshipStatus === 'ACTIVE' ? `
                <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="openFeedbackModal(${m.mentorshipId},'${m.nickname}')">📝</button>
              ` : ''}
            </div>
          </div>
        `).join('') || '<div class="nc-empty"><div class="nc-empty__icon">👥</div><div class="nc-empty__text">현재 멘티가 없습니다</div></div>';

        // 활성 멘토링 완료 목록도 갱신
        renderActiveMentoringForComplete(mentees.filter(m => m.mentorshipStatus === 'ACTIVE'));
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">멘티 목록을 불러오지 못했습니다</div></div>';
      }
    }

    function renderActiveMentoringForComplete(actives) {
      const el = document.getElementById('active-mentoring-list');
      if (!actives.length) {
        el.innerHTML = '<div style="color:var(--text3);font-size:0.8rem">진행 중인 멘토링이 없습니다</div>';
        return;
      }
      el.innerHTML = actives.map(m => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px">
          <div>
            <div style="font-weight:700;font-size:0.875rem">${m.nickname}</div>
            <div style="font-size:0.75rem;color:var(--text3)">${m.novelTitle||''}</div>
          </div>
          <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="completeMentoring(${m.mentorshipId})">완료 처리</button>
        </div>
      `).join('');
    }

    // ── 신청 접수 목록 ──
    async function loadReceivedList() {
      const el = document.getElementById('received-list');
      try {
        // V2: soft-delete 적용
        const res = await api.get('/v2/mentorings/received?page=0&size=20', true);
        const list = res.content || [];
        el.innerHTML = list.map(r => `
          <div class="received-item">
            <div class="received-header">
              <div class="received-avatar">${(r.menteeName||'M').charAt(0)}</div>
              <div>
                <div class="received-name">${r.menteeName}</div>
                <div class="received-novel">📖 ${r.novelTitle||'소설 제목'} · ${formatDate(r.appliedAt)}</div>
              </div>
              <span class="mentee-status pending" style="margin-left:auto">신청 중</span>
            </div>
            <div class="received-msg">${r.message||'신청 메시지가 없습니다'}</div>
            <div class="received-actions">
              <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="acceptMentee(${r.mentoringId},${r.menteeId})">수락</button>
              <button class="nc-btn nc-btn--sm nc-btn--danger" onclick="rejectMentee(${r.mentoringId},${r.menteeId})">거절</button>
              <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="viewManuscript(${r.mentoringId})">원고 보기</button>
            </div>
          </div>
        `).join('') || '<div class="nc-empty"><div class="nc-empty__icon">📭</div><div class="nc-empty__text">접수된 신청이 없습니다</div></div>';
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">불러오기 실패</div></div>';
      }
    }

    // ── 상세 통계 ──
    async function loadDetailStats() {
      const el = document.getElementById('detail-stats');
      try {
        const detail = await api.get('/mentors/me/statistics/detail', true);
        el.innerHTML = `
          ${[
            ['총 멘티 수', detail.totalMenteeCount, '명'],
            ['총 세션 수', detail.totalSessionCount, '회'],
            ['평균 응답 시간', detail.avgResponseTime, '시간'],
            ['재신청률', detail.reapplyRate, '%'],
          ].map(([label, val, unit]) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:0.85rem;color:var(--text3)">${label}</span>
              <strong style="font-size:0.95rem">${val ?? '-'}${unit}</strong>
            </div>
          `).join('')}
        `;
      } catch {
        el.innerHTML = '<div style="color:var(--text3);font-size:0.8rem">통계를 불러올 수 없습니다</div>';
      }
    }

    // ── 탭 전환 ──
    function switchDashTab(tab) {
      document.querySelectorAll('[id^="dash-"]').forEach(el => el.style.display = 'none');
      document.getElementById(`dash-${tab}`)?.style.setProperty('display', 'block');
      document.querySelectorAll('.nc-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'received') loadReceivedList();
      if (tab === 'feedback') loadFeedbackMentees();
    }

    // ── 피드백 작성 멘티 목록 ──
    async function loadFeedbackMentees() {
      const el = document.getElementById('feedback-list');
      try {
        const mentees = await api.get('/mentors/v2/me/mentees', true);
        const active = mentees.filter(m => m.mentorshipStatus === 'ACTIVE');
        el.innerHTML = active.map(m => `
          <div class="feedback-form">
            <div class="feedback-form__header">
              <span class="feedback-form__mentee">${m.nickname} — ${m.novelTitle||'소설'}</span>
              <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="openFeedbackModal(${m.mentorshipId},'${m.nickname}')">피드백 작성</button>
            </div>
          </div>
        `).join('') || '<div class="nc-empty"><div class="nc-empty__text">진행 중인 멘티가 없습니다</div></div>';
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">불러오기 실패</div></div>';
      }
    }

    function openFeedbackModal(mentoringId, menteeName) {
      currentFeedbackMentoringId = mentoringId;
      document.getElementById('feedback-modal-title').textContent = `📝 ${menteeName}에게 피드백`;
      document.getElementById('fb-content').value = '';
      document.getElementById('fb-session').value = '1';
      Modal.open('modal-feedback');
    }

    async function submitFeedback() {
      if (!currentFeedbackMentoringId) return;
      const sessionNumber = parseInt(document.getElementById('fb-session').value);
      const content = document.getElementById('fb-content').value.trim();
      if (!content) { Toast.error('피드백 내용을 입력하세요'); return; }
      try {
        // V2: 비관적 락 + 동시성 보호
        await api.post(`/v2/mentorings/${currentFeedbackMentoringId}/feedbacks`, { sessionNumber, content }, true);
        Toast.success('피드백이 전달되었습니다!');
        Modal.close('modal-feedback');
      } catch (e) { Toast.error(e.message || '제출 실패'); }
    }

    // ── 멘티 수락/거절 ──
    async function acceptMentee(mentoringId, menteeId) {
      if (!confirm('이 멘티를 수락하시겠습니까?')) return;
      try {
        await api.patch(`/v2/mentorings/${mentoringId}/mentees/${menteeId}/accept`, {}, true);
        Toast.success('멘티를 수락했습니다!');
        loadReceivedList();
        loadMenteeList();
        loadStats();
      } catch (e) { Toast.error(e.message || '수락 실패'); }
    }

    async function rejectMentee(mentoringId, menteeId) {
      if (!confirm('이 멘티를 거절하시겠습니까?')) return;
      try {
        await api.patch(`/v2/mentorings/${mentoringId}/mentees/${menteeId}/reject`, {}, true);
        Toast.success('거절 처리되었습니다');
        loadReceivedList();
        loadStats();
      } catch (e) { Toast.error(e.message || '거절 실패'); }
    }

    async function completeMentoring(mentoringId) {
      if (!confirm('멘토링을 완료 처리하시겠습니까? 멘티가 평가를 작성할 수 있게 됩니다.')) return;
      try {
        await api.patch(`/v2/mentorings/${mentoringId}/complete`, {}, true);
        Toast.success('멘토링이 완료 처리되었습니다!');
        loadMenteeList();
        loadStats();
      } catch (e) { Toast.error(e.message || '완료 처리 실패'); }
    }

    async function viewManuscript(mentoringId) {
      try {
        const res = await api.get(`/v2/mentorings/${mentoringId}/documents`, true);
        window.open(res.url, '_blank');
      } catch (e) { Toast.error(e.message || '원고를 불러올 수 없습니다'); }
    }

    // ── 프로필 수정 ──
    function selectStatus(status, btn) {
      selectedStatus = status;
      document.getElementById('status-active').classList.remove('active');
      document.getElementById('status-inactive').classList.remove('active');
      btn.classList.add('active');
    }

    async function updateMentorProfile() {
      const introduction = document.getElementById('edit-intro').value.trim();
      const maxMenteeCount = parseInt(document.getElementById('edit-max-mentees').value);
      const pricePerSession = parseInt(document.getElementById('edit-price').value);
      if (!introduction) { Toast.error('자기소개를 입력하세요'); return; }
      try {
        await api.put('/mentors/me', { introduction, maxMenteeCount, pricePerSession, status: selectedStatus }, true);
        Toast.success('프로필이 수정되었습니다!');
        Modal.close('modal-edit-profile');
        loadMyProfile();
      } catch (e) { Toast.error(e.message || '수정 실패'); }
    }
  </script>
</body>
</html>
