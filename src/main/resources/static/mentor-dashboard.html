<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 멘토링 현황</title>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <script src="/common.js"></script>
  <style>
    /* ── 네비게이션 커스텀 ── */
    .nc-point-btn {
      padding: 5px 14px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(240,200,66,0.18), rgba(240,200,66,0.08));
      border: 1px solid rgba(240,200,66,0.4); color: var(--accent);
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .nc-point-btn:hover { background: rgba(240,200,66,0.25); border-color: var(--accent); }
    /* ── 포인트 충전 모달 ── */
    .point-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .point-opt {
      padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; cursor: pointer; transition: all 0.2s;
      text-align: center; font-family: inherit; color: var(--text2);
    }
    .point-opt:hover { border-color: var(--primary); }
    .point-opt.selected { border-color: var(--primary); background: rgba(124,90,240,0.1); color: var(--primary-light); }
    .point-opt__amount { font-size: 1rem; font-weight: 700; }
    .point-opt__price { font-size: 0.78rem; color: var(--text3); margin-top: 3px; }
    .point-opt.selected .point-opt__price { color: var(--primary-light); opacity: 0.8; }
    .nc-alarm-btn {
      position: relative; padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); font-size: 1rem; cursor: pointer; transition: all 0.2s;
    }
    .nc-alarm-btn:hover { background: var(--surface); }
    .nc-alarm-dot {
      position: absolute; top: 4px; right: 4px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--error);
      border: 2px solid var(--bg);
    }
    .nc-user-menu { position: relative; }
    .nc-user-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); min-width: 148px;
      box-shadow: var(--shadow-lg); z-index: 300; display: none; overflow: hidden;
    }
    .nc-user-menu.open .nc-user-dropdown { display: block; }
    .nc-user-dropdown__item {
      display: block; width: 100%; padding: 11px 16px; text-align: left;
      background: none; border: none; color: var(--text2); font-size: 0.875rem;
      cursor: pointer; transition: background 0.15s; font-family: inherit; text-decoration: none;
    }
    .nc-user-dropdown__item:hover { background: var(--surface); color: var(--text); }
    .nc-user-dropdown__item--danger { color: #f87171; }
    .nc-user-dropdown__item--danger:hover { background: rgba(239,68,68,0.08); }

    /* ── 알림 드로어 ── */
    .notif-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .notif-backdrop.open { opacity: 1; pointer-events: all; }
    .notif-drawer {
      position: fixed; top: 0; right: -440px; width: 420px; height: 100vh;
      background: var(--surface2); border-left: 1px solid var(--border);
      z-index: 950; transition: right 0.3s ease; display: flex; flex-direction: column;
    }
    .notif-drawer.open { right: 0; }
    .notif-drawer__header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .notif-drawer__title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 1.1rem; }
    .notif-drawer__actions { display: flex; gap: 8px; align-items: center; }
    .notif-drawer__close {
      background: none; border: none; color: var(--text3); font-size: 1.25rem;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s;
    }
    .notif-drawer__close:hover { background: var(--surface); }
    .notif-drawer__read-all {
      font-size: 0.75rem; color: var(--primary-light); background: none;
      border: 1px solid var(--primary); border-radius: 6px; padding: 4px 10px;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .notif-drawer__read-all:hover { background: var(--primary); color: white; }
    .notif-drawer__body { flex: 1; overflow-y: auto; padding: 12px 0; }
    .notif-item { padding: 14px 24px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .notif-item:hover { background: rgba(255,255,255,0.03); }
    .notif-item.unread { background: rgba(124,90,240,0.05); }
    .notif-item__row { display: flex; gap: 10px; align-items: flex-start; }
    .notif-item__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; margin-top: 6px; }
    .notif-item__dot.read { background: transparent; }
    .notif-item__content { flex: 1; font-size: 0.875rem; line-height: 1.5; }
    .notif-item.unread .notif-item__content { font-weight: 500; }
    .notif-item__time { font-size: 0.72rem; color: var(--text3); margin-top: 4px; }
    .notif-empty { padding: 60px 24px; text-align: center; color: var(--text3); }
    .notif-empty__icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* ── 페이지 레이아웃 ── */
    .page-wrap {
      max-width: 1100px; margin: 0 auto; padding: 28px 20px;
      display: grid; grid-template-columns: 1fr 260px; gap: 24px;
    }
    .page-left { min-width: 0; }
    .page-right { min-width: 0; display: flex; flex-direction: column; gap: 16px; }

    /* ── 통계 바 ── */
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; text-align: center;
    }
    .stat-card__label { font-size: 0.75rem; color: var(--text3); margin-bottom: 6px; }
    .stat-card__value { font-family: 'Noto Serif KR', serif; font-size: 1.4rem; font-weight: 700; color: var(--text); }
    .stat-card__value.accent { color: var(--accent); }

    /* ── 탭 ── */
    .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab-btn {
      padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); font-size: 0.85rem;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }
    .tab-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary-light); }

    /* ── 멘티 카드 ── */
    .mentee-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 14px; transition: border-color 0.2s;
    }
    .mentee-card:hover { border-color: rgba(124,90,240,0.4); }
    .mentee-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
    .mentee-avatar {
      width: 44px; height: 44px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .mentee-info { flex: 1; min-width: 0; }
    .mentee-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .mentee-name { font-size: 1rem; font-weight: 700; }
    .mentee-meta { font-size: 0.78rem; color: var(--text3); margin-bottom: 3px; }
    .mentee-novel { font-size: 0.8rem; color: var(--primary-light); }
    .mentee-actions { display: flex; gap: 8px; flex-direction: column; align-items: flex-end; flex-shrink: 0; }

    /* 최근 활동 */
    .activity-box {
      background: var(--surface2); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
    }
    .activity-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; padding: 4px 0;
    }
    .activity-row__label { color: var(--text2); }
    .activity-row__time { color: var(--text3); }

    /* 하단 버튼 줄 */
    .mentee-footer { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn {
      padding: 7px 14px; border-radius: 7px; font-size: 0.8rem; cursor: pointer;
      font-family: inherit; border: 1px solid var(--border); background: transparent;
      color: var(--text2); transition: all 0.2s;
    }
    .action-btn:hover { background: var(--surface2); color: var(--text); }
    .action-btn--primary { border-color: var(--primary); color: var(--primary-light); }
    .action-btn--primary:hover { background: var(--primary); color: white; }
    .action-btn--danger { border-color: rgba(239,68,68,0.4); color: #f87171; }
    .action-btn--danger:hover { background: rgba(239,68,68,0.1); }
    .action-btn--warn { border-color: rgba(251,146,60,0.4); color: #fb923c; }
    .action-btn--warn:hover { background: rgba(251,146,60,0.1); }
    .action-btn--chat { border-color: rgba(34,197,94,0.4); color: #4ade80; }
    .action-btn--chat:hover { background: rgba(34,197,94,0.1); }

    /* 상태 배지 */
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 0.72rem; font-weight: 600; border: 1px solid;
    }
    .badge-accepted { background: rgba(16,185,129,0.12); color: #10b981; border-color: rgba(16,185,129,0.3); }
    .badge-pending  { background: rgba(251,191,36,0.12); color: #fbbf24; border-color: rgba(251,191,36,0.3); }
    .badge-completed{ background: rgba(99,102,241,0.12); color: #a78bfa; border-color: rgba(99,102,241,0.3); }
    .badge-rejected { background: rgba(239,68,68,0.1);  color: #f87171; border-color: rgba(239,68,68,0.3); }

    /* ── 대기 신청 박스 ── */
    .pending-box {
      border: 1px dashed var(--border); border-radius: 14px;
      padding: 20px; text-align: center; background: var(--surface);
    }
    .pending-box__count { font-size: 0.82rem; color: var(--text3); margin-bottom: 4px; }
    .pending-box__msg { font-size: 0.88rem; color: var(--text2); margin-bottom: 14px; }

    /* ── 신청 목록 모달 ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 800; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 18px; padding: 28px; width: 100%; max-width: 560px;
      max-height: 85vh; overflow-y: auto;
    }
    .modal-title {
      font-family: 'Noto Serif KR', serif; font-size: 1.1rem; font-weight: 700;
      margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center;
    }
    .modal-close {
      background: none; border: none; color: var(--text3); font-size: 1.2rem;
      cursor: pointer; padding: 0 4px;
    }
    .app-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; margin-bottom: 10px;
    }
    .app-item__name { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; }
    .app-item__novel { font-size: 0.78rem; color: var(--text3); margin-bottom: 10px; }
    .app-item__btns { display: flex; gap: 8px; }

    /* ── 피드백 모달 ── */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 0.78rem; color: var(--text3); margin-bottom: 5px; display: block; }
    .form-input {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 16px; font-family: inherit;
      outline: none; box-sizing: border-box; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--primary); }
    .modal-footer { display: flex; gap: 8px; margin-top: 18px; }

    /* ── 사이드바 ── */
    .side-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px;
    }
    .side-card__title {
      font-family: 'Noto Serif KR', serif; font-size: 0.95rem; font-weight: 700;
      margin-bottom: 14px;
    }
    .side-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.83rem;
    }
    .side-row:last-child { border-bottom: none; }
    .side-row__label { color: var(--text3); }
    .side-row__value { color: var(--text); font-weight: 600; }
    .side-row__value.green { color: #10b981; }
    .side-row__value.accent { color: var(--accent); }
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle {
      width: 38px; height: 22px; border-radius: 11px; background: var(--border);
      position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--primary); }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%; background: white;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 19px; }

    /* ── 신청 / 상태 섹션 ── */
    .status-section {
      max-width: 600px; margin: 60px auto; text-align: center;
    }
    .status-icon { font-size: 3rem; margin-bottom: 16px; }
    .status-title { font-family: 'Noto Serif KR', serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    .status-desc { color: var(--text3); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
    .reject-reason {
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px; padding: 14px 18px; margin-bottom: 20px;
      font-size: 0.85rem; color: #f87171; text-align: left;
    }

    /* ── 멘토 신청 폼 ── */
    .apply-form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; max-width: 640px; margin: 0 auto;
    }
    .apply-form__title {
      font-family: 'Noto Serif KR', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 22px;
    }
    .genre-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .tag-btn {
      padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); font-size: 0.8rem; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .tag-btn.active { border-color: var(--primary); background: rgba(124,90,240,0.15); color: var(--primary-light); }
    .career-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
    .career-btn {
      padding: 9px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); font-size: 0.83rem; cursor: pointer;
      font-family: inherit; transition: all 0.2s; text-align: center;
    }
    .career-btn.active { border-color: var(--primary); background: rgba(124,90,240,0.12); color: var(--primary-light); font-weight: 600; }

    @media (max-width: 800px) {
      .page-wrap { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .page-right { order: -1; }
    }
  </style>
</head>
<body>
<nav id="nc-nav"></nav>

<!-- 알림 드로어 -->
<div class="notif-backdrop" id="notif-backdrop" onclick="closeNotifDrawer()"></div>
<div class="notif-drawer" id="notif-drawer">
  <div class="notif-drawer__header">
    <span class="notif-drawer__title">알림</span>
    <div class="notif-drawer__actions">
      <button class="notif-drawer__read-all" onclick="markAllRead()">모두 읽음</button>
      <button class="notif-drawer__close" onclick="closeNotifDrawer()">✕</button>
    </div>
  </div>
  <div class="notif-drawer__body" id="notif-list"></div>
</div>

<!-- 신청 목록 모달 -->
<div class="modal-overlay" id="app-modal">
  <div class="modal-box">
    <div class="modal-title">
      대기 중인 멘티 신청
      <button class="modal-close" onclick="closeModal('app-modal')">✕</button>
    </div>
    <div id="app-list"></div>
  </div>
</div>

<!-- 피드백 작성 모달 -->
<div class="modal-overlay" id="feedback-modal">
  <div class="modal-box">
    <div class="modal-title">
      피드백 작성
      <button class="modal-close" onclick="closeModal('feedback-modal')">✕</button>
    </div>
    <input type="hidden" id="fb-mentoring-id">
    <div class="form-group">
      <label class="form-label">제목 <span style="color:var(--error)">*</span></label>
      <input type="text" id="fb-title" class="form-input" placeholder="피드백 제목 (200자 이내)">
    </div>
    <div class="form-group">
      <label class="form-label">내용 <span style="color:var(--error)">*</span></label>
      <textarea id="fb-content" class="form-input" rows="5" placeholder="피드백 내용을 입력하세요..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="nc-btn nc-btn--secondary nc-btn--full" onclick="closeModal('feedback-modal')">취소</button>
      <button class="nc-btn nc-btn--primary nc-btn--full" onclick="submitFeedback()">등록</button>
    </div>
  </div>
</div>

<!-- 설정 변경 모달 -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal-box">
    <div class="modal-title">
      멘토 설정 변경
      <button class="modal-close" onclick="closeModal('settings-modal')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">최대 멘티 수 (1~5명)</label>
      <input type="number" id="set-max-mentees" class="form-input" min="1" max="5" value="3">
    </div>
    <div class="form-group">
      <label class="form-label">즉시 수락 허용</label>
      <select id="set-allow-instant" class="form-input">
        <option value="true">허용</option>
        <option value="false">비허용 (직접 수락)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">멘토 소개</label>
      <textarea id="set-bio" class="form-input" rows="4" placeholder="멘토 소개 (10~500자)"></textarea>
    </div>
    <div class="modal-footer">
      <button class="nc-btn nc-btn--secondary nc-btn--full" onclick="closeModal('settings-modal')">취소</button>
      <button class="nc-btn nc-btn--primary nc-btn--full" onclick="submitSettings()">저장</button>
    </div>
  </div>
</div>

<div id="page-root">
  <!-- JS로 콘텐츠 렌더링 -->
  <div style="text-align:center;padding:80px 20px;color:var(--text3)">
    <div class="nc-spinner"></div>
  </div>
</div>

<script>
  /* ─────────────────── 상수 ─────────────────── */
  const GENRE_LABELS = {
    FANTASY:'판타지', ROMANCE_FANTASY:'로판', MODERN:'현대', CHIVALROUS:'무협',
    BL:'BL', SF:'SF', HORROR:'호러', CLASSIC:'고전', DAILY_LIFE:'일상',
  };
  const CAREER_LABELS = {
    INTRODUCTION:'입문', ELEMENTARY:'초급', INTERMEDIATE:'중급', PROFICIENT:'숙련',
  };
  const STATUS_BADGE = {
    ACCEPTED: '<span class="badge badge-accepted">진행중</span>',
    PENDING:  '<span class="badge badge-pending">대기</span>',
    COMPLETED:'<span class="badge badge-completed">완료</span>',
    REJECTED: '<span class="badge badge-rejected">거절</span>',
  };

  let mentorProfile = null;
  let allowInstantState = false;
  let selectedApplyGenres = [];
  let selectedApplyFields = [];
  let selectedApplyCareer = null;
  let selectedApplyStyles = [];

  /* ─────────────────── 네비게이션 ─────────────────── */
  function initNav() {
    const nav = document.getElementById('nc-nav');
    if (!nav) return;
    const user = Auth.getUser();
    const isLoggedIn = Auth.isLoggedIn();
    const isAuthorOrMentor = user?.role === 'AUTHOR' || user?.role === 'MENTOR';
    nav.innerHTML = `
      <div class="nc-nav__inner">
        <a href="/index.html" class="nc-nav__logo"><span class="logo-icon">✦</span>NovelCraft</a>
        <div class="nc-nav__right">
          ${isLoggedIn ? `
            <button class="nc-point-btn" id="nav-point" onclick="openPointModal()">···P</button>
            <button class="nc-alarm-btn" id="nav-alarm" onclick="openNotifDrawer()">
              🔔<span class="nc-alarm-dot" id="alarm-dot" style="display:none"></span>
            </button>
            <button class="nc-nav__btn" onclick="window.location.href='/library.html'">내 서재</button>
            <button class="nc-nav__btn nc-nav__btn--mentee" onclick="window.location.href='/mentor-list.html'">멘티</button>
            <button class="nc-nav__btn nc-nav__btn--mentor" onclick="window.location.href='/mentor-dashboard.html'">멘토</button>

                ${user?.nickname || '내 프로필'} ▾
              </button>

          ` : `

          `}

    if (isLoggedIn) {
      loadPoint();
      loadUnreadCount();
    }
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('user-menu');
      if (menu && !menu.contains(e.target)) menu.classList.remove('open');

  }

  function toggleUserMenu() { document.getElementById('user-menu')?.classList.toggle('open'); }
  async function doLogout() { await Auth.logout(); }

  async function loadPoint() {
    try {
      const d = await api.get('/points/balance', true);
      const el = document.getElementById('nav-point');
      if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
    } catch {}
  }

  /* ─────────────────── 알림 드로어 ─────────────────── */
  function openNotifDrawer() {
    document.getElementById('notif-drawer')?.classList.add('open');
    document.getElementById('notif-backdrop')?.classList.add('open');
    document.body.style.overflow = 'hidden';
    loadNotifications();
  }
  function closeNotifDrawer() {
    document.getElementById('notif-drawer')?.classList.remove('open');
    document.getElementById('notif-backdrop')?.classList.remove('open');
    document.body.style.overflow = '';
  }
  async function loadUnreadCount() {
    try {
      const res = await api.get('/notifications/unread-count', true);
      const dot = document.getElementById('alarm-dot');
      if (dot) dot.style.display = (res?.count > 0) ? 'block' : 'none';
    } catch {}
  }
  async function loadNotifications() {
    const list = document.getElementById('notif-list');
    if (!list) return;
    list.innerHTML = '<div class="notif-empty"><div class="notif-empty__icon">🔔</div>불러오는 중...</div>';
    try {
      const res = await api.get('/notifications?page=0&size=30', true);
      const items = res?.content || res?.data?.content || [];
      if (!items.length) {
        list.innerHTML = '<div class="notif-empty"><div class="notif-empty__icon">🔔</div>새 알림이 없습니다</div>';
        return;
      }
      list.innerHTML = items.map(n => `
        <div class="notif-item ${n.isRead ? '' : 'unread'}" onclick="markRead(${n.id}, this)">
          <div class="notif-item__row">
            <div class="notif-item__dot ${n.isRead ? 'read' : ''}"></div>
            <div>
              <div class="notif-item__content">${n.message || n.content || ''}</div>
              <div class="notif-item__time">${formatRelTime(n.createdAt)}</div>
            </div>
          </div>
        </div>`).join('');
    } catch {
      list.innerHTML = '<div class="notif-empty">알림을 불러올 수 없습니다</div>';
    }
  }
  async function markRead(id, el) {
    try { await api.patch(`/notifications/${id}/read`, {}, true); } catch {}
    el?.classList.remove('unread');
    el?.querySelector('.notif-item__dot')?.classList.add('read');
  }
  async function markAllRead() {
    try { await api.patch('/notifications/read-all', {}, true); Toast.success('모두 읽음 처리'); loadNotifications(); } catch {}
  }
  function formatRelTime(dt) {
    if (!dt) return '';
    const m = Math.floor((Date.now() - new Date(dt)) / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return `${m}분 전`;
    if (m < 1440) return `${Math.floor(m/60)}시간 전`;
    return `${Math.floor(m/1440)}일 전`;
  }

  /* ─────────────────── 유틸 ─────────────────── */
  function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }
  function openModal(id)  { document.getElementById(id)?.classList.add('open'); }

  function fmtDate(dt) {
    if (!dt) return '-';
    const d = new Date(dt);
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  /* ─────────────────── 메인 로드 ─────────────────── */
  async function loadPage() {
    if (!Auth.isLoggedIn()) {
      window.location.href = `/login.html?redirect=${encodeURIComponent(location.pathname)}`;
      return;
    }
    const root = document.getElementById('page-root');
    if (!root) {
      console.error('[mentor-dashboard] page-root 엘리먼트 없음');
      return;
    }

    // 10초 타임아웃 안전망
    const timeoutId = setTimeout(() => {
      if (root.querySelector('.nc-spinner')) {
        console.warn('[mentor-dashboard] 10초 타임아웃 → 신청 폼 표시');
        try { renderApplyForm(root); } catch(e) {
          root.innerHTML = `<div style="text-align:center;padding:80px;color:var(--text3)">
            <div>연결 시간 초과. <button onclick="location.reload()" style="color:var(--primary);background:none;border:none;cursor:pointer;text-decoration:underline">새로고침</button></div>
          </div>`;
        }
      }
    }, 10000);

    try {
      const res = await api.get('/mentors/me/status', true);
      clearTimeout(timeoutId);
      console.log('[mentor-dashboard] status API 응답:', res);
      const status = res?.data?.status || res?.status;
      const rejectReason = res?.data?.rejectReason || res?.rejectReason;

      if (status === 'APPROVED') {
        await renderApprovedDashboard(root);
      } else if (status === 'PENDING') {
        renderPending(root);
      } else if (status === 'REJECTED') {
        renderRejected(root, rejectReason);
      } else {
        renderApplyForm(root);
      }
    } catch (e) {
      clearTimeout(timeoutId);
      console.log('[mentor-dashboard] 오류 (신청 없음 or 에러):', e?.message);
      try {
        renderApplyForm(root);
      } catch (e2) {
        console.error('[mentor-dashboard] renderApplyForm 오류:', e2);
        root.innerHTML = `<div style="text-align:center;padding:80px;color:var(--text3)">
          <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
          <div>페이지 로딩 오류: ${e?.message || '알 수 없는 오류'}</div>
          <button onclick="location.reload()" style="margin-top:16px;padding:8px 20px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer">다시 시도</button>
        </div>`;
      }
    }
  }

  /* ─────────────────── 대기/거절 상태 ─────────────────── */
  function renderPending(root) {
    root.innerHTML = `
      <div class="status-section">
        <div class="status-icon">⏳</div>
        <div class="status-title">멘토 신청 검토 중</div>
        <div class="status-desc">관리자가 신청을 검토 중입니다.<br>승인 완료 시 알림을 드립니다.</div>
        <span class="badge badge-pending" style="font-size:0.85rem;padding:6px 18px">검토 중</span>
      </div>`;
  }

  function renderRejected(root, reason) {
    root.innerHTML = `
      <div class="status-section">
        <div class="status-icon">❌</div>
        <div class="status-title">멘토 신청이 반려되었습니다</div>
        ${reason ? `<div class="reject-reason">반려 사유: ${reason}</div>` : ''}
        <div class="status-desc">내용을 수정하여 다시 신청할 수 있습니다.</div>
        <button class="nc-btn nc-btn--primary" onclick="renderApplyForm(document.getElementById('page-root'))">
          다시 신청하기
        </button>
      </div>`;
  }

  /* ─────────────────── 멘토 신청 폼 ─────────────────── */
  function renderApplyForm(root) {
    const genres = Object.entries(GENRE_LABELS);
    const fields = ['세계관 구축','캐릭터 설계','문장력','플롯 구성','대화문','감정 묘사','독자 소통','장르 이해'];
    const styles = ['피드백 중심','대화형','원고 분석','작업 일정 관리','심리 지원'];
    const careers = Object.entries(CAREER_LABELS);

    root.innerHTML = `
      <div style="max-width:680px;margin:0 auto;padding:28px 20px">
        <div style="margin-bottom:24px">
          <h1 style="font-family:'Noto Serif KR',serif;font-size:1.5rem;font-weight:700;margin-bottom:6px">멘토 신청</h1>
          <p style="color:var(--text3);font-size:0.875rem">작가 멘토로 활동하며 멘티를 지도해보세요</p>
        </div>
        <div class="apply-form">
          <div class="apply-form__title">멘토 프로필 작성</div>

          <div class="form-group">
            <label class="form-label">멘토 소개 <span style="color:var(--error)">*</span> (10~500자)</label>
            <textarea id="ap-bio" class="form-input" rows="4" placeholder="멘토로서의 경험과 강점을 소개해 주세요"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">집필 경력 <span style="color:var(--error)">*</span></label>
            <div class="career-grid">
              ${careers.map(([v,l]) => `
                <button class="career-btn" data-career="${v}" onclick="toggleCareer('${v}',this)">${l}</button>
              `).join('')}
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">주력 장르 <span style="color:var(--error)">*</span> (1개 이상)</label>
            <div class="genre-grid">
              ${genres.map(([v,l]) => `
                <button class="tag-btn" data-val="${v}" onclick="toggleTag(this,'genre')">${l}</button>
              `).join('')}
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">전문 분야 <span style="color:var(--error)">*</span> (2개 이상)</label>
            <div class="genre-grid">
              ${fields.map(f => `
                <button class="tag-btn" data-val="${f}" onclick="toggleTag(this,'field')">${f}</button>
              `).join('')}
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">멘토링 스타일 <span style="color:var(--error)">*</span> (1개 이상)</label>
            <div class="genre-grid">
              ${styles.map(s => `
                <button class="tag-btn" data-val="${s}" onclick="toggleTag(this,'style')">${s}</button>
              `).join('')}
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">최대 멘티 수 <span style="color:var(--error)">*</span> (1~5명)</label>
            <input type="number" id="ap-max-mentees" class="form-input" min="1" max="5" value="3">
          </div>

          <div class="form-group">
            <label class="form-label">즉시 수락 허용 <span style="color:var(--error)">*</span></label>
            <select id="ap-allow-instant" class="form-input">
              <option value="false">비허용 (직접 수락)</option>
              <option value="true">허용 (자동 수락)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">수상·출간 경력 (선택)</label>
            <textarea id="ap-awards" class="form-input" rows="2" placeholder="수상 경력, 출간작 등 (500자 이내)"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">환영하는 멘티 유형 (선택)</label>
            <input type="text" id="ap-preferred" class="form-input" placeholder="어떤 멘티를 원하시나요? (500자 이내)">
          </div>

          <button class="nc-btn nc-btn--primary nc-btn--full nc-btn--lg" onclick="submitApply()" style="margin-top:8px">
            멘토 신청하기
          </button>
        </div>
      </div>`;

    selectedApplyGenres = [];
    selectedApplyFields = [];
    selectedApplyCareer = null;
    selectedApplyStyles = [];
  }

  function toggleCareer(val, btn) {
    document.querySelectorAll('.career-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedApplyCareer = val;
  }

  function toggleTag(btn, type) {
    btn.classList.toggle('active');
    const val = btn.dataset.val;
    const map = { genre: selectedApplyGenres, field: selectedApplyFields, style: selectedApplyStyles };
    const arr = map[type];
    const idx = arr.indexOf(val);
    if (idx === -1) arr.push(val);
    else arr.splice(idx, 1);
  }

  async function submitApply() {
    const bio = document.getElementById('ap-bio').value.trim();
    const maxMentees = parseInt(document.getElementById('ap-max-mentees').value);
    const allowInstant = document.getElementById('ap-allow-instant').value === 'true';
    const awardsCareer = document.getElementById('ap-awards')?.value.trim() || null;
    const preferredMenteeDesc = document.getElementById('ap-preferred')?.value.trim() || null;

    if (!bio || bio.length < 10) { Toast.error('멘토 소개를 10자 이상 입력해주세요'); return; }
    if (!selectedApplyCareer) { Toast.error('집필 경력을 선택해주세요'); return; }
    if (!selectedApplyGenres.length) { Toast.error('주력 장르를 1개 이상 선택해주세요'); return; }
    if (selectedApplyFields.length < 2) { Toast.error('전문 분야를 2개 이상 선택해주세요'); return; }
    if (!selectedApplyStyles.length) { Toast.error('멘토링 스타일을 1개 이상 선택해주세요'); return; }
    if (!maxMentees || maxMentees < 1 || maxMentees > 5) { Toast.error('최대 멘티 수는 1~5명이어야 합니다'); return; }

    try {
      await api.post('/mentors', {
        bio, careerLevel: selectedApplyCareer,
        mainGenres: selectedApplyGenres,
        specialFields: selectedApplyFields,
        mentoringStyles: selectedApplyStyles,
        maxMentees, allowInstant,
        awardsCareer: awardsCareer || null,
        preferredMenteeDesc: preferredMenteeDesc || null,
      }, true);
      Toast.success('멘토 신청이 접수되었습니다. 검토 후 승인됩니다.');
      setTimeout(() => loadPage(), 1200);
    } catch (e) {
      Toast.error(e.message || '신청 실패');
    }
  }

  /* ─────────────────── 승인된 멘토 대시보드 ─────────────────── */

    const [profileRes, detailRes, menteesRes, statsRes] = await Promise.allSettled([
      api.get('/mentors/me', true),
      api.get('/mentors/me/statistics/detail', true),
      api.get('/mentors/v2/me/mentees', true),
      api.get('/mentors/me/statistics', true),
    ]);

    const profile = profileRes.status === 'fulfilled' ? (profileRes.value?.data || profileRes.value) : null;
    const detail  = detailRes.status  === 'fulfilled' ? (detailRes.value?.data  || detailRes.value)  : null;
    const mentees = menteesRes.status === 'fulfilled' ? (menteesRes.value?.data || menteesRes.value || []) : [];
    const stats   = statsRes.status   === 'fulfilled' ? (statsRes.value?.data   || statsRes.value)   : null;

    mentorProfile = profile;
    allowInstantState = profile?.allowInstant ?? false;

    const activeMentees   = mentees.filter(m => m.status === 'ACCEPTED');

    const completedSess   = detail?.completedSessions ?? 0;

    const maxMentees      = profile?.maxMentees ?? 3;
    const remaining       = Math.max(0, maxMentees - activeMentees.length);

    root.innerHTML = `

        <!-- 왼쪽 -->
        <div class="page-left">
          <!-- 통계 바 -->
          <div class="stats-bar">
            <div class="stat-card">
              <div class="stat-card__label">현재 멘티</div>
              <div class="stat-card__value">${activeMentees.length} / ${maxMentees}명</div>

            <div class="stat-card">
              <div class="stat-card__label">대기 신청</div>
              <div class="stat-card__value">${pendingCount}건</div>
            </div>
            <div class="stat-card">
              <div class="stat-card__label">완료 세션</div>
              <div class="stat-card__value">${completedSess}회</div>
            </div>
            <div class="stat-card">
              <div class="stat-card__label">평균 만족도</div>
              <div class="stat-card__value accent">★ ${avgSatisfaction.toFixed(1)}</div>
            </div>
          </div>

          <!-- 탭 -->
          <div class="tab-bar">
            <button class="tab-btn active" onclick="filterMentees('ALL',this)">전체</button>
            <button class="tab-btn" onclick="filterMentees('ACCEPTED',this)">진행중</button>
            <button class="tab-btn" onclick="filterMentees('COMPLETED',this)">완료</button>

          <!-- 멘티 목록 -->

            ${renderMenteeCards(mentees)}
          </div>

          <!-- 대기 신청 박스 (수동승인일 때만 노출) -->
          ${pendingCount > 0 && !allowInstantState ? `
            <div class="pending-box">
              <div class="pending-box__count">슬롯 ${remaining}개 남음</div>
              <div class="pending-box__msg">대기 중인 신청 ${pendingCount}건이 있어요</div>
              <button class="nc-btn nc-btn--primary nc-btn--sm" onclick="openAppModal()">신청 목록 보기</button>
            </div>
          ` : ''}
        </div>

        <!-- 오른쪽 사이드바 -->
        <div class="page-right">
          <!-- 멘토 설정 -->
          <div class="side-card">
            <div class="side-card__title">멘토 설정</div>
            <div class="side-row">
              <span class="side-row__label">신청 허용</span>

                <div class="toggle ${allowInstantState ? 'on' : ''}" id="allow-toggle" onclick="toggleAllow()"></div>

            <div class="side-row">
              <span class="side-row__label">최대 멘티</span>
              <span class="side-row__value">${maxMentees}명</span>
            </div>
            <div class="side-row">
              <span class="side-row__label">잔여 슬롯</span>
              <span class="side-row__value green">${remaining}명</span>
            </div>
            <button class="nc-btn nc-btn--secondary nc-btn--full nc-btn--sm" style="margin-top:12px"
                    onclick="openSettingsModal()">설정 변경</button>
          </div>

          <!-- 멘토링 통계 -->
          <div class="side-card">
            <div class="side-card__title">멘토링 통계</div>
            <div class="side-row"><span class="side-row__label">총 멘티</span><span class="side-row__value">${detail?.totalMentees ?? 0}명</span></div>
            <div class="side-row"><span class="side-row__label">완료 세션</span><span class="side-row__value">${completedSess}회</span></div>
            <div class="side-row"><span class="side-row__label">만족도</span><span class="side-row__value accent">★ ${avgSatisfaction.toFixed(1)}</span></div>
          </div>
        </div>
      </div>`;
  }

  let allMentees = [];

  function renderMenteeCards(mentees) {
    allMentees = mentees;
    if (!mentees.length) {
      return `<div style="text-align:center;padding:40px;color:var(--text3)">
        <div style="font-size:2rem;margin-bottom:10px">👥</div>

        <!-- 최근 활동 -->
        <div class="activity-box">
          <div class="activity-row">
            <span class="activity-row__label">마지막 피드백</span>
            <span class="activity-row__time">${lastFb}</span>
          </div>
          <div class="activity-row">
            <span class="activity-row__label">총 세션</span>
            <span class="activity-row__time">${m.totalSessions}회</span>
          </div>
        </div>

        <div class="mentee-footer">
          ${isActive ? `
            <button class="action-btn action-btn--chat" onclick="openChat(${m.mentoringId})">💬 채팅하기</button>
            <button class="action-btn" onclick="openFeedbackModal(${m.mentoringId})">피드백 작성</button>
            <button class="action-btn action-btn--warn" onclick="reportMentee(${m.mentoringId})">🔔 신고하기</button>
            <button class="action-btn action-btn--danger" onclick="completeMentoring(${m.mentoringId})">멘토링 종료</button>
          ` : `<span style="font-size:0.78rem;color:var(--text3)">종료된 멘토링입니다</span>`}
        </div>
      </div>`;
  }

  function filterMentees(status, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = status === 'ALL' ? allMentees : allMentees.filter(m => m.status === status);
    document.getElementById('mentee-list').innerHTML = renderMenteeCards(filtered);
  }

  /* ─────────────────── 원고 보기 ─────────────────── */
  async function viewManuscript(mentoringId) {
    try {
      const res = await api.get(`/v2/mentorings/${mentoringId}/documents`, true);
      const url = res?.data?.downloadUrl || res?.downloadUrl || res?.url;
      if (url) window.open(url, '_blank');
      else Toast.info('원고 URL을 가져올 수 없습니다');
    } catch (e) {
      Toast.error(e.message || '원고 조회 실패');
    }
  }

  /* ─────────────────── 피드백 ─────────────────── */
  function openFeedbackModal(mentoringId) {
    document.getElementById('fb-mentoring-id').value = mentoringId;
    document.getElementById('fb-title').value = '';
    document.getElementById('fb-content').value = '';
    openModal('feedback-modal');
  }
  async function submitFeedback() {
    const mentoringId = document.getElementById('fb-mentoring-id').value;
    const title   = document.getElementById('fb-title').value.trim();
    const content = document.getElementById('fb-content').value.trim();
    if (!title)   { Toast.error('피드백 제목을 입력하세요'); return; }
    if (!content) { Toast.error('피드백 내용을 입력하세요'); return; }
    try {
      await api.post(`/v2/mentorings/${mentoringId}/feedbacks`, { title, content }, true);
      Toast.success('피드백이 등록되었습니다');
      closeModal('feedback-modal');
    } catch (e) { Toast.error(e.message || '피드백 등록 실패'); }
  }

  /* ─────────────────── 멘토링 종료 ─────────────────── */
  async function completeMentoring(mentoringId) {
    if (!confirm('이 멘토링을 종료하시겠습니까?')) return;
    try {
      await api.patch(`/v2/mentorings/${mentoringId}/complete`, {}, true);
      Toast.success('멘토링이 종료되었습니다');
      loadPage();
    } catch (e) { Toast.error(e.message || '종료 실패'); }
  }

  /* ─────────────────── 채팅 ─────────────────── */
  async function openChat(mentoringId) {
    try {
      const res = await api.post(`/api/chatrooms?mentorshipId=${mentoringId}`, {}, true);
      const roomId = res?.data?.id || res?.id;
      if (!roomId) { Toast.error('채팅방을 열 수 없습니다'); return; }
      window.location.href = `/chat.html?roomId=${roomId}`;
    } catch (e) {
      Toast.error('채팅방 생성 중 오류가 발생했습니다');
    }
  }

  /* ─────────────────── 신고 ─────────────────── */
  function reportMentee(mentoringId) {
    if (!confirm('이 멘티를 신고하시겠습니까?')) return;
    Toast.info('신고가 접수되었습니다');
  }

  /* ─────────────────── 신청 목록 ─────────────────── */
  async function openAppModal() {
    openModal('app-modal');
    const list = document.getElementById('app-list');
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3)">불러오는 중...</div>';
    try {
      const res = await api.get('/v2/mentorings/received?page=0&size=20', true);
      const items = (res?.data?.content || res?.content || []).filter(i => i.status === 'PENDING');
      if (!items.length) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3)">대기 중인 신청이 없습니다</div>';
        return;
      }
      list.innerHTML = items.map(item => `
        <div class="app-item" id="app-${item.mentoringId}">
          <div class="app-item__name">${item.menteeName || '이름 없음'}</div>
          <div class="app-item__novel">📖 ${item.title || '소설 정보 없음'} · 신청일 ${fmtDate(item.appliedAt)}</div>
          <div class="app-item__btns">
            <button class="nc-btn nc-btn--primary nc-btn--sm"
                    onclick="acceptMentee(${item.mentoringId}, ${item.menteeId}, this)">수락</button>
            <button class="nc-btn nc-btn--sm" style="border:1px solid var(--border);background:transparent;color:var(--text3)"
                    onclick="rejectMentee(${item.mentoringId}, ${item.menteeId}, this)">거절</button>
          </div>
        </div>`).join('');
    } catch (e) {
      list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text3)">${e.message || '조회 실패'}</div>`;
    }
  }

  async function acceptMentee(mentoringId, menteeId, btn) {
    btn.disabled = true; btn.textContent = '수락 중...';
    try {
      await api.patch(`/v2/mentorings/${mentoringId}/mentees/${menteeId}/accept`, {}, true);
      Toast.success('멘티를 수락했습니다');
      document.getElementById(`app-${mentoringId}`)?.remove();
      loadPage();
    } catch (e) { Toast.error(e.message || '수락 실패'); btn.disabled = false; btn.textContent = '수락'; }
  }

  async function rejectMentee(mentoringId, menteeId, btn) {
    if (!confirm('이 신청을 거절하시겠습니까?')) return;
    btn.disabled = true; btn.textContent = '거절 중...';
    try {
      await api.patch(`/v2/mentorings/${mentoringId}/mentees/${menteeId}/reject`, {}, true);
      Toast.success('신청을 거절했습니다');
      document.getElementById(`app-${mentoringId}`)?.remove();
    } catch (e) { Toast.error(e.message || '거절 실패'); btn.disabled = false; btn.textContent = '거절'; }
  }

  /* ─────────────────── 설정 변경 ─────────────────── */
  function openSettingsModal() {
    if (mentorProfile) {
      document.getElementById('set-max-mentees').value  = mentorProfile.maxMentees || 3;
      document.getElementById('set-allow-instant').value = mentorProfile.allowInstant ? 'true' : 'false';
      document.getElementById('set-bio').value = mentorProfile.introduction || '';
    }
    openModal('settings-modal');
  }

  async function submitSettings() {
    const maxMentees  = parseInt(document.getElementById('set-max-mentees').value);
    const allowInstant = document.getElementById('set-allow-instant').value === 'true';
    const bio = document.getElementById('set-bio').value.trim();
    if (!bio || bio.length < 10) { Toast.error('소개를 10자 이상 입력하세요'); return; }
    try {
      await api.put('/mentors/me', {
        bio,
        maxMentees,
        allowInstant,
        mainGenres: mentorProfile?.mainGenres || [],
        specialFields: mentorProfile?.specialFields || [],
        mentoringStyles: mentorProfile?.mentoringStyles || [],
        careerLevel: mentorProfile?.careerLevel || 'INTERMEDIATE',
      }, true);
      Toast.success('설정이 변경되었습니다');
      closeModal('settings-modal');
      loadPage();
    } catch (e) { Toast.error(e.message || '변경 실패'); }
  }

  function toggleAllow() {
    allowInstantState = !allowInstantState;
    document.getElementById('allow-toggle')?.classList.toggle('on', allowInstantState);
  }

  /* ─────────────────── 초기화 ─────────────────── */
  function init() {
    initNav();
    loadPage();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* ─────────────────── 포인트 충전 ─────────────────── */
  const PORTONE_STORE_ID    = 'store-6dd586c4-bbae-4fc5-a1b1-920f1850b300';
  const PORTONE_CHANNEL_KEY = 'channel-key-70f0f4c2-74c5-4c38-b275-c2c01e2c3660';
  let selectedPointAmt = 1000;

  function initPointOptions() {
    document.querySelectorAll('.point-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.point-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedPointAmt = parseInt(btn.dataset.amount);
      });
    });
  }

  function openPointModal() {
    api.get('/points/balance', true).then(d => {
      const el = document.getElementById('modal-current-point');
      if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
    }).catch(() => {});
    initPointOptions();
    Modal.open('modal-point');
  }

  async function chargePoint() {
    if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
    try {
      const [prepare, meInfo] = await Promise.all([
        api.post('/payments/prepare', { amount: selectedPointAmt }, true),
        api.get('/auth/users/me', true),
      ]);
      const paymentKey = prepare.paymentKey;
      const phoneNo = meInfo.phoneNo?.replace(/-/g, '') || '';

      Modal.close('modal-point');
      Toast.info('결제창을 불러오는 중...');

      const me = Auth.getUser();
      const portoneRes = await PortOne.requestPayment({
        storeId: PORTONE_STORE_ID,
        channelKey: PORTONE_CHANNEL_KEY,
        paymentId: paymentKey,
        orderName: `NovelCraft ${selectedPointAmt.toLocaleString()}P 포인트 충전`,
        totalAmount: selectedPointAmt,
        currency: 'CURRENCY_KRW',
        payMethod: 'CARD',
        customer: {
          fullName: me?.nickname || '구매자',
          phoneNumber: phoneNo,
          ...(me?.email ? { email: me.email } : {}),
        },
      });

      if (portoneRes.code) {
        Toast.error(`결제 실패: ${portoneRes.message}`);
        return;
      }

      await api.post('/payments/confirm', {
        paymentId: portoneRes.paymentId,
        amount: selectedPointAmt,
      }, true);

      Toast.success(`${selectedPointAmt.toLocaleString()}P가 충전되었습니다!`);

      api.get('/points/balance', true).then(d => {
        const el = document.getElementById('nav-point');
        if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
      }).catch(() => {});
    } catch (e) {
      Toast.error(e.message || '충전 중 오류가 발생했습니다.');
    }
  }
</script>

<!-- 포인트 충전 모달 -->
<div class="nc-modal" id="modal-point">
  <div class="nc-modal__backdrop" onclick="Modal.close('modal-point')"></div>
  <div class="nc-modal__box">
    <button class="nc-modal__close" onclick="Modal.close('modal-point')">✕</button>
    <div class="nc-modal__title">💎 포인트 충전</div>
    <div style="margin-bottom:16px">
      <div style="font-size:0.82rem;color:var(--text3);margin-bottom:12px">충전할 포인트를 선택하세요</div>
      <div class="point-options" id="point-options">
        <button class="point-opt selected" data-amount="1000">
          <div class="point-opt__amount">1,000P</div>
          <div class="point-opt__price">₩1,000</div>
        </button>
        <button class="point-opt" data-amount="5000">
          <div class="point-opt__amount">5,000P</div>
          <div class="point-opt__price">₩5,000</div>
        </button>
        <button class="point-opt" data-amount="10000">
          <div class="point-opt__amount">10,000P</div>
          <div class="point-opt__price">₩10,000</div>
        </button>
        <button class="point-opt" data-amount="30000">
          <div class="point-opt__amount">30,000P</div>
          <div class="point-opt__price">₩30,000</div>
        </button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:12px 14px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)">
      <span style="font-size:0.85rem;color:var(--text3)">현재 잔여 포인트</span>
      <span style="font-weight:700;color:var(--accent)" id="modal-current-point">-</span>
    </div>
    <button class="nc-btn nc-btn--primary nc-btn--full" onclick="chargePoint()">충전하기</button>
  </div>
</div>
</body>
</html>
