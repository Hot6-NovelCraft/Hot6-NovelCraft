<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelCraft - 소설 상세</title>
    <script src="/common.js"></script>
    <style>
        /* 히어로 배너 */
        .novel-hero {
            background: linear-gradient(160deg, #0f0f13, #1a1025);
            border-bottom: 1px solid var(--border);
            padding: 40px 0;
            position: relative;
            overflow: hidden;
        }

        .novel-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 80% at 20% 50%, rgba(124, 90, 240, 0.12), transparent);
        }

        .novel-hero__inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 200px 1fr 280px;
            gap: 32px;
            position: relative;
            z-index: 1;
        }

        .novel-cover-large {
            width: 200px;
            height: 280px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--surface2), var(--bg3));
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .novel-cover-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .novel-meta {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .novel-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .novel-h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .novel-author-link {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .novel-author-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .novel-author-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .novel-author-sub {
            font-size: 0.75rem;
            color: var(--text3);
        }

        .novel-desc {
            color: var(--text2);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 16px;
            max-width: 600px;
        }

        .novel-stats-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
        }

        .novel-stat-item {
            text-align: center;
        }

        .novel-stat-val {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Noto Serif KR', serif;
        }

        .novel-stat-lbl {
            font-size: 0.72rem;
            color: var(--text3);
        }

        .novel-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 우측 패널 */
        .novel-side {
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: flex-end;
        }

        .purchase-box {
            background: rgba(124, 90, 240, 0.08);
            border: 1px solid rgba(124, 90, 240, 0.25);
            border-radius: var(--radius);
            padding: 20px;
        }

        .purchase-box__title {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .purchase-box__price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .purchase-box__desc {
            font-size: 0.8rem;
            color: var(--text3);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        /* 탭 컨텐츠 영역 */
        .novel-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* 에피소드 목록 */
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .episode-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
        }

        .episode-item:hover {
            background: var(--surface);
            border-color: var(--border);
        }

        .ep-num {
            font-weight: 700;
            color: var(--text3);
            min-width: 48px;
            font-size: 0.85rem;
        }

        .ep-title {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .ep-badges {
            display: flex;
            gap: 6px;
        }

        .ep-date {
            font-size: 0.75rem;
            color: var(--text3);
            white-space: nowrap;
        }

        .ep-lock {
            color: var(--text3);
            font-size: 1rem;
        }

        .ep-free {
            color: var(--success);
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* 작가 팔로우 카드 */
        .author-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 32px;
        }

        .author-card__top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .author-card__avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .author-card__name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .author-card__bio {
            font-size: 0.85rem;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .novel-hero__inner {
                grid-template-columns: 160px 1fr;
            }

            .novel-side {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .novel-hero__inner {
                grid-template-columns: 1fr;
            }

            .novel-cover-large {
                width: 140px;
                height: 196px;
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
<nav id="nc-nav"></nav>

<!-- 소설 히어로 -->
<section class="novel-hero" id="novel-hero">
    <div class="novel-hero__inner">
        <div class="novel-cover-large" id="novel-cover">
            <div class="nc-spinner"></div>
        </div>
        <div class="novel-meta" id="novel-meta">
            <div class="nc-loading">
                <div class="nc-spinner"></div>
            </div>
        </div>
        <div class="novel-side" id="novel-side"></div>
    </div>
</section>

<!-- 탭 + 컨텐츠 -->
<div class="novel-content">
    <div class="nc-tabs" id="novel-tabs">
        <button class="nc-tab active" data-tab="episodes">회차 목록</button>
        <button class="nc-tab" data-tab="info">소설 정보</button>
    </div>
    <div style="margin-top:24px">
        <div id="tab-episodes">
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:16px">
                <span id="ep-total" style="font-size:0.875rem;color:var(--text3)"></span>
                <button class="nc-btn nc-btn--sm nc-btn--outline" id="bulk-buy-btn" style="display:none"
                        onclick="bulkBuyEpisodes()">🛒 전체 구매
                </button>
            </div>
            <div class="episode-list" id="episode-list">
                <div class="nc-loading">
                    <div class="nc-spinner"></div>
                </div>
            </div>
            <div class="nc-pagination" id="ep-pagination"></div>
        </div>
        <div id="tab-info" style="display:none">
            <div id="novel-info-body"></div>
            <div id="author-card-area"></div>
        </div>
    </div>
</div>

<!-- 포인트 구매 모달 -->
<div class="nc-modal" id="modal-purchase">
    <div class="nc-modal__backdrop" onclick="Modal.close('modal-purchase')"></div>
    <div class="nc-modal__box">
        <button class="nc-modal__close" onclick="Modal.close('modal-purchase')">✕</button>
        <div class="nc-modal__title" id="purchase-modal-title">유료 회차 열람</div>
        <div id="purchase-modal-body"></div>
    </div>
</div>

<!-- 찜 알림 사이드바 -->
<div class="nc-sidebar" id="sidebar-bookmark">
    <div class="nc-sidebar__header">
        <span class="nc-sidebar__title">📚 내 찜 목록</span>
        <button class="nc-sidebar__close"
                onclick="Modal.close('sidebar-bookmark');document.getElementById('sidebar-bookmark').classList.remove('active')">
            ✕
        </button>
    </div>
    <div class="nc-sidebar__body" id="sidebar-bm-body"></div>
</div>

<script>
    const novelId = new URLSearchParams(location.search).get('id');
    let novelData = null;
    let authorId = null;
    let epPage = 0;

    if (!novelId) {
        Toast.error('잘못된 접근입니다');
        setTimeout(() => history.back(), 1000);
    }

    async function loadNovel() {
        try {
            novelData = await api.get(`/novels/${novelId}`);
            renderHero(novelData);
            loadEpisodes();
        } catch (e) {
            document.getElementById('novel-meta').innerHTML = `<div class="nc-empty"><div class="nc-empty__text">소설을 불러올 수 없습니다</div></div>`;
        }
    }

    function renderHero(n) {
        // ✅ 필드명 맞춤
        authorId = n.authorId || null;
        const authorName = n.authorName || n.authorNickname || '알 수 없음';
        const tags = typeof n.tags === 'string'
            ? n.tags.split(',').map(t => t.trim()).filter(Boolean)
            : (n.tags || []);

        const cover = document.getElementById('novel-cover');
        cover.innerHTML = n.coverImageUrl ? `<img src="${n.coverImageUrl}" alt="${n.title}">` : '📖';

        document.getElementById('novel-meta').innerHTML = `
    <div class="novel-badges">
      ${n.genre ? genreBadge(n.genre) : ''}
      ${statusBadge(n.status)}
      ${n.isFree ? '<span class="nc-badge" style="background:#10b98120;color:#10b981;border:1px solid #10b98140">무료</span>' : ''}
    </div>
    <h1 class="novel-h1">${n.title}</h1>
    <div class="novel-author-link">
      <div class="novel-author-avatar">${authorName.charAt(0)}</div>
      <div>
        <div class="novel-author-name">${authorName}</div>
        <div class="novel-author-sub">작가 프로필 보기</div>
      </div>
    </div>
    <div class="novel-desc">${n.description || '줄거리 정보가 없습니다.'}</div>
    <div class="novel-stats-row">
      <div class="novel-stat-item"><div class="novel-stat-val">${formatNum(n.viewCount || 0)}</div><div class="novel-stat-lbl">조회수</div></div>
      <div class="novel-stat-item"><div class="novel-stat-val">${formatNum(n.likeCount || 0)}</div><div class="novel-stat-lbl">좋아요</div></div>
      <div class="novel-stat-item"><div class="novel-stat-val">${n.episodeCount || 0}</div><div class="novel-stat-lbl">연재 회차</div></div>
      <div class="novel-stat-item"><div class="novel-stat-val">${formatNum(n.bookmarkCount || 0)}</div><div class="novel-stat-lbl">찜</div></div>
    </div>
    <div class="novel-actions">
      <button class="nc-btn nc-btn--primary" onclick="readFirst()">▶ 첫 화 읽기</button>
      ${Auth.isLoggedIn() ? `
        <button class="nc-btn nc-btn--outline" id="bookmark-btn" onclick="toggleBookmark()">🤍 찜하기</button>
        ${authorId ? `<button class="nc-btn nc-btn--outline" id="follow-btn" onclick="toggleFollow()">➕ 작가 팔로우</button>` : ''}
      ` : ''}
    </div>
  `;

        // 소설 정보 탭
        document.getElementById('novel-info-body').innerHTML = `
    <div class="nc-card" style="padding:24px;margin-bottom:24px">
      <h3 style="font-family:'Noto Serif KR',serif;margin-bottom:16px">소설 정보</h3>
      <table style="width:100%;border-collapse:collapse">
        ${[
            ['제목', n.title],
            ['작가', authorName],
            ['장르', n.genre || '-'],
            ['상태', STATUS_MAP[n.status]?.label || n.status],
            ['등록일', formatDate(n.createdAt)],
        ].map(([k, v]) => `
          <tr style="border-bottom:1px solid var(--border)">
            <td style="padding:10px 0;color:var(--text3);font-size:0.875rem;width:100px">${k}</td>
            <td style="padding:10px 0;font-size:0.9rem">${v || '-'}</td>
          </tr>
        `).join('')}
      </table>
    </div>
    ${tags.length ? `
      <div style="margin-bottom:24px">
        <div style="font-weight:700;margin-bottom:12px">태그</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${tags.map(t => `<span class="nc-badge" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border)">#${t}</span>`).join('')}
        </div>
      </div>
    ` : ''}
  `;

        // 작가 카드
        document.getElementById('author-card-area').innerHTML = `
    <div class="author-card">
      <div style="font-weight:700;font-size:1rem;margin-bottom:16px">✍️ 작가 소개</div>
      <div class="author-card__top">
        <div class="author-card__avatar">${authorName.charAt(0)}</div>
        <div>
          <div class="author-card__name">${authorName}</div>
          <div style="font-size:0.8rem;color:var(--text3)">${n.authorBio || '작가 소개가 없습니다.'}</div>
        </div>
      </div>
      ${Auth.isLoggedIn() && authorId ? `
        <button class="nc-btn nc-btn--outline nc-btn--sm" onclick="toggleFollow()">➕ 팔로우</button>
      ` : ''}
    </div>
  `;

        // 우측 구매 박스
        document.getElementById('novel-side').innerHTML = `
    <div class="purchase-box">
      <div class="purchase-box__title">💎 유료 소설</div>
      <div class="purchase-box__price">회차당 100P~</div>
      <div class="purchase-box__desc">2화까지 무료로 읽을 수 있습니다.<br>이후 회차는 포인트로 구매하세요.</div>
      <button class="nc-btn nc-btn--primary nc-btn--full" onclick="bulkBuyEpisodes()">🛒 전체 구매</button>
    </div>
  `;
    }

    async function loadEpisodes(page = 0) {
        epPage = page;
        const el = document.getElementById('episode-list');
        el.innerHTML = '<div class="nc-loading"><div class="nc-spinner"></div></div>';
        try {
            const res = await api.get(`/novels/${novelId}/episodes?page=${page}&size=20&sort=episodeNumber&direction=ASC`);
            const episodes = res.content || [];
            const total = res.totalElements || 0;
            const totalPg = res.totalPages || 0;

            document.getElementById('ep-total').textContent = `총 ${total}화`;
            if (!novelData?.isFree && total > 2) {
                document.getElementById('bulk-buy-btn').style.display = 'inline-flex';
            }

            el.innerHTML = episodes.map(ep => {
                const isFree = ep.episodeNumber <= 2;
                const isPurchased = ep.isPurchased;
                return `
            <div class="episode-item" onclick="openEpisode(${ep.episodeId}, ${ep.episodeNumber}, ${ep.isFree || isFree}, ${isPurchased || false})">
              <span class="ep-num">${ep.episodeNumber}화</span>
              <span class="ep-title">${ep.title}</span>
              <div class="ep-badges">
                ${isFree ? '<span class="ep-free">FREE</span>' : (!isPurchased ? '<span class="ep-lock">🔒</span>' : '<span class="ep-free">✓구매</span>')}
              </div>
              <span class="ep-date">${formatDate(ep.publishedAt)}</span>
            </div>
          `;
            }).join('') || '<div class="nc-empty"><div class="nc-empty__text">등록된 회차가 없습니다</div></div>';

            renderEpPagination(totalPg);
        } catch {
            el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">회차를 불러오지 못했습니다</div></div>';
        }
    }

    function renderEpPagination(pages) {
        const el = document.getElementById('ep-pagination');
        if (pages <= 1) {
            el.innerHTML = '';
            return;
        }
        let html = '';
        if (epPage > 0) html += `<button class="nc-page-btn" onclick="loadEpisodes(${epPage - 1})">‹</button>`;
        for (let i = Math.max(0, epPage - 2); i <= Math.min(pages - 1, epPage + 2); i++) {
            html += `<button class="nc-page-btn ${i === epPage ? 'active' : ''}" onclick="loadEpisodes(${i})">${i + 1}</button>`;
        }
        if (epPage < pages - 1) html += `<button class="nc-page-btn" onclick="loadEpisodes(${epPage + 1})">›</button>`;
        el.innerHTML = html;
    }

    function readFirst() {
        // 1화부터 읽기
        const firstEp = document.querySelector('.episode-item');
        if (firstEp) firstEp.click();
    }

    function openEpisode(episodeId, epNum, isFree, isPurchased) {
        if (!isFree && !isPurchased) {
            if (!Auth.isLoggedIn()) {
                window.location.href = `/login.html?redirect=${encodeURIComponent(location.href)}`;
                return;
            }
            showPurchaseModal(episodeId, epNum);
        } else {
            window.location.href = `/episode-read.html?id=${episodeId}&novelId=${novelId}`;
        }
    }

    function showPurchaseModal(episodeId, epNum) {
        document.getElementById('purchase-modal-title').textContent = `${epNum}화 구매`;
        document.getElementById('purchase-modal-body').innerHTML = `
        <p style="color:var(--text2);font-size:0.9rem;margin-bottom:20px">
          이 회차는 유료 회차입니다.<br>포인트를 사용하여 열람하시겠습니까?
        </p>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="color:var(--text3)">회차 가격</span><span style="font-weight:700">100P</span>
          </div>
          <div style="display:flex;justify-content:space-between">
            <span style="color:var(--text3)">내 포인트</span><span id="modal-my-point" style="font-weight:700;color:var(--accent)">로딩 중...</span>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="nc-btn nc-btn--outline nc-btn--full" onclick="Modal.close('modal-purchase')">취소</button>
          <button class="nc-btn nc-btn--primary nc-btn--full" onclick="purchaseEpisode(${episodeId})">포인트로 구매</button>
        </div>
        <div style="margin-top:12px;text-align:center">
          <button style="background:none;border:none;color:var(--text3);font-size:0.8rem;cursor:pointer;font-family:inherit"
            onclick="Modal.close('modal-purchase');window.location.href='/mypage.html?tab=payment'">
            포인트 충전하기 →
          </button>
        </div>
      `;
        Modal.open('modal-purchase');
        api.get('/points/balance', true).then(d => {
            const el = document.getElementById('modal-my-point');
            if (el) el.textContent = `${(d?.balance || 0).toLocaleString()}P`;
        }).catch(() => {
        });
    }

    async function purchaseEpisode(episodeId) {
        try {
            await api.post(`/episodes/${episodeId}/purchase`, {}, true);
            Toast.success('구매 완료! 읽어보세요 📖');
            Modal.close('modal-purchase');
            setTimeout(() => window.location.href = `/episode-read.html?id=${episodeId}&novelId=${novelId}`, 500);
        } catch (e) {
            Toast.error(e.message || '구매 실패');
        }
    }

    async function bulkBuyEpisodes() {
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
            return;
        }
        document.getElementById('purchase-modal-title').textContent = '전체 구매';
        document.getElementById('purchase-modal-body').innerHTML = `
        <p style="color:var(--text2);font-size:0.9rem;margin-bottom:20px">모든 유료 회차를 일괄 구매합니다.</p>
        <div style="display:flex;gap:10px">
          <button class="nc-btn nc-btn--outline nc-btn--full" onclick="Modal.close('modal-purchase')">취소</button>
          <button class="nc-btn nc-btn--primary nc-btn--full" onclick="confirmBulkBuy()">전체 구매</button>
        </div>
      `;
        Modal.open('modal-purchase');
    }

    async function confirmBulkBuy() {
        try {
            const res = await api.post(`/novels/${novelId}/episodes/purchase`, {}, true);
            Toast.success(`${res.purchasedCount || 0}화 구매 완료!`);
            Modal.close('modal-purchase');
            loadEpisodes(epPage);
        } catch (e) {
            Toast.error(e.message || '구매 실패');
        }
    }

    async function toggleBookmark() {
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
            return;
        }
        try {
            const res = await api.post(`/novels/${novelId}/bookmark`, {}, true);
            const btn = document.getElementById('bookmark-btn');
            btn.textContent = res.isBookmarked ? '❤️ 찜됨' : '🤍 찜하기';
            Toast.success(res.isBookmarked ? '찜했습니다!' : '찜 취소');
        } catch (e) {
            Toast.error(e.message || (e.message?.includes('본인') ? '본인 소설은 찜할 수 없습니다' : '오류 발생'));
        }
    }

    async function toggleFollow() {
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
            return;
        }
        if (!authorId) return;
        try {
            const res = await api.post(`/authors/${authorId}/follow`, {}, true);
            const btn = document.getElementById('follow-btn');
            if (btn) btn.textContent = res.isFollowing ? '✓ 팔로잉' : '➕ 작가 팔로우';
            Toast.success(res.isFollowing ? '팔로우했습니다!' : '팔로우 취소');
        } catch (e) {
            Toast.error(e.message || '오류 발생');
        }
    }

    // 탭 이벤트
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nc-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const t = tab.dataset.tab;
                document.getElementById('tab-episodes').style.display = t === 'episodes' ? 'block' : 'none';
                document.getElementById('tab-info').style.display = t === 'info' ? 'block' : 'none';
            });
        });
        loadNovel();
    });
</script>
</body>
</html>
