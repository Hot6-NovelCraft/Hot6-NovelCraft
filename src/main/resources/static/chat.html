<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅 - NovelCraft</title>
  <script src="/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text1);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 채팅 컨테이너 ── */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      height: 100%;
      padding-top: 64px;
    }

    /* ── 채팅 헤더 ── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-header__back {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
      line-height: 1;
    }
    .chat-header__back:hover { background: var(--bg); }
    .chat-header__title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text1);
      flex: 1;
    }
    .chat-header__status {
      font-size: 0.75rem;
      color: var(--text3);
    }
    .chat-header__status.connected { color: #4ade80; }

    /* ── 메시지 영역 ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* 날짜 구분선 */
    .chat-date-divider {
      text-align: center;
      margin: 16px 0 8px;
      position: relative;
    }
    .chat-date-divider span {
      background: var(--surface);
      color: var(--text3);
      font-size: 0.72rem;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    /* 메시지 버블 */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 72%;
      margin-bottom: 2px;
    }
    .msg-row--mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row--theirs {
      align-self: flex-start;
    }
    .msg-row--system {
      align-self: center;
      max-width: 100%;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 0.875rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-row--mine .msg-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-row--theirs .msg-bubble {
      background: var(--surface);
      color: var(--text1);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg-row--system .msg-bubble {
      background: transparent;
      color: var(--text3);
      font-size: 0.75rem;
      text-align: center;
      border: none;
      padding: 2px 8px;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--text3);
      white-space: nowrap;
      margin-bottom: 2px;
    }

    /* ── 입력창 ── */
    .chat-input-wrap {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text1);
      font-family: inherit;
      font-size: 0.875rem;
      resize: none;
      max-height: 120px;
      outline: none;
      line-height: 1.4;
      transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--primary); }
    .chat-input::placeholder { color: var(--text3); }

    .chat-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .chat-send-btn:hover { opacity: 0.85; }
    .chat-send-btn:active { transform: scale(0.93); }
    .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 로딩 */
    .chat-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 8px;
      color: var(--text3);
      font-size: 0.875rem;
    }
    .chat-loading::before {
      content: '';
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 빈 상태 */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      gap: 8px;
      font-size: 0.875rem;
    }
    .chat-empty__icon { font-size: 2.5rem; }
  </style>
</head>
<body>
  <nav id="nc-nav"></nav>

  <div class="chat-wrap">
    <div class="chat-header">
      <button class="chat-header__back" onclick="history.back()">←</button>
      <div class="chat-header__title" id="chat-title">채팅</div>
      <div class="chat-header__status" id="conn-status">연결 중...</div>
    </div>

    <div class="chat-messages" id="msg-list">
      <div class="chat-loading">메시지 불러오는 중</div>
    </div>

    <div class="chat-input-wrap">
      <textarea
        class="chat-input"
        id="msg-input"
        placeholder="메시지를 입력하세요"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
        disabled
      ></textarea>
      <button class="chat-send-btn" id="send-btn" onclick="sendMessage()" disabled>
        &#10148;
      </button>
    </div>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const roomId  = params.get('roomId');

    let stompClient = null;
    let myUserId    = null;
    let msgPage     = 0;
    let isLoading   = false;
    let hasMore     = true;

    /* ── 초기화 ── */
    async function init() {
      if (!Auth.isLoggedIn()) {
        window.location.href = `/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}`;
        return;
      }
      if (!roomId) {
        Toast.error('잘못된 접근입니다');
        history.back();
        return;
      }

      initNav();

      // 내 userId 파악 (/users/me, 백엔드 오타 uerId 포함 처리)
      try {
        const me = await api.get('/users/me', true);
        const d = me?.data || me;
        const raw = d?.uerId ?? d?.userId ?? d?.id ?? null;
        myUserId = raw !== null ? Number(raw) : null;
      } catch {
        myUserId = null;
      }

      await loadHistory();
      connectStomp();
    }

    /* ── 메시지 히스토리 로드 ── */
    async function loadHistory() {
      if (isLoading || !hasMore) return;
      isLoading = true;
      try {
        const res = await api.get(`/api/chatrooms/${roomId}/messages?page=${msgPage}&size=40`, true);
        const messages = res?.data?.content || res?.content || [];
        const totalPages = res?.data?.totalPages ?? res?.totalPages ?? 1;

        const list = document.getElementById('msg-list');

        if (msgPage === 0) {
          list.innerHTML = '';
          if (!messages.length) {
            list.innerHTML = `
              <div class="chat-empty">
                <div class="chat-empty__icon">💬</div>
                <div>아직 메시지가 없습니다.<br>첫 메시지를 보내보세요!</div>
              </div>`;
          }
        }

        if (messages.length) {
          // API는 최신순으로 반환 — 역순으로 삽입
          const sorted = [...messages].reverse();
          const fragment = document.createDocumentFragment();
          let prevDate = null;

          if (msgPage > 0) {
            // 더 오래된 메시지는 맨 위에 삽입
            const topEl = list.firstChild;
            sorted.forEach(msg => {
              const dateStr = msgDateStr(msg.createdAt);
              if (dateStr !== prevDate) {
                list.insertBefore(makeDateDivider(dateStr), topEl);
                prevDate = dateStr;
              }
              list.insertBefore(makeMsgRow(msg), topEl);
            });
          } else {
            sorted.forEach(msg => {
              const dateStr = msgDateStr(msg.createdAt);
              if (dateStr !== prevDate) {
                fragment.appendChild(makeDateDivider(dateStr));
                prevDate = dateStr;
              }
              fragment.appendChild(makeMsgRow(msg));
            });
            list.appendChild(fragment);
            scrollToBottom();
          }
        }

        hasMore = msgPage < totalPages - 1;
        msgPage++;
      } catch (e) {
        console.error('[chat] 히스토리 로드 오류:', e);
        if (msgPage === 0) {
          document.getElementById('msg-list').innerHTML = `
            <div class="chat-empty">
              <div class="chat-empty__icon">⚠️</div>
              <div>메시지를 불러올 수 없습니다</div>
            </div>`;
        }
      } finally {
        isLoading = false;
      }
    }

    /* ── STOMP 연결 ── */
    function connectStomp() {
      const token = Auth.getToken();
      const sock  = new SockJS('/ws-chat');
      stompClient = Stomp.over(sock);
      stompClient.debug = null; // 콘솔 노이즈 제거

      stompClient.connect(
        { Authorization: token?.startsWith('Bearer ') ? token : `Bearer ${token}` },
        onConnected,
        onError
      );
    }

    function onConnected() {
      document.getElementById('conn-status').textContent = '연결됨';
      document.getElementById('conn-status').className = 'chat-header__status connected';
      document.getElementById('msg-input').disabled  = false;
      document.getElementById('send-btn').disabled   = false;

      stompClient.subscribe(`/topic/chat/${roomId}`, onMessage);

      // 입장 시 읽음 처리
      api.patch(`/api/chatrooms/${roomId}/read`, {}, true).catch(() => {});
    }

    function onError(err) {
      console.error('[chat] STOMP 오류:', err);
      document.getElementById('conn-status').textContent = '연결 끊김';
      document.getElementById('conn-status').className = 'chat-header__status';
      // 3초 후 재연결
      setTimeout(connectStomp, 3000);
    }

    /* ── 실시간 메시지 수신 ── */
    function onMessage(frame) {
      let evt;
      try { evt = JSON.parse(frame.body); } catch { return; }

      if (evt.eventType === 'MESSAGE' && evt.message) {
        appendMsg(evt.message);
        // 내 메시지가 아니면 읽음 처리
        if (evt.userId !== myUserId) {
          api.patch(`/api/chatrooms/${roomId}/read`, {}, true).catch(() => {});
        }
      } else if (evt.eventType === 'LEAVE') {
        appendSystemMsg('상대방이 채팅방을 나갔습니다');
      }
    }

    /* ── 메시지 전송 ── */
    function sendMessage() {
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content || !stompClient?.connected) return;

      stompClient.send(
        `/app/chat/${roomId}`,
        {},
        JSON.stringify({ content, messageType: 'TEXT', fileUrl: null })
      );
      input.value = '';
      input.style.height = '';
    }

    function handleKey(e) {
      // Shift+Enter = 줄바꿈, Enter = 전송
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    /* ── DOM 헬퍼 ── */
    function appendMsg(msg) {
      const list = document.getElementById('msg-list');
      // 빈 상태 제거
      list.querySelector('.chat-empty')?.remove();

      const row = makeMsgRow(msg);
      list.appendChild(row);
      scrollToBottom();
    }

    function appendSystemMsg(text) {
      const list = document.getElementById('msg-list');
      const row  = document.createElement('div');
      row.className = 'msg-row msg-row--system';
      row.innerHTML = `<div class="msg-bubble">${text}</div>`;
      list.appendChild(row);
      scrollToBottom();
    }

    function makeMsgRow(msg) {
      const isMine = msg.senderId === myUserId;
      const initial = String(msg.senderId ?? '?').charAt(0);
      const time   = msgTimeStr(msg.createdAt || msg.sentAt);

      const row = document.createElement('div');
      row.className = `msg-row ${isMine ? 'msg-row--mine' : 'msg-row--theirs'}`;

      if (isMine) {
        row.innerHTML = `
          <span class="msg-time">${time}</span>
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
      } else {
        row.innerHTML = `
          <div class="msg-avatar">${escapeHtml(initial)}</div>
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <span class="msg-time">${time}</span>`;
      }
      return row;
    }

    function makeDateDivider(dateStr) {
      const div = document.createElement('div');
      div.className = 'chat-date-divider';
      div.innerHTML = `<span>${dateStr}</span>`;
      return div;
    }

    function scrollToBottom() {
      const list = document.getElementById('msg-list');
      list.scrollTop = list.scrollHeight;
    }

    function msgTimeStr(dt) {
      if (!dt) return '';
      const d = new Date(dt);
      const h = d.getHours(), m = d.getMinutes();
      return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(m).padStart(2, '0')}`;
    }

    function msgDateStr(dt) {
      if (!dt) return '';
      const d = new Date(dt);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ── 스크롤로 이전 메시지 로드 ── */
    document.getElementById('msg-list').addEventListener('scroll', function() {
      if (this.scrollTop < 80 && !isLoading && hasMore) {
        const prevH = this.scrollHeight;
        loadHistory().then(() => {
          // 스크롤 위치 유지
          this.scrollTop = this.scrollHeight - prevH;
        });
      }
    });

    /* ── 페이지 종료 시 STOMP 연결 해제 ── */
    window.addEventListener('beforeunload', () => {
      stompClient?.disconnect();
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
