<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 채팅</title>
  <script src="/common.js"></script>
  <style>
    #nc-nav { display: none; }
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* 채팅 레이아웃 */
    .chat-layout {
      flex: 1; display: grid; grid-template-columns: 280px 1fr;
      overflow: hidden;
    }

    /* 채팅방 목록 */
    .chatroom-list {
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chatroom-list__header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chatroom-list__title {
      font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; gap: 8px;
    }
    .back-btn {
      background: none; border: none; color: var(--text3);
      cursor: pointer; font-size: 1.1rem; padding: 4px;
    }
    .back-btn:hover { color: var(--text); }
    .chatroom-items { flex: 1; overflow-y: auto; }
    .chatroom-item {
      padding: 14px 20px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.15s;
      display: flex; gap: 12px; align-items: center;
    }
    .chatroom-item:hover { background: var(--surface2); }
    .chatroom-item.active { background: rgba(124,90,240,0.1); border-left: 3px solid var(--primary); }
    .chatroom-avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700;
    }
    .chatroom-info { flex: 1; min-width: 0; }
    .chatroom-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; }
    .chatroom-preview {
      font-size: 0.78rem; color: var(--text3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chatroom-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .chatroom-time { font-size: 0.7rem; color: var(--text3); }
    .unread-badge {
      background: var(--primary); color: white; border-radius: 10px;
      padding: 1px 7px; font-size: 0.7rem; font-weight: 700;
    }

    /* 채팅 메인 */
    .chat-main {
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg);
    }
    .chat-header {
      padding: 14px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
    }
    .chat-partner-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--primary));
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; flex-shrink: 0;
    }
    .chat-partner-name { font-weight: 700; font-size: 0.95rem; }
    .chat-partner-sub { font-size: 0.75rem; color: var(--text3); }
    .chat-header-actions { margin-left: auto; display: flex; gap: 8px; }

    /* 메시지 영역 */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .msg-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-row.mine { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
    }
    .msg-content { max-width: 65%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.mine .msg-content { align-items: flex-end; }
    .msg-name { font-size: 0.72rem; color: var(--text3); padding: 0 6px; }
    .msg-bubble {
      padding: 10px 14px; border-radius: 16px;
      font-size: 0.875rem; line-height: 1.6;
      word-break: break-word; max-width: 100%;
    }
    .msg-bubble.other {
      background: var(--surface2); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.mine {
      background: var(--primary); color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-time { font-size: 0.68rem; color: var(--text3); padding: 0 4px; }
    .msg-date-divider {
      text-align: center; font-size: 0.75rem; color: var(--text3);
      padding: 8px 0; display: flex; align-items: center; gap: 12px;
    }
    .msg-date-divider::before, .msg-date-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .msg-system {
      text-align: center; font-size: 0.78rem; color: var(--text3);
      padding: 6px 0; font-style: italic;
    }

    /* 입력창 */
    .chat-input-area {
      padding: 14px 16px; background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
    .chat-textarea {
      flex: 1; padding: 10px 14px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 20px;
      color: var(--text); font-size: 0.875rem; outline: none;
      resize: none; font-family: inherit; max-height: 120px;
      line-height: 1.5; transition: border-color 0.2s;
    }
    .chat-textarea:focus { border-color: var(--primary); }
    .chat-send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--primary); border: none; color: white;
      cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .chat-send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
    .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* 빈 채팅 상태 */
    .chat-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: var(--text3);
    }
    .chat-empty__icon { font-size: 3.5rem; }
    .chat-empty__text { font-size: 1rem; font-weight: 600; }
    .chat-empty__sub { font-size: 0.85rem; text-align: center; line-height: 1.6; }

    /* 연결 상태 */
    .ws-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--text3);
    }
    .ws-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border);
    }
    .ws-dot.connected { background: var(--success); }
    .ws-dot.connecting { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    @media (max-width: 680px) {
      .chat-layout { grid-template-columns: 1fr; }
      .chatroom-list { display: none; }
      .chatroom-list.mobile-show { display: flex; position: fixed; inset: 0; z-index: 200; }
    }
  </style>
</head>
<body>
  <!-- 간단 상단 바 -->
  <div style="height:50px;background:rgba(15,15,19,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0">
    <a href="/index.html" style="font-family:'Noto Serif KR',serif;font-size:1.1rem;font-weight:900;color:var(--primary-light);text-decoration:none;display:flex;align-items:center;gap:6px">
      <span style="color:var(--accent)">✦</span>NovelCraft
    </a>
    <span style="color:var(--border)">|</span>
    <span style="font-weight:700;font-size:0.9rem">💬 채팅</span>
    <div class="ws-status" style="margin-left:auto">
      <div class="ws-dot connecting" id="ws-dot"></div>
      <span id="ws-status-text">연결 중...</span>
    </div>
  </div>

  <div class="chat-layout">
    <!-- 채팅방 목록 -->
    <div class="chatroom-list" id="chatroom-list">
      <div class="chatroom-list__header">
        <div class="chatroom-list__title">
          <button class="back-btn" onclick="history.back()">←</button>
          채팅방
        </div>
      </div>
      <div class="chatroom-items" id="chatroom-items">
        <div class="nc-loading" style="padding:40px;justify-content:center;display:flex">
          <div class="nc-spinner"></div>
        </div>
      </div>
    </div>

    <!-- 채팅 메인 -->
    <div class="chat-main" id="chat-main">
      <!-- 기본: 방 선택 안 된 상태 -->
      <div class="chat-empty" id="chat-placeholder">
        <div class="chat-empty__icon">💬</div>
        <div class="chat-empty__text">채팅방을 선택하세요</div>
        <div class="chat-empty__sub">멘토 또는 멘티와의 1:1 채팅입니다.<br>멘토링 신청 후 채팅이 활성화됩니다.</div>
      </div>

      <!-- 채팅 UI (방 선택 시) -->
      <div id="chat-ui" style="display:none;flex-direction:column;height:100%">
        <div class="chat-header" id="chat-header"></div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area" style="display:none">
          <div class="chat-input-row">
            <textarea class="chat-textarea" id="chat-input" rows="1"
              placeholder="메시지를 입력하세요..."
              onkeydown="handleInputKey(event)"
              oninput="autoResize(this)"></textarea>
            <button class="chat-send-btn" id="send-btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (!Auth.isLoggedIn()) window.location.href = '/login.html';

    const myUser = Auth.getUser();
    const urlParams = new URLSearchParams(location.search);
    const initMentorshipId = urlParams.get('mentorshipId');

    let currentRoomId = null;
    let ws = null;
    let msgPage = 0;
    let isLoadingMore = false;

    // ── WebSocket 연결 ──
    function connectWS(roomId) {
      if (ws) { ws.close(); ws = null; }
      setWsStatus('connecting');

      const token = Auth.getToken();
      // Spring WebSocket STOMP 엔드포인트
      const wsUrl = `ws://${location.host}/ws/chat?token=${token}`;

      try {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          setWsStatus('connected');
          // 채팅방 입장 → 읽음 처리
          api.patch(`/chatrooms/${roomId}/read`, {}, true).catch(() => {});
          // STOMP 구독 (간소화: 실제로는 @stomp/stompjs 라이브러리 필요)
          ws.send(JSON.stringify({ type: 'SUBSCRIBE', roomId }));
        };

        ws.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.type === 'MESSAGE') appendMessage(data, false);
            else if (data.type === 'READ') handleReadEvent(data);
            else if (data.type === 'LEAVE') appendSystemMsg(`${data.senderName}님이 나갔습니다`);
          } catch {}
        };

        ws.onclose = () => {
          setWsStatus('disconnected');
          // 3초 후 재연결
          setTimeout(() => { if (currentRoomId === roomId) connectWS(roomId); }, 3000);
        };

        ws.onerror = () => setWsStatus('disconnected');
      } catch {
        setWsStatus('disconnected');
      }
    }

    function setWsStatus(status) {
      const dot = document.getElementById('ws-dot');
      const txt = document.getElementById('ws-status-text');
      dot.className = `ws-dot ${status}`;
      txt.textContent = { connected:'연결됨', connecting:'연결 중...', disconnected:'연결 끊김' }[status] || status;
    }

    // ── 채팅방 목록 로드 ──
    async function loadRoomList() {
      const el = document.getElementById('chatroom-items');
      try {
        const rooms = await api.get('/chatrooms', true);
        if (!rooms?.length) {
          el.innerHTML = `<div style="padding:30px 20px;text-align:center;color:var(--text3);font-size:0.875rem">
            채팅방이 없습니다.<br>멘토링 신청 후 채팅이 활성화됩니다.
          </div>`;
          return;
        }
        el.innerHTML = rooms.map(r => `
          <div class="chatroom-item" id="room-item-${r.roomId}" onclick="openRoom(${r.roomId},'${r.partnerName||'상대방'}')">
            <div class="chatroom-avatar">${(r.partnerName||'?').charAt(0)}</div>
            <div class="chatroom-info">
              <div class="chatroom-name">${r.partnerName || '상대방'}</div>
              <div class="chatroom-preview">${r.lastMessage || '대화를 시작하세요'}</div>
            </div>
            <div class="chatroom-meta">
              <span class="chatroom-time">${formatDate(r.lastMessageAt)}</span>
              ${r.unreadCount > 0 ? `<span class="unread-badge">${r.unreadCount}</span>` : ''}
            </div>
          </div>
        `).join('');

        // URL에 mentorshipId가 있으면 해당 방 자동 생성/입장
        if (initMentorshipId) {
          createOrJoinRoom(initMentorshipId);
        }
      } catch {
        el.innerHTML = '<div style="padding:20px;color:var(--error);font-size:0.875rem">채팅방 목록을 불러오지 못했습니다</div>';
      }
    }

    async function createOrJoinRoom(mentorshipId) {
      try {
        const room = await api.post(`/chatrooms?mentorshipId=${mentorshipId}`, {}, true);
        await loadRoomList(); // 목록 갱신
        openRoom(room.roomId, room.partnerName || '상대방');
      } catch (e) {
        Toast.error(e.message || '채팅방 생성 실패');
      }
    }

    async function openRoom(roomId, partnerName) {
      currentRoomId = roomId;
      msgPage = 0;

      // 목록 활성화
      document.querySelectorAll('.chatroom-item').forEach(i => i.classList.remove('active'));
      document.getElementById(`room-item-${roomId}`)?.classList.add('active');

      // UI 전환
      document.getElementById('chat-placeholder').style.display = 'none';
      const chatUi = document.getElementById('chat-ui');
      chatUi.style.display = 'flex';

      // 헤더 렌더링
      document.getElementById('chat-header').innerHTML = `
        <div class="chat-partner-avatar">${partnerName.charAt(0)}</div>
        <div>
          <div class="chat-partner-name">${partnerName}</div>
          <div class="chat-partner-sub">1:1 멘토링 채팅</div>
        </div>
        <div class="chat-header-actions">
          <button class="nc-btn nc-btn--sm nc-btn--outline" onclick="leaveRoom(${roomId})">나가기</button>
        </div>
      `;

      document.getElementById('chat-input-area').style.display = 'block';
      loadMessages(roomId);
      connectWS(roomId);
    }

    async function loadMessages(roomId, page = 0) {
      if (isLoadingMore) return;
      isLoadingMore = true;
      const el = document.getElementById('chat-messages');

      if (page === 0) {
        el.innerHTML = '<div class="nc-loading" style="justify-content:center;display:flex;padding:30px"><div class="nc-spinner"></div></div>';
      }

      try {
        const res = await api.get(`/chatrooms/${roomId}/messages?page=${page}&size=30`, true);
        const msgs = (res.content || []).reverse(); // 최신→오래된 순 반전
        const total = res.totalPages || 0;

        if (page === 0) {
          el.innerHTML = msgs.length ? '' : '<div class="msg-system">대화를 시작해보세요 👋</div>';
        }

        const fragment = document.createDocumentFragment();
        msgs.forEach(m => {
          const isMine = m.senderId === myUser?.id || m.senderName === myUser?.nickname;
          fragment.appendChild(buildMsgEl(m, isMine));
        });

        if (page === 0) {
          el.appendChild(fragment);
          el.scrollTop = el.scrollHeight;
        } else {
          const prevHeight = el.scrollHeight;
          el.insertBefore(fragment, el.firstChild);
          el.scrollTop = el.scrollHeight - prevHeight;
        }

        // 스크롤 상단에서 더보기
        if (page < total - 1) {
          el.addEventListener('scroll', () => {
            if (el.scrollTop < 80 && !isLoadingMore) {
              msgPage++;
              loadMessages(roomId, msgPage);
            }
          }, { once: true });
        }
      } catch {
        if (page === 0) el.innerHTML = '<div class="msg-system">메시지를 불러오지 못했습니다</div>';
      } finally {
        isLoadingMore = false;
      }
    }

    function buildMsgEl(msg, isMine) {
      const div = document.createElement('div');
      div.className = `msg-row ${isMine ? 'mine' : ''}`;
      div.innerHTML = `
        ${!isMine ? `<div class="msg-avatar">${(msg.senderName||'?').charAt(0)}</div>` : ''}
        <div class="msg-content">
          ${!isMine ? `<div class="msg-name">${msg.senderName || ''}</div>` : ''}
          <div class="msg-bubble ${isMine ? 'mine' : 'other'}">${escapeHtml(msg.content)}</div>
          <div class="msg-time">${formatMsgTime(msg.createdAt)}</div>
        </div>
      `;
      return div;
    }

    function appendMessage(msg, scroll = true) {
      const el = document.getElementById('chat-messages');
      const isMine = msg.senderId === myUser?.id || msg.senderName === myUser?.nickname;
      el.appendChild(buildMsgEl(msg, isMine));
      if (scroll) el.scrollTop = el.scrollHeight;
    }

    function appendSystemMsg(text) {
      const el = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    function handleReadEvent(data) {
      // 읽음 처리 UI (필요시 구현)
    }

    // ── 메시지 전송 ──
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content || !currentRoomId) return;

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      input.value = '';
      autoResize(input);

      // 즉시 화면에 표시 (Optimistic UI)
      appendMessage({
        senderId: myUser?.id,
        senderName: myUser?.nickname,
        content,
        createdAt: new Date().toISOString(),
      }, true);

      try {
        if (ws && ws.readyState === WebSocket.OPEN) {
          // WebSocket으로 전송 (STOMP 방식)
          ws.send(JSON.stringify({
            type: 'SEND',
            roomId: currentRoomId,
            content,
            senderId: myUser?.id,
          }));
        } else {
          Toast.info('연결이 끊겼습니다. 재연결 중...');
          connectWS(currentRoomId);
        }
      } catch {
        Toast.error('전송 실패');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    async function leaveRoom(roomId) {
      if (!confirm('채팅방에서 나가시겠습니까?')) return;
      try {
        await api.delete(`/chatrooms/${roomId}/leave`, true);
        Toast.success('채팅방에서 나갔습니다');
        if (ws) { ws.close(); ws = null; }
        currentRoomId = null;
        document.getElementById('chat-ui').style.display = 'none';
        document.getElementById('chat-placeholder').style.display = 'flex';
        loadRoomList();
      } catch (e) { Toast.error(e.message || '나가기 실패'); }
    }

    function handleInputKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function escapeHtml(text) {
      return (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    function formatMsgTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const h = d.getHours(), m = d.getMinutes();
      return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(m).padStart(2,'0')}`;
    }

    document.addEventListener('DOMContentLoaded', loadRoomList);
  </script>
</body>
</html>
