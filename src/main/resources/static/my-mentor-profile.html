<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 멘토 프로필 - NovelCraft</title>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <script src="/common.js"></script>
  <style>
    /* ── 네비게이션 ── */
    .nc-point-btn {
      padding: 5px 14px; border-radius: 20px;
      background: linear-gradient(135deg,rgba(240,200,66,.18),rgba(240,200,66,.08));
      border: 1px solid rgba(240,200,66,.4); color: var(--accent);
      font-size: .82rem; font-weight: 700; cursor: pointer;
      transition: all .2s; white-space: nowrap; font-family: inherit;
    }
    .nc-point-btn:hover { background: rgba(240,200,66,.25); border-color: var(--accent); }
    .nc-user-menu { position: relative; }
    .nc-user-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px; min-width: 140px; z-index: 200;
      display: none; flex-direction: column; gap: 2px;
    }
    .nc-user-dropdown.open { display: flex; }
    .nc-user-dropdown button {
      background: none; border: none; color: var(--text2); font-size: .85rem;
      padding: 8px 12px; text-align: left; border-radius: 6px;
      cursor: pointer; font-family: inherit;
    }
    .nc-user-dropdown button:hover { background: var(--surface); color: var(--text1); }

    /* ── 포인트 모달 ── */
    .point-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .point-opt {
      padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; cursor: pointer; transition: all .2s;
      text-align: center; font-family: inherit; color: var(--text2);
    }
    .point-opt:hover { border-color: var(--primary); }
    .point-opt.selected { border-color: var(--primary); background: rgba(124,90,240,.1); color: var(--primary-light); }
    .point-opt__amount { font-size: 1rem; font-weight: 700; }
    .point-opt__price  { font-size: .78rem; color: var(--text3); margin-top: 3px; }
    .point-opt.selected .point-opt__price { color: var(--primary-light); opacity: .8; }

    /* ── 레이아웃 ── */
    body { background: var(--bg); color: var(--text1); font-family: var(--font-sans); }
    .page-wrap { max-width: 720px; margin: 0 auto; padding: 88px 20px 60px; }

    /* ── 헤더 ── */
    .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .back-btn {
      background: none; border: none; color: var(--text3);
      font-size: .85rem; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 4px; padding: 0; transition: color .15s;
    }
    .back-btn:hover { color: var(--text1); }
    .page-title { font-family: 'Noto Serif KR', serif; font-size: 1.45rem; font-weight: 700; }

    /* ── 프로필 히어로 카드 ── */
    .profile-hero {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 28px 24px; display: flex; align-items: center; gap: 20px;
      margin-bottom: 16px; position: relative; overflow: hidden;
    }
    .profile-hero::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary), #a78bfa);
    }
    .hero-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .hero-info { flex: 1; min-width: 0; }
    .hero-name  { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge-approved { background: rgba(163,207,107,.15); color: #7eb356; border: 1px solid rgba(163,207,107,.3); }
    .badge-pending  { background: rgba(251,191,36,.15);  color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }
    .badge-rejected { background: rgba(248,113,113,.12); color: #f87171; border: 1px solid rgba(248,113,113,.3); }
    .status-chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700; }
    .level-chip  {
      display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700;
      background: rgba(124,90,240,.15); color: var(--primary-light); border: 1px solid rgba(124,90,240,.3);
    }
    .hero-dates { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .hero-date-item { font-size: .72rem; color: var(--text3); white-space: nowrap; }
    .hero-date-item strong { color: var(--text2); font-weight: 600; }

    /* ── 섹션 ── */
    .section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
    }
    .section__title {
      font-size: .72rem; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px;
    }
    .section__body { font-size: .9rem; color: var(--text2); line-height: 1.75; }
    .section__body--empty { color: var(--text3); font-style: italic; font-size: .85rem; }

    /* ── 소개 textarea ── */
    .bio-textarea {
      width: 100%; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text1); font-family: var(--font-sans); font-size: .9rem;
      line-height: 1.75; padding: 12px 14px; resize: vertical; min-height: 100px;
      transition: border-color .2s;
    }
    .bio-textarea:focus { outline: none; border-color: var(--primary); }
    .bio-char-count { font-size: .75rem; color: var(--text3); text-align: right; margin-top: 6px; }
    .bio-char-count.warn { color: #f87171; }

    /* ── 칩 선택기 ── */
    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 6px 16px; border-radius: 20px; font-size: .82rem; font-weight: 500;
      cursor: pointer; user-select: none; transition: all .18s;
      border: 1px solid var(--border); background: var(--bg); color: var(--text3);
    }
    .chip:hover { border-color: var(--text2); color: var(--text2); }

    /* 장르 — 파란 계열 */
    .chip--genre.chip--on {
      background: rgba(59,130,246,.15); color: #60a5fa;
      border-color: rgba(59,130,246,.5);
    }
    /* 전문분야 — 보라 계열 */
    .chip--field.chip--on {
      background: rgba(124,90,240,.15); color: var(--primary-light);
      border-color: rgba(124,90,240,.5);
    }
    /* 멘토링 스타일 — 초록 계열 */
    .chip--style.chip--on {
      background: rgba(52,211,153,.15); color: #34d399;
      border-color: rgba(52,211,153,.5);
    }

    /* ── 그리드 정보 ── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .info-cell__label { font-size: .72rem; color: var(--text3); margin-bottom: 4px; }
    .info-cell__value { font-size: .9rem; font-weight: 600; color: var(--text1); }
    .info-cell__value--on  { color: #34d399; }
    .info-cell__value--off { color: var(--text3); }

    /* ── 경력 박스 ── */
    .career-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; font-size: .88rem; color: var(--text2); line-height: 1.65;
    }

    /* ── 하단 버튼 ── */
    .bottom-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .btn-main {
      padding: 14px; border-radius: 12px;
      background: var(--primary); border: none; color: white;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: opacity .2s;
    }
    .btn-main:hover   { opacity: .88; }
    .btn-main:disabled { opacity: .5; cursor: not-allowed; }
    .btn-sub {
      padding: 13px; border-radius: 12px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); font-size: .9rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .btn-sub:hover { border-color: var(--primary); color: var(--primary-light); }

    /* ── 로딩 ── */
    .loading-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 80px 0; color: var(--text3);
    }
    .loading-wrap::before {
      content: ''; width: 22px; height: 22px;
      border: 2px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 540px) {
      .info-grid { grid-template-columns: 1fr; }
      .hero-dates { display: none; }
    }
  </style>
</head>
<body>
<nav id="nc-nav"></nav>

<div class="page-wrap">
  <div class="page-header">
    <button class="back-btn" onclick="window.location.href='/mentor-dashboard.html'">← 대시보드</button>
    <h1 class="page-title">나의 멘토 프로필</h1>
  </div>
  <div id="content">
    <div class="loading-wrap">불러오는 중</div>
  </div>
</div>

<!-- 포인트 충전 모달 -->
<div class="nc-modal" id="modal-point">
  <div class="nc-modal__backdrop" onclick="Modal.close('modal-point')"></div>
  <div class="nc-modal__box">
    <button class="nc-modal__close" onclick="Modal.close('modal-point')">✕</button>
    <div class="nc-modal__title">💎 포인트 충전</div>
    <div style="margin-bottom:16px">
      <div style="font-size:.82rem;color:var(--text3);margin-bottom:12px">충전할 포인트를 선택하세요</div>
      <div class="point-options" id="point-options">
        <button class="point-opt selected" data-amount="1000"><div class="point-opt__amount">1,000P</div><div class="point-opt__price">₩1,000</div></button>
        <button class="point-opt" data-amount="5000"><div class="point-opt__amount">5,000P</div><div class="point-opt__price">₩5,000</div></button>
        <button class="point-opt" data-amount="10000"><div class="point-opt__amount">10,000P</div><div class="point-opt__price">₩10,000</div></button>
        <button class="point-opt" data-amount="30000"><div class="point-opt__amount">30,000P</div><div class="point-opt__price">₩30,000</div></button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:12px 14px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)">
      <span style="font-size:.85rem;color:var(--text3)">현재 잔여 포인트</span>
      <span style="font-weight:700;color:var(--accent)" id="modal-current-point">-</span>
    </div>
    <button class="nc-btn nc-btn--primary nc-btn--full" onclick="chargePoint()">충전하기</button>
  </div>
</div>

<script>
  /* ── 라벨 매핑 ── */
  const GENRE_LABELS = {
    FANTASY:'판타지', ROMANCE_FANTASY:'로판', MODERN:'현대', CHIVALROUS:'무협',
    BL:'BL', SF:'SF', HORROR:'호러', CLASSIC:'고전', DAILY_LIFE:'일상',
  };
  const CAREER_LABELS = {
    INTRODUCTION:'입문', ELEMENTARY:'초급', INTERMEDIATE:'중급', PROFICIENT:'숙련',
  };
  const CAREER_FULL = {
    INTRODUCTION:'입문 멘토', ELEMENTARY:'초급 멘토',
    INTERMEDIATE:'중급 멘토', PROFICIENT:'전문 멘토',
  };
  const STATUS_LABEL = { APPROVED:'승인됨', PENDING:'검토 중', REJECTED:'반려됨' };
  const STATUS_CLS   = { APPROVED:'badge-approved', PENDING:'badge-pending', REJECTED:'badge-rejected' };

  /* 전문 분야 / 멘토링 스타일 전체 옵션 (대시보드와 동일한 목록) */
  const FIELD_OPTIONS = ['세계관 구축','캐릭터 설계','문장력','플롯 구성','대화문','감정 묘사','독자 소통','장르 이해'];
  const STYLE_OPTIONS = ['피드백 중심','대화형','원고 분석','작업 일정 관리','심리 지원'];

  /* ── 선택 상태 (mutable) ── */
  let selGenres = [];
  let selFields = [];
  let selStyles = [];
  let profileData = null; // 전체 프로필 캐시 (저장 시 나머지 필드 유지용)

  /* ── 초기화 ── */
  async function init() {
    if (!Auth.isLoggedIn()) {
      window.location.href = `/login.html?redirect=${encodeURIComponent(location.pathname)}`;
      return;
    }
    initNav();
    await loadProfile();
  }

  /* ── 네비게이션 ── */
  function initNav() {
    const nav  = document.getElementById('nc-nav');
    const user = Auth.getUser();
    if (!nav) return;
    nav.innerHTML = `
      <div class="nc-nav__inner">
        <a href="/index.html" class="nc-nav__logo"><span class="logo-icon">✦</span>NovelCraft</a>
        <div class="nc-nav__right">
          ${user ? `
            <button class="nc-point-btn" id="nav-point" onclick="openPointModal()">···P</button>
            <button class="nc-nav__btn" onclick="location.href='/library.html'">내 서재</button>
            <button class="nc-nav__btn nc-nav__btn--mentee" onclick="location.href='/mentor-list.html'">멘티</button>
            <button class="nc-nav__btn nc-nav__btn--mentor" onclick="location.href='/mentor-dashboard.html'">멘토</button>
            <div class="nc-user-menu">
              <button class="nc-nav__btn" onclick="toggleUserMenu()" style="font-weight:600;user-select:none">
                ${esc(user.nickname || '내 계정')} ▾
              </button>
              <div class="nc-user-dropdown" id="user-dropdown">
                <button onclick="location.href='/mypage.html'">마이페이지</button>
                <button onclick="doLogout()">로그아웃</button>
              </div>
            </div>
          ` : `
            <button class="nc-nav__btn" onclick="location.href='/login.html'">로그인</button>
            <button class="nc-nav__btn nc-nav__btn--primary" onclick="location.href='/signup.html'">회원가입</button>
          `}
        </div>
      </div>`;
    loadPoint();
  }
  function toggleUserMenu() { document.getElementById('user-dropdown')?.classList.toggle('open'); }
  document.addEventListener('click', e => {
    const m = document.getElementById('user-dropdown');
    if (m?.classList.contains('open') && !e.target.closest('.nc-user-menu')) m.classList.remove('open');
  });
  async function doLogout() {
    try { await api.post('/auth/logout', {}, true); } catch {}
    Auth.logout(); location.href = '/index.html';
  }
  async function loadPoint() {
    try {
      const d = await api.get('/points/balance', true);
      const el = document.getElementById('nav-point');
      if (el) el.textContent = `${(d?.data?.balance ?? d?.balance ?? 0).toLocaleString()}P`;
    } catch {}
  }

  /* ── 프로필 로드 ── */
  async function loadProfile() {
    const wrap = document.getElementById('content');
    try {
      const [profileRes, statusRes] = await Promise.allSettled([
        api.get('/mentors/me',        true),
        api.get('/mentors/me/status', true),
      ]);

      const p = profileRes.status === 'fulfilled' ? (profileRes.value?.data || profileRes.value) : null;
      const s = statusRes.status  === 'fulfilled' ? (statusRes.value?.data  || statusRes.value)  : null;

      if (!p) {
        wrap.innerHTML = `<div style="text-align:center;padding:60px 0;color:var(--text3)">
          <div style="font-size:2rem;margin-bottom:12px">📋</div>
          <div>멘토 프로필을 찾을 수 없습니다</div>
          <button onclick="location.href='/mentor-dashboard.html'" class="nc-btn nc-btn--primary" style="margin-top:16px">대시보드로</button>
        </div>`;
        return;
      }

      profileData = p;
      selGenres = Array.isArray(p.mainGenres)    ? [...p.mainGenres]    : [];
      selFields = Array.isArray(p.specialFields) ? [...p.specialFields] : [];
      selStyles = Array.isArray(p.mentoringStyles)? [...p.mentoringStyles]: [];

      const user       = Auth.getUser();
      const nickname   = user?.nickname || '멘토';
      const status     = p.status || s?.status || 'PENDING';
      const appliedAt  = s?.appliedAt  || null;
      const approvedAt = s?.approvedAt || null;

      render(wrap, p, { nickname, status, appliedAt, approvedAt });
    } catch {
      wrap.innerHTML = `<div style="text-align:center;padding:60px 0;color:var(--text3)">
        <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
        <div>불러오는 중 오류가 발생했습니다</div>
        <button onclick="loadProfile()" class="nc-btn nc-btn--primary" style="margin-top:16px">다시 시도</button>
      </div>`;
    }
  }

  /* ── 렌더 ── */
  function render(wrap, p, { nickname, status, appliedAt, approvedAt }) {
    const initial   = nickname.charAt(0).toUpperCase();
    const careerTxt = CAREER_FULL[p.careerLevel] || p.careerLevel || '-';
    const statusTxt = STATUS_LABEL[status] || status;
    const statusCls = STATUS_CLS[status]   || 'badge-pending';

    wrap.innerHTML = `
      <!-- 프로필 헤더 -->
      <div class="profile-hero">
        <div class="hero-avatar">${esc(initial)}</div>
        <div class="hero-info">
          <div class="hero-name">${esc(nickname)}</div>
          <div class="hero-badges">
            <span class="level-chip">${esc(careerTxt)}</span>
            <span class="status-chip ${statusCls}">${esc(statusTxt)}</span>
          </div>
        </div>
        <div class="hero-dates">
          <div class="hero-date-item">신청일 <strong>${fmtDate(appliedAt)}</strong></div>
          ${approvedAt ? `<div class="hero-date-item">승인일 <strong>${fmtDate(approvedAt)}</strong></div>` : ''}
        </div>
      </div>

      <!-- 멘토 소개 (editable) -->
      <div class="section">
        <div class="section__title">멘토 소개</div>
        <textarea id="bio-input" class="bio-textarea"
          maxlength="500"
          placeholder="멘토로서의 경험과 강점을 소개해 주세요 (10~500자)"
          oninput="updateBioCount()"
        >${esc(p.introduction || '')}</textarea>
        <div class="bio-char-count" id="bio-count">${(p.introduction||'').length} / 500</div>
      </div>

      <!-- 주력 장르 -->
      <div class="section">
        <div class="section__title">주력 장르 <span style="color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(1개 이상 선택)</span></div>
        <div class="chip-grid" id="genre-chips">
          ${Object.entries(GENRE_LABELS).map(([v, l]) => `
            <button class="chip chip--genre${selGenres.includes(v) ? ' chip--on' : ''}"
                    data-val="${v}"
                    onclick="toggleChip('genre','${v}',this)">${l}</button>
          `).join('')}
        </div>
      </div>

      <!-- 전문 분야 -->
      <div class="section">
        <div class="section__title">전문 분야 <span style="color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(2개 이상 선택)</span></div>
        <div class="chip-grid" id="field-chips">
          ${FIELD_OPTIONS.map(f => `
            <button class="chip chip--field${selFields.includes(f) ? ' chip--on' : ''}"
                    data-val="${f}"
                    onclick="toggleChip('field','${f}',this)">${f}</button>
          `).join('')}
        </div>
      </div>

      <!-- 멘토링 스타일 -->
      <div class="section">
        <div class="section__title">멘토링 스타일 <span style="color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(1개 이상 선택)</span></div>
        <div class="chip-grid" id="style-chips">
          ${STYLE_OPTIONS.map(s => `
            <button class="chip chip--style${selStyles.includes(s) ? ' chip--on' : ''}"
                    data-val="${s}"
                    onclick="toggleChip('style','${s}',this)">${s}</button>
          `).join('')}
        </div>
      </div>

      <!-- 운영 정보 (읽기 전용) -->
      <div class="section">
        <div class="section__title">운영 정보</div>
        <div class="info-grid">
          <div class="info-cell">
            <div class="info-cell__label">집필 경력 등급</div>
            <div class="info-cell__value">${esc(careerTxt)}</div>
          </div>
          <div class="info-cell">
            <div class="info-cell__label">최대 멘티 수</div>
            <div class="info-cell__value">${p.maxMentees ?? '-'}명</div>
          </div>
          <div class="info-cell">
            <div class="info-cell__label">즉시 수락 (자동승인)</div>
            <div class="info-cell__value ${p.allowInstant ? 'info-cell__value--on' : 'info-cell__value--off'}">
              ${p.allowInstant ? '사용 중 (자동)' : '미사용 (수동)'}
            </div>
          </div>
        </div>
      </div>

      <!-- 수상·출간 경력 -->
      ${p.careerHistory ? `
      <div class="section">
        <div class="section__title">수상 · 출간 경력</div>
        <div class="career-box">${esc(p.careerHistory)}</div>
      </div>` : ''}

      <!-- 환영하는 멘티 유형 -->
      ${p.preferredMenteeDesc ? `
      <div class="section">
        <div class="section__title">환영하는 멘티 유형</div>
        <div class="section__body">${esc(p.preferredMenteeDesc)}</div>
      </div>` : ''}

      <!-- 하단 버튼 -->
      <div class="bottom-btns">
        <button class="btn-main" id="save-btn" onclick="saveProfile()">
          프로필 수정하기
        </button>
        <button class="btn-sub" onclick="location.href='/mentor-dashboard.html'">
          멘토링 현황 페이지로 돌아가기
        </button>
      </div>`;
  }

  /* ── 칩 토글 ── */
  function toggleChip(type, value, el) {
    const map = { genre: selGenres, field: selFields, style: selStyles };
    const arr = map[type];
    const idx = arr.indexOf(value);
    if (idx === -1) {
      arr.push(value);
      el.classList.add('chip--on');
    } else {
      arr.splice(idx, 1);
      el.classList.remove('chip--on');
    }
  }

  /* ── bio 글자 수 카운터 ── */
  function updateBioCount() {
    const ta  = document.getElementById('bio-input');
    const cnt = document.getElementById('bio-count');
    if (!ta || !cnt) return;
    const len = ta.value.length;
    cnt.textContent = `${len} / 500`;
    cnt.classList.toggle('warn', len > 480);
  }

  /* ── 저장 ── */
  async function saveProfile() {
    const bio = document.getElementById('bio-input')?.value?.trim() || '';

    if (bio && bio.length < 10) {
      Toast.error('멘토 소개는 10자 이상 입력해 주세요');
      return;
    }
    if (selGenres.length === 0) {
      Toast.error('주력 장르를 1개 이상 선택해 주세요');
      return;
    }
    if (selFields.length < 2) {
      Toast.error('전문 분야를 2개 이상 선택해 주세요');
      return;
    }
    if (selStyles.length === 0) {
      Toast.error('멘토링 스타일을 1개 이상 선택해 주세요');
      return;
    }

    const saveBtn = document.getElementById('save-btn');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }

    try {
      const body = {
        introduction:     bio || null,
        mainGenres:       selGenres,
        specialFields:    selFields,
        mentoringStyles:  selStyles,
        careerHistory:    profileData?.careerHistory    ?? null,
        maxMentees:       profileData?.maxMentees       ?? null,
        allowInstant:     profileData?.allowInstant     ?? null,
        preferredMenteeDesc: profileData?.preferredMenteeDesc ?? null,
      };

      await api.put('/mentors/me', body, true);
      Toast.success('프로필이 성공적으로 수정되었습니다!');

      /* 캐시 업데이트 */
      profileData = { ...profileData, introduction: bio,
        mainGenres: [...selGenres], specialFields: [...selFields],
        mentoringStyles: [...selStyles] };
    } catch (e) {
      Toast.error(e?.message || '수정 중 오류가 발생했습니다.');
    } finally {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '프로필 수정하기'; }
    }
  }

  /* ── 유틸 ── */
  function fmtDate(dt) {
    if (!dt) return '-';
    const d = new Date(dt);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── 포인트 충전 ── */
  const PORTONE_STORE_ID    = 'store-6dd586c4-bbae-4fc5-a1b1-920f1850b300';
  const PORTONE_CHANNEL_KEY = 'channel-key-70f0f4c2-74c5-4c38-b275-c2c01e2c3660';
  let selectedPointAmt = 1000;

  function initPointOptions() {
    document.querySelectorAll('.point-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.point-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedPointAmt = parseInt(btn.dataset.amount);
      });
    });
  }
  function openPointModal() {
    api.get('/points/balance', true).then(d => {
      const el = document.getElementById('modal-current-point');
      if (el) el.textContent = `${(d?.data?.balance ?? d?.balance ?? 0).toLocaleString()}P`;
    }).catch(() => {});
    initPointOptions();
    Modal.open('modal-point');
  }
  async function chargePoint() {
    if (!Auth.isLoggedIn()) { location.href = '/login.html'; return; }
    try {
      const [prepare, meInfo] = await Promise.all([
        api.post('/payments/prepare', { amount: selectedPointAmt }, true),
        api.get('/auth/users/me', true),
      ]);
      const paymentKey = prepare?.data?.paymentKey ?? prepare?.paymentKey;
      const phoneNo    = (meInfo?.data?.phoneNo ?? meInfo?.phoneNo ?? '').replace(/-/g,'');
      Modal.close('modal-point');
      Toast.info('결제창을 불러오는 중...');
      const me = Auth.getUser();
      const portoneRes = await PortOne.requestPayment({
        storeId: PORTONE_STORE_ID, channelKey: PORTONE_CHANNEL_KEY,
        paymentId: paymentKey,
        orderName: `NovelCraft ${selectedPointAmt.toLocaleString()}P 포인트 충전`,
        totalAmount: selectedPointAmt, currency: 'CURRENCY_KRW', payMethod: 'CARD',
        customer: { fullName: me?.nickname||'구매자', phoneNumber: phoneNo,
                    ...(me?.email?{email:me.email}:{}) },
      });
      if (portoneRes.code) { Toast.error(`결제 실패: ${portoneRes.message}`); return; }
      await api.post('/payments/confirm', { paymentId: portoneRes.paymentId, amount: selectedPointAmt }, true);
      Toast.success(`${selectedPointAmt.toLocaleString()}P가 충전되었습니다!`);
      loadPoint();
    } catch (e) { Toast.error(e?.message || '충전 중 오류가 발생했습니다.'); }
  }

  /* ── 시작 ── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
