<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 회차 읽기</title>
  <script src="/common.js"></script>
  <style>
    #nc-nav { display: none; }
    body { background: var(--bg); }

    /* 리더 네비게이션 */
    .reader-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,19,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 54px;
    }
    .reader-nav__back { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.1rem; padding: 8px; }
    .reader-nav__back:hover { color: var(--text); }
    .reader-nav__title { flex: 1; font-size: 0.875rem; font-weight: 600; truncate; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reader-nav__ep { font-size: 0.8rem; color: var(--text3); white-space: nowrap; }
    .reader-nav__right { display: flex; align-items: center; gap: 8px; }
    .reader-btn {
      padding: 6px 14px; border-radius: 8px; background: transparent;
      border: 1px solid var(--border); color: var(--text2);
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .reader-btn:hover { background: var(--surface); color: var(--text); }
    .reader-btn--primary { background: var(--primary); border-color: var(--primary); color: white; }
    .reader-btn--primary:hover { background: var(--primary-dark); }

    /* 리더 본문 */
    .reader-wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
    .reader-ep-header { text-align: center; margin-bottom: 48px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }
    .reader-ep-num { font-size: 0.875rem; color: var(--text3); margin-bottom: 8px; }
    .reader-ep-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.8rem; font-weight: 900; line-height: 1.4; margin-bottom: 16px;
    }
    .reader-ep-meta { font-size: 0.8rem; color: var(--text3); }

    .reader-content {
      font-family: 'Noto Serif KR', serif;
      font-size: 1rem; line-height: 2; color: var(--text);
      letter-spacing: 0.01em; white-space: pre-wrap;
    }

    /* 폰트 설정 패널 */
    .reader-settings {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      margin-bottom: 24px; display: none;
    }
    .reader-settings.visible { display: block; }
    .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .settings-label { font-size: 0.8rem; color: var(--text3); min-width: 70px; }
    .font-btn {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--text2); cursor: pointer; font-size: 0.8rem;
      transition: all 0.15s;
    }
    .font-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
    input[type=range] { flex: 1; accent-color: var(--primary); }

    /* 하단 내비 */
    .reader-footer {
      border-top: 1px solid var(--border); padding: 32px 0;
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 48px;
    }

    /* 댓글 섹션 */
    .comment-section {
      max-width: 720px; margin: 0 auto; padding: 0 24px 60px;
    }
    .comment-form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 24px;
    }
    .comment-textarea {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.9rem; resize: none; min-height: 80px; line-height: 1.6;
    }
    .comment-form__bottom { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .comment-item {
      display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border);
    }
    .comment-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; flex-shrink: 0;
    }
    .comment-body { flex: 1; }
    .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .comment-nick { font-weight: 600; font-size: 0.875rem; }
    .comment-date { font-size: 0.72rem; color: var(--text3); }
    .comment-text { font-size: 0.875rem; color: var(--text2); line-height: 1.6; }
    .comment-actions { margin-top: 8px; display: flex; gap: 12px; }
    .comment-action {
      background: none; border: none; color: var(--text3); font-size: 0.75rem; cursor: pointer;
      padding: 2px 0; transition: color 0.15s; font-family: inherit;
    }
    .comment-action:hover { color: var(--text); }

    /* 좋아요 플로팅 */
    .like-float {
      position: fixed; bottom: 100px; right: 24px; z-index: 50;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .like-float-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--surface2); border: 2px solid var(--border);
      font-size: 1.4rem; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .like-float-btn:hover { border-color: var(--error); transform: scale(1.1); }
    .like-float-btn.liked { background: rgba(239,68,68,0.15); border-color: var(--error); }
    .like-count { font-size: 0.75rem; color: var(--text3); font-weight: 600; }

    /* 댓글 사이드바 토글 */
    .comment-toggle {
      position: fixed; bottom: 40px; right: 24px; z-index: 50;
    }
    .comment-toggle-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--surface2); border: 2px solid var(--border);
      font-size: 1.2rem; cursor: pointer; transition: all 0.2s;
    }
    .comment-toggle-btn:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <!-- 리더 네비 -->
  <div class="reader-nav">
    <button class="reader-nav__back" onclick="history.back()">←</button>
    <div class="reader-nav__title" id="reader-title">로딩 중...</div>
    <span class="reader-nav__ep" id="reader-ep-num"></span>
    <div class="reader-nav__right">
      <button class="reader-btn" onclick="toggleSettings()">⚙ 설정</button>
      <button class="reader-btn" id="prev-ep-btn" onclick="prevEpisode()" disabled>‹ 이전화</button>
      <button class="reader-btn reader-btn--primary" id="next-ep-btn" onclick="nextEpisode()" disabled>다음화 ›</button>
    </div>
  </div>

  <!-- 독자 설정 패널 -->
  <div style="max-width:720px;margin:0 auto;padding:0 24px">
    <div class="reader-settings" id="reader-settings">
      <div class="settings-row">
        <span class="settings-label">글꼴</span>
        <button class="font-btn active" onclick="setFont('serif',this)">명조체</button>
        <button class="font-btn" onclick="setFont('sans',this)">고딕체</button>
      </div>
      <div class="settings-row">
        <span class="settings-label">글자 크기</span>
        <input type="range" id="font-size-range" min="14" max="24" value="16" oninput="setFontSize(this.value)">
        <span id="font-size-val" style="font-size:0.8rem;color:var(--text3);min-width:32px">16px</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">줄 간격</span>
        <input type="range" id="line-height-range" min="150" max="250" value="200" oninput="setLineHeight(this.value)">
        <span id="line-height-val" style="font-size:0.8rem;color:var(--text3);min-width:36px">2.0</span>
      </div>
    </div>
  </div>

  <!-- 본문 -->
  <div class="reader-wrap">
    <div class="reader-ep-header">
      <div class="reader-ep-num" id="ep-num-label"></div>
      <div class="reader-ep-title" id="ep-title">로딩 중...</div>
      <div class="reader-ep-meta" id="ep-meta"></div>
    </div>
    <div class="reader-content" id="reader-content">
      <div class="nc-loading"><div class="nc-spinner"></div></div>
    </div>
    <div class="reader-footer">
      <button class="reader-btn" id="footer-prev" onclick="prevEpisode()">‹ 이전화</button>
      <button class="reader-btn" onclick="scrollTo({top:0,behavior:'smooth'})">▲ 맨 위로</button>
      <button class="reader-btn reader-btn--primary" id="footer-next" onclick="nextEpisode()">다음화 ›</button>
    </div>
  </div>

  <!-- 댓글 섹션 -->
  <div class="comment-section">
    <div class="nc-section-header">
      <div class="nc-section-title">💬 댓글</div>
      <span id="comment-total" style="font-size:0.875rem;color:var(--text3)"></span>
    </div>

    <!-- 댓글 작성 -->
    <div id="comment-form-area">
      <div class="comment-form" id="comment-form" style="display:none">
        <textarea class="comment-textarea" id="comment-input" placeholder="댓글을 입력하세요..." rows="3" maxlength="500"></textarea>
        <div class="comment-form__bottom">
          <span id="comment-char" style="font-size:0.75rem;color:var(--text3)">0/500</span>
          <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="submitComment()">등록</button>
        </div>
      </div>
      <div id="comment-login-prompt" style="padding:16px;text-align:center;color:var(--text3);font-size:0.875rem;display:none">
        <a href="/login.html" style="color:var(--primary-light)">로그인</a>하면 댓글을 작성할 수 있습니다.
      </div>
    </div>

    <div id="comment-list">
      <div class="nc-loading"><div class="nc-spinner"></div></div>
    </div>
    <div class="nc-pagination" id="comment-pagination"></div>
  </div>

  <!-- 좋아요 플로팅 -->
  <div class="like-float">
    <button class="like-float-btn" id="like-btn" onclick="toggleLike()">🤍</button>
    <span class="like-count" id="like-count">0</span>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const episodeId = params.get('id');
    const novelId = params.get('novelId');
    let epData = null;
    let commentPage = 0;
    let liked = false;
    let epList = [];
    let currentEpIndex = -1;

    if (!episodeId) { alert('잘못된 접근입니다'); history.back(); }

    async function loadEpisode() {
      try {
        // V2 API 사용 (Redis 캐싱)
        epData = await api.get(`/v2/episodes/${episodeId}`, Auth.isLoggedIn());
        renderEpisode(epData);
        loadComments();
        loadEpList();
      } catch (e) {
        document.getElementById('reader-content').innerHTML = `
          <div class="nc-empty">
            <div class="nc-empty__icon">🔒</div>
            <div class="nc-empty__text">${e.message || '회차를 불러올 수 없습니다'}</div>
            <br><a href="/novel-detail.html?id=${novelId}" class="nc-btn nc-btn--primary nc-btn--sm">소설 페이지로 돌아가기</a>
          </div>
        `;
      }
    }

    function renderEpisode(ep) {
      document.title = `${ep.title} - NovelCraft`;
      document.getElementById('reader-title').textContent = ep.novelTitle || '소설';
      document.getElementById('reader-ep-num').textContent = `${ep.episodeNumber}화`;
      document.getElementById('ep-num-label').textContent = `${ep.episodeNumber}화`;
      document.getElementById('ep-title').textContent = ep.title;
      document.getElementById('ep-meta').textContent = formatDate(ep.publishedAt);
      document.getElementById('reader-content').textContent = ep.content || '본문이 없습니다.';
      document.getElementById('like-count').textContent = formatNum(ep.likeCount || 0);

      if (ep.isLiked) {
        liked = true;
        document.getElementById('like-btn').textContent = '❤️';
        document.getElementById('like-btn').classList.add('liked');
      }

      // 댓글 폼
      if (Auth.isLoggedIn()) {
        document.getElementById('comment-form').style.display = 'block';
        document.getElementById('comment-input').addEventListener('input', function() {
          document.getElementById('comment-char').textContent = `${this.value.length}/500`;
        });
      } else {
        document.getElementById('comment-login-prompt').style.display = 'block';
      }
    }

    async function loadEpList() {
      try {
        const res = await api.get(`/novels/${novelId}/episodes?page=0&size=100&sort=episodeNumber&direction=ASC`);
        epList = res.content || [];
        currentEpIndex = epList.findIndex(e => String(e.episodeId) === String(episodeId));
        document.getElementById('prev-ep-btn').disabled = currentEpIndex <= 0;
        document.getElementById('next-ep-btn').disabled = currentEpIndex >= epList.length - 1;
        document.getElementById('footer-prev').disabled = currentEpIndex <= 0;
        document.getElementById('footer-next').disabled = currentEpIndex >= epList.length - 1;
      } catch {}
    }

    function prevEpisode() {
      if (currentEpIndex <= 0) return;
      const prev = epList[currentEpIndex - 1];
      window.location.href = `/episode-read.html?id=${prev.episodeId}&novelId=${novelId}`;
    }

    function nextEpisode() {
      if (currentEpIndex >= epList.length - 1) return;
      const next = epList[currentEpIndex + 1];
      window.location.href = `/episode-read.html?id=${next.episodeId}&novelId=${novelId}`;
    }

    async function loadComments(page = 0) {
      commentPage = page;
      const el = document.getElementById('comment-list');
      el.innerHTML = '<div class="nc-loading"><div class="nc-spinner"></div></div>';
      try {
        const res = await api.get(`/episodes/${episodeId}/comments?page=${page}&size=20&sort=createdAt&direction=DESC`);
        const comments = res.content || [];
        const total = res.totalElements || 0;
        document.getElementById('comment-total').textContent = `${total}개`;
        const me = Auth.getUser();

        el.innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${(c.nickname || 'U').charAt(0)}</div>
            <div class="comment-body">
              <div class="comment-header">
                <span class="comment-nick">${c.nickname || '익명'}</span>
                <span class="comment-date">${formatDate(c.createdAt)}</span>
              </div>
              <div class="comment-text">${c.content}</div>
              <div class="comment-actions">
                ${me && me.nickname === c.nickname ? `
                  <button class="comment-action" style="color:var(--error)" onclick="deleteComment(${c.commentId})">삭제</button>
                ` : ''}
              </div>
            </div>
          </div>
        `).join('') || '<div class="nc-empty"><div class="nc-empty__icon">💬</div><div class="nc-empty__text">첫 댓글을 작성해보세요!</div></div>';

        renderCommentPagination(res.totalPages || 0);
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">댓글을 불러올 수 없습니다</div></div>';
      }
    }

    function renderCommentPagination(pages) {
      const el = document.getElementById('comment-pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }
      let html = '';
      if (commentPage > 0) html += `<button class="nc-page-btn" onclick="loadComments(${commentPage-1})">‹</button>`;
      for (let i = Math.max(0, commentPage-2); i <= Math.min(pages-1, commentPage+2); i++) {
        html += `<button class="nc-page-btn ${i===commentPage?'active':''}" onclick="loadComments(${i})">${i+1}</button>`;
      }
      if (commentPage < pages-1) html += `<button class="nc-page-btn" onclick="loadComments(${commentPage+1})">›</button>`;
      el.innerHTML = html;
    }

    async function submitComment() {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      const content = document.getElementById('comment-input').value.trim();
      if (!content) { Toast.error('댓글을 입력하세요'); return; }
      try {
        await api.post(`episodes/${episodeId}/comments`, { content }, true);
        document.getElementById('comment-input').value = '';
        document.getElementById('comment-char').textContent = '0/500';
        Toast.success('댓글이 등록되었습니다!');
        loadComments(0);
      } catch (e) { Toast.error(e.message || '댓글 등록 실패'); }
    }

    async function deleteComment(commentId) {
      if (!confirm('댓글을 삭제하시겠습니까?')) return;
      try {
        await api.delete(`/comments/${commentId}`, true);
        Toast.success('댓글이 삭제되었습니다');
        loadComments(commentPage);
      } catch (e) { Toast.error(e.message || '삭제 실패'); }
    }

    async function toggleLike() {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      try {
        const res = await api.post(`/episodes/${episodeId}/like`, {}, true);
        liked = res.isLiked;
        const btn = document.getElementById('like-btn');
        btn.textContent = liked ? '❤️' : '🤍';
        btn.classList.toggle('liked', liked);
        document.getElementById('like-count').textContent = formatNum(res.likeCount || 0);
        Toast.success(liked ? '좋아요!' : '좋아요 취소');
      } catch (e) { Toast.error(e.message); }
    }

    function toggleSettings() {
      document.getElementById('reader-settings').classList.toggle('visible');
    }

    function setFont(type, btn) {
      const content = document.getElementById('reader-content');
      document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      content.style.fontFamily = type === 'serif' ? "'Noto Serif KR', serif" : "'Noto Sans KR', sans-serif";
    }

    function setFontSize(val) {
      document.getElementById('reader-content').style.fontSize = val + 'px';
      document.getElementById('font-size-val').textContent = val + 'px';
    }

    function setLineHeight(val) {
      const lh = (val / 100).toFixed(1);
      document.getElementById('reader-content').style.lineHeight = lh;
      document.getElementById('line-height-val').textContent = lh;
    }

    document.addEventListener('DOMContentLoaded', loadEpisode);
  </script>
</body>
</html>
