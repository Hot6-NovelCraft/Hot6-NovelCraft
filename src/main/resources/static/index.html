<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 소설의 모든 것</title>
  <script src="/common.js"></script>
  <style>
    /* ── 메인 히어로 ── */
    .hero {
      position: relative; overflow: hidden;
      background: linear-gradient(160deg, #0f0f13 0%, #1a1025 50%, #0f1318 100%);
      padding: 80px 0 60px;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,90,240,0.15) 0%, transparent 70%);
    }
    .hero__inner {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr 280px; gap: 40px; align-items: start;
    }
    .hero__left {}
    .hero__label {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      background: rgba(124,90,240,0.2); border: 1px solid rgba(124,90,240,0.4);
      color: #9b7ef8; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    /* ── AI 추천 배너 ── */
    .ai-rec {
      background: linear-gradient(135deg, rgba(124,90,240,0.12), rgba(240,104,66,0.08));
      border: 1px solid rgba(124,90,240,0.25); border-radius: 16px;
      padding: 20px 24px; margin-bottom: 32px;
    }
    .ai-rec__title {
      font-size: 0.8rem; font-weight: 700; color: #9b7ef8;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .ai-rec__scroll {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none;
    }
    .ai-rec__scroll::-webkit-scrollbar { display: none; }
    .ai-rec__item {
      flex-shrink: 0; width: 120px; cursor: pointer; transition: transform 0.2s;
    }
    .ai-rec__item:hover { transform: translateY(-4px); }
    .ai-rec__cover {
      width: 120px; height: 170px; border-radius: 10px;
      background: linear-gradient(135deg, #1e1e2a, #252535);
      border: 1px solid #2a2a3a; display: flex; align-items: center;
      justify-content: center; font-size: 2rem; margin-bottom: 8px;
      overflow: hidden;
    }
    .ai-rec__cover img { width: 100%; height: 100%; object-fit: cover; }
    .ai-rec__name { font-size: 0.75rem; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ai-rec__author { font-size: 0.7rem; color: #6a6a80; margin-top: 2px; }

    /* ── 장르 탭 ── */
    .genre-tabs {
      display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .genre-tab {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid #2a2a3a; background: transparent;
      color: #a0a0b8; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .genre-tab:hover { border-color: #7c5af0; color: #9b7ef8; }
    .genre-tab.active {
      background: #7c5af0; border-color: #7c5af0; color: white;
    }

    /* ── 주간 랭킹 리스트 ── */
    .ranking-list { display: flex; flex-direction: column; gap: 12px; }
    .ranking-item {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 16px; border-radius: 12px;
      background: #16161d; border: 1px solid #2a2a3a;
      cursor: pointer; transition: all 0.2s;
    }
    .ranking-item:hover { border-color: rgba(124,90,240,0.4); background: #1e1e2a; }
    .ranking-num {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.4rem; font-weight: 900; color: #2a2a3a;
      min-width: 32px; text-align: center;
    }
    .ranking-num.top3 { color: #7c5af0; }
    .ranking-cover {
      width: 48px; height: 68px; border-radius: 6px;
      background: linear-gradient(135deg, #1e1e2a, #252535);
      border: 1px solid #2a2a3a; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; overflow: hidden;
    }
    .ranking-cover img { width: 100%; height: 100%; object-fit: cover; }
    .ranking-info { flex: 1; min-width: 0; }
    .ranking-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ranking-meta { font-size: 0.75rem; color: #6a6a80; margin-bottom: 6px; }
    .ranking-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .ranking-btn {
      padding: 8px 18px; border-radius: 8px;
      background: rgba(124,90,240,0.15); border: 1px solid rgba(124,90,240,0.3);
      color: #9b7ef8; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .ranking-btn:hover { background: #7c5af0; color: white; }

    /* ── 우측 사이드 ── */
    .hero__right {}
    .realtime-panel {
      background: #16161d; border: 1px solid #2a2a3a; border-radius: 14px;
      overflow: hidden; margin-bottom: 16px;
    }
    .realtime-header {
      padding: 14px 18px; background: rgba(124,90,240,0.08);
      border-bottom: 1px solid #2a2a3a;
      font-weight: 700; font-size: 0.9rem;
      display: flex; align-items: center; gap: 8px;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
      animation: livePulse 1.5s infinite;
    }
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .realtime-list { padding: 8px 0; }
    .realtime-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px; cursor: pointer; transition: background 0.15s;
    }
    .realtime-item:hover { background: rgba(255,255,255,0.03); }
    .realtime-rank { font-size: 0.8rem; font-weight: 700; color: #6a6a80; min-width: 20px; }
    .realtime-rank.top3 { color: #f0c842; }
    .realtime-title { font-size: 0.875rem; font-weight: 500; flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-badge {
      font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;
      background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3);
      font-weight: 700;
    }

    /* ── 신작 섹션 ── */
    .new-section { padding: 48px 0; }
    .new-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }
    .new-item {
      cursor: pointer; transition: transform 0.2s;
    }
    .new-item:hover { transform: translateY(-4px); }
    .new-cover {
      width: 100%; aspect-ratio: 3/4; border-radius: 10px;
      background: linear-gradient(135deg, #1e1e2a, #252535);
      border: 1px solid #2a2a3a; display: flex; align-items: center;
      justify-content: center; font-size: 2.5rem; margin-bottom: 10px;
      overflow: hidden; position: relative;
    }
    .new-cover img { width: 100%; height: 100%; object-fit: cover; }
    .new-cover__fav {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.6); border: none; border-radius: 50%;
      width: 30px; height: 30px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .new-cover__fav:hover { background: rgba(240,200,66,0.3); }
    .new-title { font-size: 0.85rem; font-weight: 700; line-height: 1.3; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .new-meta { font-size: 0.72rem; color: #6a6a80; margin-bottom: 6px; }
    .new-badges { display: flex; gap: 4px; flex-wrap: wrap; }

    /* ── 소설 목록 패널 (우하단 플로팅) ── */
    .floating-novels {
      position: fixed; bottom: 24px; left: 24px; z-index: 50;
    }
    .floating-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: #7c5af0; border: none; color: white;
      font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 20px rgba(124,90,240,0.5);
      transition: all 0.2s;
    }
    .floating-btn:hover { transform: scale(1.1); background: #5b3dd0; }
    .floating-label {
      position: absolute; left: 64px; top: 50%; transform: translateY(-50%);
      background: #1e1e2a; border: 1px solid #2a2a3a; padding: 6px 12px;
      border-radius: 8px; font-size: 0.8rem; white-space: nowrap;
      color: #a0a0b8;
    }

    /* ── AI 고객센터 플로팅 ── */
    .ai-support-float {
      position: fixed; bottom: 24px; right: 24px; z-index: 50;
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    }
    .ai-chat-bubble {
      background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 14px;
      padding: 12px 16px; max-width: 240px; display: none;
    }
    .ai-chat-bubble.visible { display: block; }
    .ai-chat-bubble p { font-size: 0.8rem; color: #a0a0b8; line-height: 1.5; }
    .ai-float-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #7c5af0, #f06842);
      border: none; color: white; font-size: 1.4rem; cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,90,240,0.5); transition: all 0.2s;
    }
    .ai-float-btn:hover { transform: scale(1.1); }

    /* ── 구독 배너 ── */
    .sub-banner {
      margin-top: 16px;
      background: linear-gradient(135deg, rgba(124,90,240,0.2), rgba(240,104,66,0.15));
      border: 1px solid rgba(124,90,240,0.3); border-radius: 14px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: all 0.2s;
    }
    .sub-banner:hover { border-color: rgba(124,90,240,0.6); }
    .sub-banner__title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .sub-banner__desc { font-size: 0.8rem; color: #a0a0b8; margin-bottom: 12px; }
    .sub-banner__btn {
      background: #7c5af0; border: none; color: white;
      padding: 8px 20px; border-radius: 8px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600;
    }

    @media (max-width: 900px) {
      .hero__inner { grid-template-columns: 1fr; }
      .hero__right { order: -1; }
      .new-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    }
  </style>
</head>
<body>
  <nav id="nc-nav"></nav>

  <!-- 히어로 섹션 -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__left">
        <!-- AI 추천 -->
        <div class="hero__label">✦ AI 맞춤 추천</div>
        <div class="ai-rec">
          <div class="ai-rec__title">🤖 <span id="rec-type-label">트렌드 기반 추천</span></div>
          <div class="ai-rec__scroll" id="ai-rec-list">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>

        <!-- 장르 필터 -->
        <div class="genre-tabs" id="genre-tabs">
          <button class="genre-tab active" data-genre="">전체</button>
          <button class="genre-tab" data-genre="판타지">판타지</button>
          <button class="genre-tab" data-genre="로맨스">로맨스</button>
          <button class="genre-tab" data-genre="현대">현대</button>
          <button class="genre-tab" data-genre="무협">무협</button>
          <button class="genre-tab" data-genre="공포">공포</button>
          <button class="genre-tab" data-genre="역사">역사</button>
          <button class="genre-tab" data-genre="SF">SF</button>
        </div>

        <!-- 주간 랭킹 -->
        <div class="nc-section-header">
          <div class="nc-section-title">📊 주간 랭킹</div>
          <div style="display:flex;gap:8px;">
            <button class="nc-btn nc-btn--sm nc-btn--outline rank-type-btn active" data-type="weekly">주간</button>
            <button class="nc-btn nc-btn--sm nc-btn--outline rank-type-btn" data-type="realtime">실시간</button>
          </div>
        </div>
        <div class="ranking-list" id="ranking-list">
          <div class="nc-loading"><div class="nc-spinner"></div></div>
        </div>
      </div>

      <!-- 우측 패널 -->
      <div class="hero__right">
        <!-- 실시간 TOP 5 -->
        <div class="realtime-panel">
          <div class="realtime-header">
            <div class="live-dot"></div> 실시간 TOP 5
          </div>
          <div class="realtime-list" id="realtime-list">
            <div class="nc-loading"><div class="nc-spinner"></div></div>
          </div>
        </div>

        <!-- 로그인/로그아웃 -->
        <div id="right-auth-area"></div>

        <!-- 구독 배너 -->
        <div class="sub-banner" onclick="window.location.href='/mypage.html?tab=subscription'">
          <div class="sub-banner__title">🌟 구독 페이지</div>
          <div class="sub-banner__desc">구독하고 더 많은 혜택을 누리세요</div>
          <button class="sub-banner__btn">구독하기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 신작 추천 섹션 -->
  <section class="new-section">
    <div class="nc-container">
      <div class="nc-section-header">
        <div class="nc-section-title">✨ 신작 추천</div>
        <a href="/novel-list.html" class="nc-btn nc-btn--sm nc-btn--outline">전체 보기</a>
      </div>
      <div class="new-grid" id="new-novel-list">
        <div class="nc-loading" style="grid-column:1/-1"><div class="nc-spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- 플로팅 소설 목록 버튼 -->
  <div class="floating-novels">
    <button class="floating-btn" onclick="window.location.href='/novel-list.html'" title="소설 목록">📚</button>
    <span class="floating-label">소설 목록</span>
  </div>

  <!-- AI 고객센터 플로팅 -->
  <div class="ai-support-float" id="ai-support-float"></div>

  <!-- 포인트 충전 모달 -->
  <div class="nc-modal" id="modal-point">
    <div class="nc-modal__backdrop" onclick="Modal.close('modal-point')"></div>
    <div class="nc-modal__box">
      <button class="nc-modal__close" onclick="Modal.close('modal-point')">✕</button>
      <div class="nc-modal__title">💎 포인트 충전</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <button class="nc-btn nc-btn--outline point-opt" data-amount="1000">1,000P<br><small style="color:#6a6a80">₩1,000</small></button>
        <button class="nc-btn nc-btn--outline point-opt" data-amount="5000">5,000P<br><small style="color:#6a6a80">₩5,000</small></button>
        <button class="nc-btn nc-btn--outline point-opt" data-amount="10000">10,000P<br><small style="color:#6a6a80">₩10,000</small></button>
        <button class="nc-btn nc-btn--outline point-opt" data-amount="30000">30,000P<br><small style="color:#6a6a80">₩30,000</small></button>
      </div>
      <button class="nc-btn nc-btn--primary nc-btn--full" onclick="chargePoint()">충전하기</button>
    </div>
  </div>

  <script>
    let currentGenre = '';
    let currentRankType = 'weekly';
    let selectedPointAmt = 1000;

    async function loadAiRecommendation() {
      try {
        const res = await api.get('/ai/recommendation', Auth.isLoggedIn());
        const label = document.getElementById('rec-type-label');
        if (label) label.textContent = res.recommendationType === 'PERSONALIZED' ? '맞춤 추천' : '트렌드 기반 추천';
        renderAiRec(res.novels || res.items || []);
      } catch {
        renderAiRec([]);
      }
    }

    function renderAiRec(list) {
      const el = document.getElementById('ai-rec-list');
      if (!el) return;
      if (!list.length) {
        el.innerHTML = '<div style="color:#6a6a80;font-size:0.8rem;padding:20px">추천 소설을 불러오는 중입니다...</div>';
        return;
      }
      el.innerHTML = list.map(n => `
        <div class="ai-rec__item" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
          <div class="ai-rec__cover">
            ${n.coverImageUrl ? `<img src="${n.coverImageUrl}" alt="${n.title}">` : '📖'}
          </div>
          <div class="ai-rec__name">${n.title}</div>
          <div class="ai-rec__author">${n.authorName || ''}</div>
        </div>
      `).join('');
    }

    async function loadRanking(type = 'weekly') {
      const el = document.getElementById('ranking-list');
      el.innerHTML = '<div class="nc-loading"><div class="nc-spinner"></div></div>';
      try {
        const list = await api.get(`/novels/ranking?type=${type}`);
        el.innerHTML = list.map((n, i) => `
          <div class="ranking-item" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
            <span class="ranking-num ${i < 3 ? 'top3' : ''}">${i+1}</span>
            <div class="ranking-cover">
              ${n.coverImageUrl ? `<img src="${n.coverImageUrl}" alt="${n.title}">` : '📖'}
            </div>
            <div class="ranking-info">
              <div class="ranking-title">${n.title}</div>
              <div class="ranking-meta">${n.authorName || '알 수 없음'} · ${n.episodeCount || 0}화</div>
              <div class="ranking-badges">
                ${n.genre ? genreBadge(n.genre) : ''}
                ${n.isFree ? '<span class="nc-badge" style="background:#10b98120;color:#10b981;border:1px solid #10b98140">무료</span>' : '<span class="nc-badge" style="background:#7c5af020;color:#9b7ef8;border:1px solid #7c5af040">유료</span>'}
                ${statusBadge(n.status)}
              </div>
            </div>
            <button class="ranking-btn" onclick="event.stopPropagation();window.location.href='/novel-detail.html?id=${n.novelId}'">보기</button>
          </div>
        `).join('') || '<div class="nc-empty"><div class="nc-empty__text">랭킹 데이터가 없습니다</div></div>';
      } catch {
        el.innerHTML = '<div class="nc-empty"><div class="nc-empty__text">불러오기 실패</div></div>';
      }
    }

    async function loadRealtimeRanking() {
      const el = document.getElementById('realtime-list');
      try {
        const list = await api.get('/novels/ranking?type=realtime');
        el.innerHTML = list.slice(0,5).map((n, i) => `
          <div class="realtime-item" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
            <span class="realtime-rank ${i < 3 ? 'top3' : ''}">${i+1}</span>
            <span class="realtime-title">${n.title}</span>
            ${i < 3 ? '<span class="live-badge">LIVE</span>' : ''}
          </div>
        `).join('') || '<div class="nc-empty nc-empty__text" style="padding:16px">데이터 없음</div>';
      } catch {
        el.innerHTML = '<div style="padding:16px;color:#6a6a80;font-size:0.8rem">로드 실패</div>';
      }
    }

    async function loadNewNovels(genre = '') {
      const el = document.getElementById('new-novel-list');
      el.innerHTML = '<div class="nc-loading" style="grid-column:1/-1"><div class="nc-spinner"></div></div>';
      try {
        const params = new URLSearchParams({ type: 'new', limit: '18' });
        if (genre) params.append('genre', genre);
        const list = await api.get(`/novels?${params}`);
        if (!list?.length) {
          el.innerHTML = '<div class="nc-empty" style="grid-column:1/-1"><div class="nc-empty__icon">📚</div><div class="nc-empty__text">신작이 없습니다</div></div>';
          return;
        }
        el.innerHTML = list.map(n => `
          <div class="new-item" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
            <div class="new-cover">
              ${n.coverImageUrl ? `<img src="${n.coverImageUrl}" alt="${n.title}">` : '📖'}
              ${Auth.isLoggedIn() ? `
                <button class="new-cover__fav" onclick="event.stopPropagation();toggleBookmark(${n.novelId},this)" title="찜하기">🤍</button>
              ` : ''}
            </div>
            <div class="new-title">${n.title}</div>
            <div class="new-meta">${n.authorName || ''} · ${n.episodeCount || 1}화 업로드</div>
            <div class="new-badges">
              ${n.genre ? genreBadge(n.genre) : ''}
              ${n.isFree ? '<span class="nc-badge" style="background:#10b98120;color:#10b981;border:1px solid #10b98140">무료</span>' : ''}
            </div>
          </div>
        `).join('');
      } catch {
        el.innerHTML = '<div class="nc-empty" style="grid-column:1/-1"><div class="nc-empty__text">신작을 불러오지 못했습니다</div></div>';
      }
    }

    async function toggleBookmark(novelId, btn) {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      try {
        const res = await api.post(`/novels/${novelId}/bookmark`, {}, true);
        btn.textContent = res.isBookmarked ? '❤️' : '🤍';
        Toast.success(res.isBookmarked ? '찜했습니다!' : '찜을 취소했습니다');
      } catch (e) {
        Toast.error(e.message);
      }
    }

    function initRightAuthArea() {
      const el = document.getElementById('right-auth-area');
      if (!el) return;
      if (!Auth.isLoggedIn()) {
        el.innerHTML = `
          <div style="background:#16161d;border:1px solid #2a2a3a;border-radius:14px;padding:20px;text-align:center;margin-bottom:16px">
            <div style="font-size:1.5rem;margin-bottom:8px">👤</div>
            <div style="font-size:0.85rem;color:#a0a0b8;margin-bottom:12px">로그인하고 맞춤 추천을 받아보세요</div>
            <div style="display:flex;gap:8px;justify-content:center">
              <button class="nc-btn nc-btn--primary nc-btn--sm" onclick="window.location.href='/login.html'">로그인</button>
              <button class="nc-btn nc-btn--outline nc-btn--sm" onclick="window.location.href='/login.html?tab=logout'">로그아웃</button>
            </div>
          </div>
        `;
      }
    }

    function initAiSupport() {
      const el = document.getElementById('ai-support-float');
      if (!el) return;
      if (!Auth.isLoggedIn()) return;
      el.innerHTML = `
        <div class="ai-chat-bubble" id="ai-bubble">
          <p>AI를 활용해 궁금한 점을 물어보세요!</p>
        </div>
        <button class="ai-float-btn" id="ai-float-btn" title="AI 고객센터" onclick="toggleAiChat()">🤖</button>
      `;
    }

    function toggleAiChat() {
      const bubble = document.getElementById('ai-bubble');
      if (bubble) bubble.classList.toggle('visible');
      // AI 채팅은 /mypage.html?tab=ai 로 이동
      setTimeout(() => window.location.href='/mypage.html?tab=ai', 300);
    }

    // 장르 탭 이벤트
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.genre-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.genre-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentGenre = btn.dataset.genre;
          loadNewNovels(currentGenre);
        });
      });

      document.querySelectorAll('.rank-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.rank-type-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentRankType = btn.dataset.type;
          loadRanking(currentRankType);
        });
      });

      // 포인트 선택
      document.querySelectorAll('.point-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.point-opt').forEach(b => b.classList.remove('nc-btn--primary'));
          document.querySelectorAll('.point-opt').forEach(b => b.classList.add('nc-btn--outline'));
          btn.classList.remove('nc-btn--outline');
          btn.classList.add('nc-btn--primary');
          selectedPointAmt = parseInt(btn.dataset.amount);
        });
      });

      loadAiRecommendation();
      loadRanking('weekly');
      loadRealtimeRanking();
      loadNewNovels();
      initRightAuthArea();
      initAiSupport();
    });

    async function chargePoint() {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      try {
        const res = await api.post('/payments/prepare', { amount: selectedPointAmt }, true);
        Modal.close('modal-point');
        // PortOne SDK 연동 (실제 연동시 window.PortOne 사용)
        Toast.info('결제창을 준비 중입니다...');
        // 결제 완료 후 confirm
        await api.post('/payments/confirm', {
          paymentKey: res.paymentKey,
          amount: selectedPointAmt
        }, true);
        Toast.success(`${selectedPointAmt.toLocaleString()}P가 충전되었습니다!`);
        location.reload();
      } catch (e) {
        Toast.error(e.message || '충전 실패');
      }
    }
  </script>
</body>
</html>
