<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelCraft - 로그인</title>
    <script src="/common.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }

        #nc-nav {
            display: none;
        }

        .login-wrap {
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo a {
            font-family: 'Noto Serif KR', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-logo .logo-icon {
            color: var(--accent);
            font-size: 1.8rem;
        }

        .login-logo p {
            color: var(--text3);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
        }

        .login-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 28px;
            text-align: center;
        }

        .nc-input {
            margin-bottom: 0;
        }

        .input-group {
            position: relative;
        }

        .input-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 1rem;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text3);
            font-size: 0.8rem;
        }

        .login-divider::before, .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-btn {
            width: 100%;
            padding: 11px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: inherit;
            margin-bottom: 8px;
        }

        .social-btn:hover {
            background: var(--surface2);
        }

        .social-btn--kakao {
            border-color: #FEE500;
            color: #3c1e1e;
            background: #FEE500;
        }

        .social-btn--kakao:hover {
            background: #fdd835;
        }

        .social-btn--naver {
            border-color: #03C75A;
            color: white;
            background: #03C75A;
        }

        .social-btn--naver:hover {
            background: #02b04f;
        }

        .social-btn--google {
            border-color: #4285F4;
        }

        .social-btn--google:hover {
            background: rgba(66, 133, 244, 0.1);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text3);
            font-size: 0.85rem;
        }

        .login-footer a {
            color: var(--primary-light);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .restore-card {
            background: rgba(240, 200, 66, 0.08);
            border: 1px solid rgba(240, 200, 66, 0.25);
            border-radius: var(--radius);
            padding: 16px;
            margin-top: 16px;
            display: none;
        }

        .restore-card p {
            font-size: 0.85rem;
            color: var(--warning);
            margin-bottom: 10px;
        }

        .restore-btns {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
<nav id="nc-nav"></nav>
<div class="login-wrap">
    <div class="login-logo">
        <a href="/index.html"><span class="logo-icon">✦</span> NovelCraft</a>
        <p>소설의 모든 것을 담다</p>
    </div>

    <div class="login-card">
        <div class="login-title">로그인</div>

        <div class="nc-form-group">
            <label class="nc-label">이메일</label>
            <input type="email" id="login-email" class="nc-input" placeholder="이메일을 입력하세요" autocomplete="email">
        </div>
        <div class="nc-form-group">
            <label class="nc-label">비밀번호</label>
            <div class="input-group">
                <input type="password" id="login-pw" class="nc-input" placeholder="비밀번호를 입력하세요"
                       autocomplete="current-password"
                       onkeydown="if(event.key==='Enter')doLogin()">
                <button class="input-toggle" onclick="togglePw('login-pw',this)">👁</button>
            </div>
        </div>

        <button class="nc-btn nc-btn--primary nc-btn--full nc-btn--lg" onclick="doLogin()" id="login-btn">
            로그인
        </button>

        <!-- 계정 복구 안내 (탈퇴 후 30일 이내) -->
        <div class="restore-card" id="restore-card">
            <p>⚠️ 탈퇴 처리 중인 계정입니다. 30일 이내 복구 가능합니다.</p>
            <div class="restore-btns">
                <button class="nc-btn nc-btn--sm nc-btn--primary" onclick="restoreAccount()">계정 복구</button>
                <button class="nc-btn nc-btn--sm nc-btn--danger" onclick="abandonAccount()">즉시 파기</button>
            </div>
        </div>

        <div class="login-divider">또는 소셜 로그인</div>

        <button class="social-btn social-btn--kakao" onclick="socialLogin('kakao')">
            <span>💬</span> 카카오로 로그인
        </button>
        <button class="social-btn social-btn--naver" onclick="socialLogin('naver')">
            <span>N</span> 네이버로 로그인
        </button>
        <button class="social-btn social-btn--google" onclick="socialLogin('google')">
            <span>🔵</span> Google로 로그인
        </button>

        <div class="login-footer">
            계정이 없으신가요? <a href="/signup.html">회원가입</a>
        </div>
    </div>
</div>

<script>
    let recoveryToken = null;

    const p = new URLSearchParams(location.search);
    const oauthToken = p.get('accessToken');
    if (oauthToken) {
        Auth.setToken(decodeURIComponent(oauthToken));
        // me API로 유저 정보 저장 후 메인으로
        api.get('/auth/users/me', true).then(me => {
            Auth.setUser({id: me.id, nickname: me.nickname, email: me.email, role: me.role});
            window.location.href = '/index.html';
        }).catch(() => window.location.href = '/index.html');
    }

    // 이미 로그인된 경우 메인으로
    if (Auth.isLoggedIn()) window.location.href = '/index.html';

    // URL 파라미터 처리
    const params = new URLSearchParams(location.search);
    if (params.get('tab') === 'logout') {
        Auth.removeToken();
        Auth.removeUser();
    }

    function togglePw(id, btn) {
        const input = document.getElementById(id);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁';
        }
    }

    async function doLogin() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-pw').value;
        if (!email || !password) {
            Toast.error('이메일과 비밀번호를 입력하세요');
            return;
        }

        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = '로그인 중...';

        try {
            const res = await api.post('/auth/login', {email, password});
            Auth.setToken(res.accessToken.replace('Bearer ', ''));          // Bearer 제거 후 저장
            localStorage.setItem('refreshToken', res.refreshToken);         // refreshToken은 그대로
            Auth.setUser({
                id: res.userId,
                nickname: res.nickname,
                email: res.email,
                role: res.role,
                point: res.point,
            });
            Toast.success('로그인 성공!');
            const redirect = params.get('redirect') || '/index.html';
            setTimeout(() => window.location.href = redirect, 800);
        } catch (e) {
            const msg = e.message || '';
            if (msg.includes('탈퇴') || msg.includes('복구')) {
                // 탈퇴 처리 중 계정
                document.getElementById('restore-card').style.display = 'block';
                recoveryToken = e.recoveryToken;
            } else {
                Toast.error(msg || '로그인 실패. 이메일/비밀번호를 확인하세요.');
            }
            btn.disabled = false;
            btn.textContent = '로그인';
        }
    }

    async function restoreAccount() {
        if (!recoveryToken) return;
        try {
            await api.patch('/auth/users/restore', {recoveryToken});
            Toast.success('계정이 복구되었습니다!');
            document.getElementById('restore-card').style.display = 'none';
        } catch (e) {
            Toast.error(e.message || '복구 실패');
        }
    }

    async function abandonAccount() {
        if (!recoveryToken) return;
        if (!confirm('정말 계정을 완전히 파기하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
        try {
            await api.patch('/auth/users/abandon-recovery', {recoveryToken});
            Toast.success('계정이 파기되었습니다. 신규 가입이 가능합니다.');
            document.getElementById('restore-card').style.display = 'none';
        } catch (e) {
            Toast.error(e.message || '파기 실패');
        }
    }

    function socialLogin(provider) {
        // OAuth 리다이렉트 (백엔드 OAuth 엔드포인트로 이동)
        window.location.href = `/oauth2/authorization/${provider}`;
    }
</script>
</body>
</html>
