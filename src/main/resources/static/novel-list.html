<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelCraft - 소설 목록</title>
  <script src="/common.js"></script>
  <style>
    .page-wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }

    /* 필터 바 */
    .filter-bar {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px 24px; margin-bottom: 28px;
      display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
    }
    .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 140px; }
    .filter-label { font-size: 0.75rem; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
    .filter-select {
      padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer;
      font-family: inherit;
    }
    .filter-select:focus { outline: none; border-color: var(--primary); }
    .filter-search { flex: 1; min-width: 200px; }
    .filter-search-input {
      width: 100%; padding: 8px 14px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.875rem; font-family: inherit;
    }
    .filter-search-input:focus { outline: none; border-color: var(--primary); }
    .filter-btns { display: flex; gap: 8px; align-items: flex-end; }

    /* 소설 그리드 */
    .novel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px;
    }
    .novel-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; cursor: pointer;
      transition: all 0.25s;
    }
    .novel-card:hover {
      transform: translateY(-4px);
      border-color: rgba(124,90,240,0.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .novel-cover {
      width: 100%; aspect-ratio: 3/4; background: linear-gradient(135deg, var(--surface2), var(--bg3));
      display: flex; align-items: center; justify-content: center; font-size: 3rem;
      overflow: hidden; position: relative;
    }
    .novel-cover img { width: 100%; height: 100%; object-fit: cover; }
    .novel-cover__overlay {
      position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%);
      display: flex; align-items: flex-end; padding: 12px; opacity: 0; transition: opacity 0.2s;
    }
    .novel-card:hover .novel-cover__overlay { opacity: 1; }
    .novel-cover__actions { display: flex; gap: 6px; }
    .cover-action-btn {
      padding: 6px 12px; border-radius: 6px; border: none;
      background: rgba(255,255,255,0.9); color: #0f0f13;
      font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .cover-action-btn:hover { background: white; }

    .novel-body { padding: 14px; }
    .novel-title {
      font-weight: 700; font-size: 0.95rem; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.35;
    }
    .novel-author { font-size: 0.75rem; color: var(--text3); margin-bottom: 8px; }
    .novel-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .novel-stats {
      display: flex; gap: 12px; font-size: 0.72rem; color: var(--text3); padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .novel-stat { display: flex; align-items: center; gap: 3px; }

    /* 태그 검색 */
    .tag-search-section {
      margin-bottom: 20px; padding: 16px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .tag-search-title { font-size: 0.8rem; font-weight: 600; color: var(--text3); margin-bottom: 10px; }
    .popular-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .popular-tag {
      padding: 4px 12px; border-radius: 16px; border: 1px solid var(--border);
      background: transparent; color: var(--text3); font-size: 0.75rem;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .popular-tag:hover { border-color: var(--primary); color: var(--primary-light); }
    .popular-tag.selected { background: var(--primary); border-color: var(--primary); color: white; }

    /* 결과 헤더 */
    .results-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .results-count { font-size: 0.875rem; color: var(--text3); }
    .results-count strong { color: var(--text); }
    .sort-select {
      padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.8rem; cursor: pointer;
      font-family: inherit;
    }

    @media (max-width: 768px) {
      .filter-bar { flex-direction: column; }
      .novel-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
  <nav id="nc-nav"></nav>

  <div class="page-wrap">
    <!-- 필터 바 -->
    <div class="filter-bar">
      <div class="filter-group filter-search">
        <label class="filter-label">검색</label>
        <input type="text" id="kw-input" class="filter-search-input" placeholder="소설 제목, 작가명 검색..."
          value="" onkeydown="if(event.key==='Enter')applySearch()">
      </div>
      <div class="filter-group">
        <label class="filter-label">장르</label>
        <select class="filter-select" id="filter-genre">
          <option value="">전체</option>
          <option value="판타지">판타지</option>
          <option value="로맨스">로맨스</option>
          <option value="현대">현대</option>
          <option value="무협">무협</option>
          <option value="공포">공포</option>
          <option value="역사">역사</option>
          <option value="SF">SF</option>
          <option value="일상">일상</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">상태</label>
        <select class="filter-select" id="filter-status">
          <option value="">전체</option>
          <option value="ONGOING">연재중</option>
          <option value="COMPLETED">완결</option>
          <option value="HIATUS">중단</option>
        </select>
      </div>
      <div class="filter-btns">
        <button class="nc-btn nc-btn--primary" onclick="applySearch()">🔍 검색</button>
        <button class="nc-btn nc-btn--outline" onclick="resetFilter()">초기화</button>
      </div>
    </div>

    <!-- 인기 태그 -->
    <div class="tag-search-section">
      <div class="tag-search-title">🏷️ 인기 태그로 검색</div>
      <div class="popular-tags" id="popular-tags">
        <div class="nc-loading" style="padding:0"><div class="nc-spinner" style="width:20px;height:20px;border-width:2px"></div></div>
      </div>
    </div>

    <!-- 결과 헤더 -->
    <div class="results-header">
      <div class="results-count" id="results-count">소설을 불러오는 중...</div>
      <select class="sort-select" id="sort-select" onchange="applySearch()">
        <option value="createdAt">최신순</option>
        <option value="viewCount">조회순</option>
        <option value="likeCount">좋아요순</option>
      </select>
    </div>

    <!-- 소설 그리드 -->
    <div class="novel-grid" id="novel-grid">
      <div class="nc-loading" style="grid-column:1/-1"><div class="nc-spinner"></div></div>
    </div>

    <!-- 페이지네이션 -->
    <div class="nc-pagination" id="pagination"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(location.search);
    let currentPage = 0;
    let totalPages = 0;
    let selectedTags = [];
    let isTagSearch = false;

    async function loadPopularTags() {
      try {
        const tags = await api.get('/search/tags/popular');
        const el = document.getElementById('popular-tags');
        el.innerHTML = tags.map(t => `
          <button class="popular-tag" onclick="toggleTag('${t}',this)">${t}</button>
        `).join('');
      } catch {
        document.getElementById('popular-tags').innerHTML = '<span style="color:var(--text3);font-size:0.8rem">태그를 불러올 수 없습니다</span>';
      }
    }

    function toggleTag(tag, btn) {
      const idx = selectedTags.indexOf(tag);
      if (idx === -1) { selectedTags.push(tag); btn.classList.add('selected'); }
      else { selectedTags.splice(idx, 1); btn.classList.remove('selected'); }
      if (selectedTags.length > 0) { isTagSearch = true; loadByTags(); }
      else { isTagSearch = false; applySearch(); }
    }

    async function loadByTags() {
      const grid = document.getElementById('novel-grid');
      grid.innerHTML = '<div class="nc-loading" style="grid-column:1/-1"><div class="nc-spinner"></div></div>';
      try {
        const params = selectedTags.map(t => `tags=${encodeURIComponent(t)}`).join('&');
        const res = await api.get(`/search/v2/tags?${params}`, Auth.isLoggedIn());
        const allNovels = res.flatMap(group => group.novels || []);
        renderGrid(allNovels, allNovels.length);
      } catch { grid.innerHTML = '<div class="nc-empty" style="grid-column:1/-1"><div class="nc-empty__text">태그 검색 실패</div></div>'; }
    }

    async function applySearch(page = 0) {
      if (isTagSearch) return;
      const kw = document.getElementById('kw-input').value.trim();
      const genre = document.getElementById('filter-genre').value;
      const status = document.getElementById('filter-status').value;
      const sort = document.getElementById('sort-select').value;
      currentPage = page;

      const grid = document.getElementById('novel-grid');
      grid.innerHTML = '<div class="nc-loading" style="grid-column:1/-1"><div class="nc-spinner"></div></div>';

      try {
        let res;
        if (kw) {
          // 키워드 검색
          const p = new URLSearchParams({ keyword: kw, page, size: 16, sort, direction: 'DESC' });
          res = await api.get(`/search/v2/novels?${p}`, Auth.isLoggedIn());
          renderGrid(res.content || [], res.totalElements || 0, res.totalPages || 0);
        } else {
          // 목록 조회
          const p = new URLSearchParams({ page, size: 16, sort, direction: 'DESC' });
          if (genre) p.append('genre', genre);
          if (status) p.append('status', status);
          res = await api.get(`/v2/novels?${p}`);
          renderGrid(res.content || [], res.totalElements || 0, res.totalPages || 0);
        }
      } catch {
        grid.innerHTML = '<div class="nc-empty" style="grid-column:1/-1"><div class="nc-empty__icon">😥</div><div class="nc-empty__text">소설을 불러오지 못했습니다</div></div>';
      }
    }

    function renderGrid(novels, total, pages = 0) {
      totalPages = pages;
      document.getElementById('results-count').innerHTML = `총 <strong>${total.toLocaleString()}</strong>편의 소설`;
      const grid = document.getElementById('novel-grid');
      if (!novels.length) {
        grid.innerHTML = '<div class="nc-empty" style="grid-column:1/-1"><div class="nc-empty__icon">📭</div><div class="nc-empty__text">검색 결과가 없습니다</div></div>';
        return;
      }
      grid.innerHTML = novels.map(n => `
        <div class="novel-card" onclick="window.location.href='/novel-detail.html?id=${n.novelId}'">
          <div class="novel-cover">
            ${n.coverImageUrl ? `<img src="${n.coverImageUrl}" alt="${n.title}">` : '📖'}
            <div class="novel-cover__overlay">
              <div class="novel-cover__actions">
                <button class="cover-action-btn" onclick="event.stopPropagation();window.location.href='/novel-detail.html?id=${n.novelId}'">보기</button>
                ${Auth.isLoggedIn() ? `<button class="cover-action-btn" onclick="event.stopPropagation();bookmarkCard(${n.novelId},this)">🤍</button>` : ''}
              </div>
            </div>
          </div>
          <div class="novel-body">
            <div class="novel-title">${n.title}</div>
            <div class="novel-author">${n.authorName || '알 수 없음'}</div>
            <div class="novel-tags">
              ${n.genre ? genreBadge(n.genre) : ''}
              ${n.isFree ? '<span class="nc-badge" style="background:#10b98120;color:#10b981;border:1px solid #10b98140">무료</span>' : '<span class="nc-badge" style="background:#7c5af020;color:#9b7ef8;border:1px solid #7c5af040">유료</span>'}
              ${statusBadge(n.status)}
            </div>
            <div class="novel-stats">
              <span class="novel-stat">👁 ${formatNum(n.viewCount)}</span>
              <span class="novel-stat">❤️ ${formatNum(n.likeCount)}</span>
              <span class="novel-stat">📖 ${n.episodeCount || 0}화</span>
            </div>
          </div>
        </div>
      `).join('');
      renderPagination(pages);
    }

    function renderPagination(pages) {
      const el = document.getElementById('pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }
      let html = '';
      if (currentPage > 0) html += `<button class="nc-page-btn" onclick="applySearch(${currentPage-1})">‹</button>`;
      for (let i = Math.max(0, currentPage-2); i <= Math.min(pages-1, currentPage+2); i++) {
        html += `<button class="nc-page-btn ${i===currentPage?'active':''}" onclick="applySearch(${i})">${i+1}</button>`;
      }
      if (currentPage < pages-1) html += `<button class="nc-page-btn" onclick="applySearch(${currentPage+1})">›</button>`;
      el.innerHTML = html;
    }

    async function bookmarkCard(id, btn) {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      try {
        const res = await api.post(`/novels/${id}/bookmark`, {}, true);
        btn.textContent = res.isBookmarked ? '❤️' : '🤍';
        Toast.success(res.isBookmarked ? '찜했습니다!' : '찜 취소');
      } catch (e) { Toast.error(e.message); }
    }

    function resetFilter() {
      document.getElementById('kw-input').value = '';
      document.getElementById('filter-genre').value = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('sort-select').value = 'createdAt';
      selectedTags = [];
      isTagSearch = false;
      document.querySelectorAll('.popular-tag').forEach(t => t.classList.remove('selected'));
      applySearch();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // URL 파라미터 복원
      const kw = urlParams.get('keyword');
      if (kw) document.getElementById('kw-input').value = kw;
      const genre = urlParams.get('genre');
      if (genre) document.getElementById('filter-genre').value = genre;

      loadPopularTags();
      applySearch();
    });
  </script>
</body>
</html>
