# 로컬 개발 환경 - standalone Redis (포트 6379)
# 배포 환경(Sentinel)은 application-prod.yml 또는 환경변수로 관리
spring:
  cloud:
    aws:
      credentials:
        access-key: 본인_ACCESS_KEY
        secret-key: 본인_SECRET_KEY
      region:
        static: ap-northeast-2
  data:
    redis:
      url: redis://localhost:6379
      sentinel:
        master: ""
        nodes: ""

redisson:
  mode: standalone
