name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Gradle Build
        run: ./gradlew build -x test

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECR 로그인
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 123865824090.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Docker 이미지 빌드 & ECR 푸시
        env:
          ECR_REGISTRY: 123865824090.dkr.ecr.ap-northeast-2.amazonaws.com
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest .
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

      - name: 배포 파일 S3 업로드
        run: |
          aws s3 cp docker-compose.yml s3://novelcraft-dev-media-123865824090/deploy/docker-compose.yml
          aws s3 cp init/pgvector-init.sh s3://novelcraft-dev-media-123865824090/deploy/init/pgvector-init.sh
          aws s3 cp monitoring/kafka-jmx-config.yml s3://novelcraft-dev-media-123865824090/deploy/monitoring/kafka-jmx-config.yml
          aws s3 cp monitoring/prometheus.yml s3://novelcraft-dev-media-123865824090/deploy/monitoring/prometheus.yml

      - name: SSM으로 EC2 배포
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 123865824090.dkr.ecr.ap-northeast-2.amazonaws.com",
              "mkdir -p /home/ubuntu/init /home/ubuntu/monitoring",
              "aws s3 cp s3://novelcraft-dev-media-123865824090/deploy/docker-compose.yml /home/ubuntu/docker-compose.yml",
              "aws s3 cp s3://novelcraft-dev-media-123865824090/deploy/init/pgvector-init.sh /home/ubuntu/init/pgvector-init.sh",
              "aws s3 cp s3://novelcraft-dev-media-123865824090/deploy/monitoring/kafka-jmx-config.yml /home/ubuntu/monitoring/kafka-jmx-config.yml",
              "aws s3 cp s3://novelcraft-dev-media-123865824090/deploy/monitoring/prometheus.yml /home/ubuntu/monitoring/prometheus.yml",
              "chmod +x /home/ubuntu/init/pgvector-init.sh",
              "cd /home/ubuntu && docker compose pull && docker compose up -d"
            ]' \
            --region ${{ secrets.AWS_REGION }}