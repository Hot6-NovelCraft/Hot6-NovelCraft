name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Gradle Build
        run: ./gradlew build -x test

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECR 로그인
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 123865824090.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Docker 이미지 빌드 & 푸시
        env:
          ECR_REGISTRY: 123865824090.dkr.ecr.ap-northeast-2.amazonaws.com
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest .
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

      - name: docker-compose.yml EC2로 전송
        run: |
          CONTENT=$(base64 -w 0 docker-compose.yml)
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["echo $CONTENT | base64 -d > /home/ubuntu/docker-compose.yml"] \
            --region ${{ secrets.AWS_REGION }} \
            --wait

      - name: SSM으로 EC2 배포
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu && docker compose pull && docker compose up -d"]' \
            --region ${{ secrets.AWS_REGION }}