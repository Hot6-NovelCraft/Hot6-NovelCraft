version: '3.8'

services:
  # --------------------------
  # Redis Master (Port: 6379)
  # --------------------------
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --protected-mode no
    networks:
      redis-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  # --------------------------
  # Redis Slave 1 (Port: 6380)
  # --------------------------
  redis-slave-1:
    image: redis:7-alpine
    container_name: redis-slave-1
    ports:
      - "6380:6380"
    command: redis-server --port 6380 --appendonly yes --replicaof redis-master 6379 --protected-mode no
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-net

  # --------------------------
  # Redis Slave 2 (Port: 6381)
  # --------------------------
  redis-slave-2:
    image: redis:7-alpine
    container_name: redis-slave-2
    ports:
      - "6381:6381"
    command: redis-server --port 6381 --appendonly yes --replicaof redis-master 6379 --protected-mode no
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-net

  # --------------------------
  # Redis Sentinel 1 (Port: 26379)
  # --------------------------
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    command: >
      sh -c "echo 'port 26379' > /tmp/sentinel.conf &&
      echo 'protected-mode no' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-ip 172.20.0.11' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-port 26379' >> /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster 172.20.0.10 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      redis-net:
        ipv4_address: 172.20.0.11

  # --------------------------
  # Redis Sentinel 2 (Port: 26380)
  # --------------------------
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26380"
    command: >
      sh -c "echo 'port 26380' > /tmp/sentinel.conf &&
      echo 'protected-mode no' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-ip 172.20.0.12' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-port 26380' >> /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster 172.20.0.10 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      redis-net:
        ipv4_address: 172.20.0.12

  # --------------------------
  # Redis Sentinel 3 (Port: 26381)
  # --------------------------
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26381"
    command: >
      sh -c "echo 'port 26381' > /tmp/sentinel.conf &&
      echo 'protected-mode no' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-ip 172.20.0.13' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-port 26381' >> /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster 172.20.0.10 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      redis-net:
        ipv4_address: 172.20.0.13

  # --------------------------
  # Broker 1 (Node ID: 1)
  # --------------------------
  kafka-1:
    image: apache/kafka:3.9.2
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - kafka-net

  # --------------------------
  # Broker 2 (Node ID: 2)
  # --------------------------
  kafka-2:
    image: apache/kafka:3.9.2
    container_name: kafka-2
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - kafka-net

  # --------------------------
  # Broker 3 (Node ID: 3)
  # --------------------------
  kafka-3:
    image: apache/kafka:3.9.2
    container_name: kafka-3
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - kafka-net

  # --------------------------
  # Kafka UI
  # --------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_METADATAPROVIDER: "KAFKA"
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - kafka-net

  # --------------------------
  # Kafka JMX Exporter - kafka-1 (Port: 5556)
  # --------------------------
  kafka-1-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-1-jmx-exporter
    ports:
      - "5556:5556"
    environment:
      JMX_HOST: kafka-1
      JMX_PORT: 9999
      EXPORTER_PORT: 5556
    volumes:
      - ./monitoring/kafka-jmx-config.yml:/opt/bitnami/jmx-exporter/config.yml
    depends_on:
      - kafka-1
    networks:
      - kafka-net

  # --------------------------
  # Kafka JMX Exporter - kafka-2 (Port: 5557)
  # --------------------------
  kafka-2-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-2-jmx-exporter
    ports:
      - "5557:5556"
    environment:
      JMX_HOST: kafka-2
      JMX_PORT: 9999
      EXPORTER_PORT: 5556
    volumes:
      - ./monitoring/kafka-jmx-config.yml:/opt/bitnami/jmx-exporter/config.yml
    depends_on:
      - kafka-2
    networks:
      - kafka-net

  # --------------------------
  # Kafka JMX Exporter - kafka-3 (Port: 5558)
  # --------------------------
  kafka-3-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-3-jmx-exporter
    ports:
      - "5558:5556"
    environment:
      JMX_HOST: kafka-3
      JMX_PORT: 9999
      EXPORTER_PORT: 5556
    volumes:
      - ./monitoring/kafka-jmx-config.yml:/opt/bitnami/jmx-exporter/config.yml
    depends_on:
      - kafka-3
    networks:
      - kafka-net

  # --------------------------
  # Prometheus (메트릭 수집)
  # --------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9095:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - kafka-1-jmx-exporter
      - kafka-2-jmx-exporter
      - kafka-3-jmx-exporter
    networks:
      - kafka-net

  # --------------------------
  # Grafana (시각화 대시보드)
  # --------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kafka-net

  # --------------------------
  # PostgreSQL + pgvector (AI 벡터 스토어용)
  # --------------------------
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: novelcraft_vectors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init/pgvector-init.sh:/docker-entrypoint-initdb.d/pgvector-init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d novelcraft_vectors" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pgvector-net

  # --------------------------
  # Spring Boot App (ECR 이미지)
  # --------------------------
  app:
    image: 123865824090.dkr.ecr.ap-northeast-2.amazonaws.com/novelcraft-dev-app:latest
    container_name: novelcraft-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # MySQL RDS
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

      # Redis Sentinel
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26380,redis-sentinel-3:26381
      REDISSON_MODE: sentinel

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: novelcraft-group
      NOTIFICATION_KAFKA_TOPIC: notification-topic
      COVER_KAFKA_TOPIC: cover-topic
      AI_REVIEW_KAFKA_TOPIC: ai-review-topic

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # AWS S3 (IAM Role 자동감지, region만 필요)
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2
      SPRING_CLOUD_AWS_S3_BUCKET: novelcraft-dev-media-123865824090

      # PgVector
      PGVECTOR_DATASOURCE_URL: jdbc:postgresql://postgres-vector:5432/novelcraft_vectors
      PGVECTOR_DATASOURCE_USERNAME: postgres
      PGVECTOR_DATASOURCE_PASSWORD: postgres

      # OAuth2 / Frontend
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}

      # PortOne
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}

      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # AES 암호화
      ENCRYPTION_AES_SECRET_KEY: ${ENCRYPTION_AES_SECRET_KEY}

      # 국립도서관 API
      NATIONALLIBRARY_API_KEY: ${NATIONALLIBRARY_API_KEY}
      NATIONALLIBRARY_API_URL: https://data4library.kr/api

      # CoolSMS
      COOLSMS_API_KEY: ${COOLSMS_API_KEY}
      COOLSMS_SECRET_KEY: ${COOLSMS_SECRET_KEY}
      COOLSMS_SEND_NUMBER: ${COOLSMS_SEND_NUMBER}
      COOLSMS_TEST_MODE: "true"

      # Spring AI OpenAI
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY}

      # OAuth2 Google
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI: http://novelcraft-dev-alb-336387969.ap-northeast-2.elb.amazonaws.com/login/oauth2/code/google
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE: email,profile

      # OAuth2 Kakao
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI: http://novelcraft-dev-alb-336387969.ap-northeast-2.elb.amazonaws.com/login/oauth2/code/kakao
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_SCOPE: account_email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_AUTHENTICATION_METHOD: client_secret_post
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_AUTHORIZATION_URI: https://kauth.kakao.com/oauth/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_TOKEN_URI: https://kauth.kakao.com/oauth/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_INFO_URI: https://kapi.kakao.com/v2/user/me
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_NAME_ATTRIBUTE: id

      # OAuth2 Naver
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_REDIRECT_URI: http://novelcraft-dev-alb-336387969.ap-northeast-2.elb.amazonaws.com/login/oauth2/code/naver
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_SCOPE: email
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_NAVER_AUTHORIZATION_URI: https://nid.naver.com/oauth2.0/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_NAVER_TOKEN_URI: https://nid.naver.com/oauth2.0/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_NAVER_USER_INFO_URI: https://openapi.naver.com/v1/nid/me
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_NAVER_USER_NAME_ATTRIBUTE: response

    depends_on:
      redis-master:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
    networks:
      - redis-net
      - kafka-net
      - pgvector-net
    restart: unless-stopped

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  prometheus_data:
  grafana_data:
  pgvector_data:

networks:
  kafka-net:
    driver: bridge
  redis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  pgvector-net:
    driver: bridge